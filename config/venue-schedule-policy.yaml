schema_version: 1
scope:
  dag_path_prefix: dags/tennis_dags/sz_tennis/
  description: Production tennis venue inspection DAGs.
default_schedule: every_1_minutes
default_interval_seconds: 60
exceptions:
  深圳湾网球场巡检:
    schedule: every_2_minutes
    interval_seconds: 120
    reason: >-
      User-approved on 2026-10-20 to reduce CRLand API polling to every two
      minutes from 08:00 (inclusive) to 21:00 (exclusive), Asia/Shanghai.
  大湾区网球场巡检:
    schedule: every_3_minutes
    interval_seconds: 180
    reason: >-
      User-approved on 2026-10-20 to reduce CRLand API polling to every three
      minutes from 08:00 (inclusive) to 21:00 (exclusive), Asia/Shanghai.
  大沙河免费场巡检:
    schedule: every_15_seconds
    interval_seconds: 15
    reason: Business-approved low-latency polling for rapidly released free-court inventory.
  大沙河国际网球中心巡检:
    schedule: every_2_minutes
    interval_seconds: 120
    reason: Business-approved two-minute cadence for Raspberry Pi Chromium scraping.
  香蜜体育中心网球场巡检:
    schedule: "0-59/6 * * * *"
    interval_seconds: 360
    reason: >-
      Owner-approved on 2026-11-26: the three ftty.ydmap.cn venues share one
      host, which challenged three back-to-back loads. Each runs every six
      minutes at offsets 0/2/4, so the host sees one page load every two
      minutes, the cadence Dashah has sustained.
  黄木岗网球中心巡检:
    schedule: "2-59/6 * * * *"
    interval_seconds: 360
    reason: >-
      Owner-approved on 2026-11-26: the three ftty.ydmap.cn venues share one
      host, which challenged three back-to-back loads. Each runs every six
      minutes at offsets 0/2/4, so the host sees one page load every two
      minutes, the cadence Dashah has sustained.
  莲花体育中心网球场巡检:
    schedule: "4-59/6 * * * *"
    interval_seconds: 360
    reason: >-
      Owner-approved on 2026-11-26: the three ftty.ydmap.cn venues share one
      host, which challenged three back-to-back loads. Each runs every six
      minutes at offsets 0/2/4, so the host sees one page load every two
      minutes, the cadence Dashah has sustained.
  宝安网球中心巡检:
    schedule: "1-59/5 * * * *"
    interval_seconds: 300
    reason: >-
      Owner-approved on 2026-11-26: run every five minutes in an isolated
      Airflow pool (ydmap_baoti_browser) and isolated Raspberry Pi Chromium
      debug port/lock using isz_https_proxies.txt only, rotating outdoor,
      indoor and wind/rain (fifteen minutes per product) without interfering
      with Dashah or Futian inspections.
change_control:
  new_venues_use_default: true
  exceptions_require:
    - explicit_policy_entry
    - documented_rationale
    - regression_test_update
