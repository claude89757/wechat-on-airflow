      - sender_agent/app.py
      - wechat_sender/appium_text_sender.py
      - deploy/systemd/appium-6002.override.conf
      - deploy/systemd/wechat-sender.service
      - scripts/install_wechat_sender.sh
      - docker/sender/Dockerfile
      - docker/sender/requirements.lock
      - docker-compose.sender.yml
    endpoint_config: WECHAT_SEND_API_URL
    runtime_owner: android_device_host
    external_services:
      - appium
      - android_device
      - wechat
    invariants:
      - public_http_contract_has_no_token
      - one_process_per_device_lock
      - concurrent_requests_wait_in_a_bounded_device_queue
      - automatic_restart_and_healthcheck
      - protected_adb_diagnosis_and_recovery
