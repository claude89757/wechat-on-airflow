    fresh_start_policy: preserve
  NSWTT_API_CONFIG:
    type: json_object
    required_by: [大沙河免费场巡检]
    sensitive: true
    required_fields:
      - app_version
      - cookie
  PI_DEVICE_SSH:
    type: json_object
    required_by: [大沙河国际网球中心巡检]
    sensitive: true
    required_fields:
      - host
      - port
      - username
      - password
      - host_key_sha256
