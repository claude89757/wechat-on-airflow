schema_version: 1
values_are_documented: false
connections: {}
variables:
  APPIUM_SERVER_LIST:
    type: json_list
    required_by: [zacks_phone_daily_reboot]
    sensitive: true
    login_info_required_fields:
      - device_ip
      - username
      - password
      - port
      - host_key_sha256
  GIT_TOKEN:
    type: string
    required_by: [HTTPS可用代理巡检, HTTPS可用代理巡检_ydmap]
    sensitive: true
  JDWX_PROXY_CACHE:
    type: json_list
    required_by: [深圳金地网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  NSWTT_API_CONFIG:
    type: json_object
    required_by: [大沙河免费场巡检]
    sensitive: true
    required_fields:
      - app_version
      - cookie
  SZW_API_AUTHORIZATION:
    type: string
    required_by: [深圳湾网球场巡检, 大湾区网球场巡检]
    sensitive: true
  SYSH_PROXY_CACHE:
    type: json_list
    required_by: [上越沙河网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  TOPS_PROXY_CACHE:
    type: json_list
    required_by: [TOPS科技园网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  TYZX_SUCCESSFUL_PROXIES_CACHE:
    type: json_list
    required_by: [深圳市体育中心网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  SZ_TENNIS_CHATROOMS:
    type: newline_separated_string
    required_by:
      - 深圳湾网球场巡检
      - 大湾区网球场巡检
      - 深圳金地网球场巡检
      - 上越沙河网球场巡检
      - TOPS科技园网球场巡检
    sensitive: true
  SZ_TYZX_TENNIS_CHATROOMS:
    type: newline_separated_string
    required_by: [深圳市体育中心网球场巡检]
    sensitive: true
  WECHAT_SEND_API_URL:
    type: url
    required_by: [wechat_delivery]
    sensitive: true
  WECHAT_SEND_DEVICE_NAME:
    type: string
    required_by: [wechat_delivery]
    sensitive: true
  WECHAT_SEND_FALLBACK_MAX_ITEMS:
    type: positive_integer
    required_by: [wechat_delivery]
    sensitive: false
    default: 200
  WECHAT_SEND_FALLBACK_OUTBOX:
    type: json_list
    required_by: [wechat_delivery]
    sensitive: true
    managed_by_application: true
    fresh_start_policy: reset
  WECHAT_SEND_RETRY_COUNT:
    type: positive_integer
    required_by: [wechat_delivery]
    sensitive: false
    default: 4
  WECHAT_SEND_RETRY_DELAY_SECONDS:
    type: non_negative_number
    required_by: [wechat_delivery]
    sensitive: false
    default: 5
  WECHAT_SEND_TIMEOUT_SECONDS:
    type: positive_integer
    required_by: [wechat_delivery]
    sensitive: false
    default: 210
  WECHAT_BOOKING_LINK_LAST_SENT:
    type: json_object
    required_by: [wechat_delivery]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
    default: {}
  WEBAPP_OBSERVATION_API_URL:
    type: url
    required_by: [webapp_observation]
    sensitive: false
  WEBAPP_OBSERVATION_API_TOKEN:
    type: string
    required_by: [webapp_observation]
    sensitive: true
  WEBAPP_OBSERVATION_TIMEOUT_SECONDS:
    type: positive_number
    required_by: [webapp_observation]
    sensitive: false
    default: 5
  TOPS科技园网球场:
    type: json_list
    required_by: [TOPS科技园网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  上越沙河网球场:
    type: json_list
    required_by: [上越沙河网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  深圳市体育中心网球场:
    type: json_list
    required_by: [深圳市体育中心网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  深圳湾网球场:
    type: json_list
    required_by: [深圳湾网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
  大湾区网球场:
    type: json_list
    required_by: [大湾区网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
    default: []
  大沙河免费场:
    type: json_list
    required_by: [大沙河免费场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
    default: []
  金地威新网球场:
    type: json_list
    required_by: [深圳金地网球场巡检]
    sensitive: false
    managed_by_application: true
    fresh_start_policy: preserve
