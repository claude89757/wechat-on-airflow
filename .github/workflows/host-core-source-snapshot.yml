name: Host Core source snapshot
on:
  push:
    branches: [fix/host-core-hardening-20260905]
    paths: [.github/workflows/host-core-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Package isolated verification dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/host-tools
          python -m pip download --dest /tmp/host-tools --only-binary=:all: paramiko==3.5.1 types-PyYAML
          cd webapp
          npm ci
          tar -czf /tmp/host-web-tools.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-core-web-runtime
          path: |
            /tmp/host-web-tools.tar.gz
            /tmp/host-tools
          retention-days: 2
          if-no-files-found: error
