name: Release Tag
run-name: release-tag/${{ inputs.version }}/${{ inputs.target_commit }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix
        required: true
        type: string
      target_commit:
        description: Exact production commit SHA on main
        required: true
        type: string

permissions:
  checks: read
  contents: write

concurrency:
  group: release-tag-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable release inputs
        env:
          VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exact main commit and successful CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python scripts/github_release_gate.py \
            --target-commit "${{ inputs.target_commit }}" \
            --required-check verify \
            --wait-seconds 0 \
            --missing-check-wait-seconds 0 \
            --poll-seconds 1 \
            --format json
      - name: Validate named release contract and prepare notes
        run: |
          python scripts/release_contract.py \
            --version "${{ inputs.version }}" \
            --notes-output /tmp/release-notes.md
      - name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          remote_target="$(git ls-remote origin "refs/tags/$VERSION^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_target" ]]; then
            remote_target="$(git ls-remote origin "refs/tags/$VERSION" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "$remote_target" && "$remote_target" != "$TARGET_COMMIT" ]]; then
            echo "Immutable release tag $VERSION already points to $remote_target" >&2
            exit 1
          fi
          if [[ -z "$remote_target" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" "$TARGET_COMMIT" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for immutable tag $VERSION"
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
