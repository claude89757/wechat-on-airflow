name: Migration Workspace
on:
  push:
    branches: [feat/cloudflare-device-migration-20260911]
    paths: [.github/workflows/migration-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Package verification tools without runtime credentials
        run: |
          mkdir -p /tmp/migration-source/wheels
          python -m pip download --only-binary=:all: --dest /tmp/migration-source/wheels ruff==0.12.11 mypy==1.17.1 paramiko==3.5.1 types-paramiko==3.5.0.20240928 types-requests types-PyYAML
          git bundle create /tmp/migration-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/migration-source/commit.txt
          cd /tmp/migration-source
          sha256sum source.bundle > source.bundle.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-source-${{ github.sha }}
          path: /tmp/migration-source/
          if-no-files-found: error
          retention-days: 1
