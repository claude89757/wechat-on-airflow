name: One-time Host Core POSIX stage patch

on:
  push:
    branches:
      - fix/host-core-posix-secret-stage-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-posix-secret-stage-20260904
          fetch-depth: 0

      - name: Patch the staging shell and commit
        run: |
          set -euo pipefail
          perl -0pi -e 's/stage_script = """\nset -euo pipefail\n/stage_script = """\nset -eu\n/' scripts/host_core_production.py
          grep -A2 'stage_script = """' scripts/host_core_production.py | grep -Fx 'set -eu'
          ! grep -A2 'stage_script = """' scripts/host_core_production.py | grep -F 'pipefail'
          git rm .github/workflows/host-core-posix-stage-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/host_core_production.py tests/host_core_bootstrap_contract_test.py
          git commit -m "fix(host-core): use POSIX options for secret staging"
          git push origin HEAD:fix/host-core-posix-secret-stage-20260904
