name: Bootstrap final admin feature tree

on:
  push:
    branches: [feat/admin-operations-email-lifecycle-final]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-admin-final
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/admin-operations-email-lifecycle-final
          fetch-depth: 0
      - name: Restore verified generators and deploy workflow
        run: |
          set -euo pipefail
          git fetch origin feat/admin-operations-email-lifecycle feat/priority-long-term-subscriptions
          git checkout origin/feat/admin-operations-email-lifecycle -- .feature/admin .github/workflows/deploy-admin-email-lifecycle.yml
          mkdir -p .feature-bootstrap
          git show origin/feat/priority-long-term-subscriptions:.feature-bootstrap/patch_ui.py > .feature-bootstrap/patch_ui.py
      - name: Generate final business tree
        run: bash .feature/admin/finalize_v5.sh
      - name: Validate required feature surface
        run: |
          set -euo pipefail
          require_text() { file="$1"; pattern="$2"; label="$3"; if grep -q "$pattern" "$file"; then echo "OK: $label"; else echo "MISSING: $label ($file :: $pattern)" >&2; exit 1; fi; }
          require_file() { if test -f "$1"; then echo "OK: $2"; else echo "MISSING: $2 ($1)" >&2; exit 1; fi; }
          require_text webapp/migrations/0006_add_admin_email_lifecycle.sql 'claudexzt@gmail.com' 'admin seed'
          require_text webapp/cloudflare/index.ts '/api/community/users' 'community API'
          require_text webapp/cloudflare/index.ts '/api/admin/users' 'admin users API'
          require_text webapp/cloudflare/index.ts '/api/admin/invites' 'admin invites API'
          require_text webapp/cloudflare/tencent-ses.ts 'GetSendEmailStatus' 'Tencent delivery reconciliation'
          require_text webapp/cloudflare/index.ts 'subscription_expiry' 'subscription expiry reminder'
          require_text webapp/src/Prototype.tsx '用户社区' 'community entry'
          require_text webapp/src/Prototype.tsx '管理后台' 'admin entry'
          require_text webapp/src/Prototype.tsx 'CommunityPanel' 'community panel integration'
          require_text webapp/src/Prototype.tsx 'AdminPanel' 'admin panel integration'
          require_text webapp/src/Prototype.tsx '确认送达' 'delivered UI'
          require_text webapp/src/Prototype.tsx '发送失败' 'failed-delivery UI'
          require_file .github/workflows/production-admin-acceptance.yml 'production acceptance workflow'
          require_file .github/workflows/deploy-admin-email-lifecycle.yml 'production deploy workflow'
      - name: Remove one-shot generation assets
        run: |
          rm -rf .feature/admin .feature-bootstrap
          rm -f .github/workflows/bootstrap-admin-final.yml
          rm -f .bootstrap-admin-trigger
      - name: Commit final feature tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(webapp): add admin operations and accurate email lifecycle'
          git push origin HEAD:feat/admin-operations-email-lifecycle-final
