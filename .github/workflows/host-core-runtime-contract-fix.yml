name: One-time host-core runtime contract fix

on:
  push:
    branches:
      - feat/airflow-host-core-v0.7.0-final3

permissions:
  contents: write

concurrency:
  group: one-time-host-core-runtime-contract-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - name: Align runtime secret and tunnel contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("config/runtime-target.yaml")
          source = path.read_text(encoding="utf-8")
          old_secrets = '''  runtime_secrets:
    AIRFLOW_FERNET_KEY: airflow_fernet_key
    AIRFLOW_API_SECRET_KEY: airflow_api_secret_key
    AIRFLOW_JWT_SECRET: airflow_jwt_secret
    AIRFLOW_DATABASE_PASSWORD: airflow_database_password
    AIRFLOW_PASSWORD: airflow_admin_password
    TENCENT_SECRET_ID: tencent_secret_id
    TENCENT_SECRET_KEY: tencent_secret_key
    TENCENT_REGION: tencent_region
    EMAIL_FROM_ADDRESS: email_from_address
    EMAIL_REPLY_TO: email_reply_to
    EMAIL_TEMPLATE_ID: email_template_id
'''
          new_secrets = '''  runtime_secrets:
    AIRFLOW_FERNET_KEY: airflow_fernet_key
    AIRFLOW_API_SECRET_KEY: airflow_api_secret_key
    AIRFLOW_JWT_SECRET: airflow_jwt_secret
    AIRFLOW_DATABASE_PASSWORD: airflow_database_password
    AIRFLOW_PASSWORD: airflow_admin_password
  host_core_secret_files:
    TENCENT_SECRET_ID: tencent_secret_id
    TENCENT_SECRET_KEY: tencent_secret_key
    TENCENT_REGION: tencent_region
    EMAIL_FROM_ADDRESS: email_from_address
    EMAIL_REPLY_TO: email_reply_to
    EMAIL_TEMPLATE_ID: email_template_id
'''
          if old_secrets not in source:
              raise SystemExit("expected runtime secret block was not found")
          source = source.replace(old_secrets, new_secrets, 1)
          old_tunnel = '''    public_hostname: airflow.claude89757.cc
    public_base_url: https://airflow.claude89757.cc
    airflow_origin_base_url: http://127.0.0.1:8080
'''
          new_tunnel = '''    public_hostname: airflow.claude89757.cc
    public_base_url: https://airflow.claude89757.cc
    origin_base_url: http://127.0.0.1:8080
    airflow_origin_base_url: http://127.0.0.1:8080
'''
          if old_tunnel not in source:
              raise SystemExit("expected tunnel block was not found")
          path.write_text(source.replace(old_tunnel, new_tunnel, 1), encoding="utf-8")
          PY
          git rm .github/workflows/host-core-runtime-contract-fix.yml
      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/runtime-target.yaml
          git commit -m "fix(contract): separate host-core secret files from Airflow secrets"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3
