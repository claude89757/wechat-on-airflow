name: Finalize FFT integration v2

on:
  push:
    branches:
      - feat/fft-qianhai-release-v2
    paths:
      - .github/workflows/fft-finalize-v2.yml
      - .tmp/fft-final-good/chunk*

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify chunks and apply final integration patch
        shell: bash
        run: |
          set -euo pipefail
          echo "b6be6fe1762acb34a4521e9eac8be2287a4ccee9493c7c2cd734dfa72728513e  .tmp/fft-final-good/chunk00" | sha256sum --check
          echo "d1a846c050cee75f5ace615743250454d8d7e480d1694d73ae3b826054e5ea6b  .tmp/fft-final-good/chunk01" | sha256sum --check
          echo "d00142755d5533e67552a9fa485911945c42b3d3cdab6e4213020a1017e2b58d  .tmp/fft-final-good/chunk02" | sha256sum --check
          echo "aead4a247ee44ee1fddf8e00c26a4a820ef797ab5d8f70c25780786b7daba19f  .tmp/fft-final-good/chunk03" | sha256sum --check
          echo "7ad501fc268f935a9a33ee1817b61bdf5e92cd51371106ffa4a4e55f937fbfbb  .tmp/fft-final-good/chunk04" | sha256sum --check
          echo "f8a7b9443c65b2f0ff8261be7678d2c6480d22efabcaf136dec6beb8b2886b6b  .tmp/fft-final-good/chunk05" | sha256sum --check
          echo "f6982fbf190cd1e431de21c760d669a88b6d013154f05f75b8dac0e4a4263ebc  .tmp/fft-final-good/chunk06" | sha256sum --check
          echo "1359e6dbd66e56cd02b3429b3ea1609eef19c9899007163209c8c8617d160024  .tmp/fft-final-good/chunk07" | sha256sum --check
          echo "36b800c3c06ed5e61c8b176ecf48b71b566c0286b70fcec1bf02ccc642c6d6fb  .tmp/fft-final-good/chunk08" | sha256sum --check
          echo "bb7b239072316227a4cfbac7f7e633d5763e06d75c32f4bc6b9712e4a436899c  .tmp/fft-final-good/chunk09" | sha256sum --check

          cat .tmp/fft-final-good/chunk* > /tmp/fft-final.patch.gz.b64
          echo "4abc615a777cf35cc264b098add27d02170a66f6bbc09f47feaecf71f4a9c71e  /tmp/fft-final.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/fft-final.patch.gz.b64 | gunzip > /tmp/fft-final.patch
          echo "4c2675471a7b8ac2446896fedaf112abe28faa1a949bec57c2460a48c243f724  /tmp/fft-final.patch" | sha256sum --check
          git apply --check /tmp/fft-final.patch
          git apply --whitespace=error-all /tmp/fft-final.patch

          rm -rf .tmp/fft-final-good
          rm -f .github/workflows/fft-finalize-v2.yml
          rmdir .tmp 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate FFTENNIS Qianhai venue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
