name: BAWTT DSH Discovery
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/bawtt-dsh-discovery.yml]
permissions:
  contents: read
  checks: read
concurrency:
  group: bawtt-dsh-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 126c359919556081f68cf8199f5de9898129694b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify reviewed transport baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit 126c359919556081f68cf8199f5de9898129694b --wait-seconds 0 --format json
          python -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==50.0.1
          python scripts/install_cloudflared.py --destination "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Read DSH service metadata without exporting authentication
        env:
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.DEVICE_TUNNEL_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TUNNEL_ACCESS_CLIENT_SECRET }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, logging, os, shlex, subprocess
          from pathlib import Path
          import paramiko
          from wechat_airflow.clients.android_device import PinnedSHA256HostKeyPolicy
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          # Read-only: no shell arguments, environment files, cookies or page bodies are emitted.
          code = r'''
          import hashlib, json, os, platform, re, shutil, urllib.request, urllib.error
          from pathlib import Path
          report = {'mode':'read_only_dsh_discovery','productionChanged':False,'externalTestSends':0,
                    'python':platform.python_version(),'machine':platform.machine(),'dshProcesses':[],'services':[]}
          ports, inodes = {3080}, set()
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit(): continue
              try:
                  args = (proc/'cmdline').read_bytes().decode(errors='replace').split('\x00')
                  if not any(re.search(r'deepseek[-_]harness|/dsh/|/dsh(?:\.js)?$|dsh-web', a) or a == 'dsh' for a in args): continue
                  report['dshProcesses'].append({'pid':int(proc.name),'sameUser':proc.stat().st_uid == os.getuid()})
                  for fd in (proc/'fd').iterdir():
                      try:
                          link = os.readlink(str(fd))
                          if link.startswith('socket:['): inodes.add(link[8:-1])
                      except OSError: pass
              except OSError: pass
          for name in ('tcp','tcp6'):
              try:
                  for line in Path('/proc/net/'+name).read_text().splitlines()[1:]:
                      row = line.split()
                      if row[3] == '0A' and row[9] in inodes: ports.add(int(row[1].rsplit(':',1)[1],16))
              except OSError: pass
          for directory in (Path('/etc/systemd/system'),Path.home()/'.config/systemd/user'):
              if directory.is_dir():
                  report['services'].extend(p.name for p in directory.glob('*.service') if re.search(r'dsh|deepseek|harness',p.name,re.I))
          report['tools'] = {n:bool(shutil.which(n)) for n in ('uv','python3.11','python3.12','node','dsh')}
          report['endpoints'] = []
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          for port in sorted(ports)[:5]:
              origin, item = 'http://127.0.0.1:'+str(port), {'port':port}
              try:
                  payload = {'type':'client-request','rpcId':'bawtt-dsh-discovery','method':'session/modelCatalog','payload':{'args':{}}}
                  req = urllib.request.Request(origin+'/api/session/modelCatalog',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
                  try: response = opener.open(req,timeout=5)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      item.update(httpStatus=response.status,contentType=response.headers.get_content_type())
                      raw = response.read(131073)
                      item['responseBytes'] = len(raw)
                      try:
                          data = json.loads(raw)
                          result = data.get('result',{}) if isinstance(data,dict) else {}
                          item.update(json=True,catalogReadableWithoutLogin=result.get('ok') is True)
                          error = result.get('error',{})
                          code = error.get('code') if isinstance(error,dict) else None
                          if isinstance(code,str) and re.fullmatch(r'[A-Za-z0-9_./-]{1,80}',code): item['errorCode'] = code
                      except (ValueError,AttributeError): item['json'] = False
              except Exception as error: item['errorClass'] = type(error).__name__
              state = Path.home()/'.local/state/netbuddy/dsh'
              auth = state/('auth-'+hashlib.sha256(origin.encode()).hexdigest()[:20]+'.json')
              item['existingDelegateAuth'] = auth.is_file() and not auth.is_symlink()
              report['endpoints'].append(item)
          print(json.dumps(report,sort_keys=True))
          '''
          # These are the two existing, documented Pi routes. No port scan or credential copying.
          routes = []
          if os.environ.get('PI_DEVICE_SSH_HOST') and os.environ.get('PI_DEVICE_SSH_PORT'):
              routes.append(('configured_pi',os.environ['PI_DEVICE_SSH_HOST'],int(os.environ['PI_DEVICE_SSH_PORT']),False))
          routes.append(('existing_tunnel',json.loads(Path('config/device-network.json').read_text())['public_ssh_hostname'],22,True))
          reports = []
          for label,host,port,tunnel in routes:
              client, proxy = paramiko.SSHClient(), None
              item = {'route':label,'pinnedSshAuthenticated':False}
              try:
                  client.set_missing_host_key_policy(PinnedSHA256HostKeyPolicy(os.environ['PI_DEVICE_SSH_HOST_KEY_SHA256']))
                  if tunnel: proxy = paramiko.ProxyCommand('cloudflared access ssh --hostname '+shlex.quote(host))
                  client.connect(host,port=port,username=os.environ['PI_DEVICE_SSH_USER'],password=os.environ['PI_DEVICE_SSH_PASSWORD'],sock=proxy,timeout=12,auth_timeout=12,banner_timeout=12,allow_agent=False,look_for_keys=False)
                  item['pinnedSshAuthenticated'] = True
                  stdin,stdout,stderr = client.exec_command('python3 -',timeout=60)
                  stdin.write(code); stdin.flush(); stdin.channel.shutdown_write()
                  raw = stdout.read(131073)
                  item['remoteExitCode'] = stdout.channel.recv_exit_status()
                  item['discovery'] = json.loads(raw)
              except Exception as error: item['errorClass'] = type(error).__name__
              finally:
                  client.close()
                  if proxy is not None:
                      proxy.close()
                      try: proxy.process.wait(timeout=5)
                      except subprocess.TimeoutExpired: proxy.process.kill()
              reports.append(item)
              if item.get('discovery',{}).get('dshProcesses'): break
          result = {'routes':reports,'productionChanged':False,'externalTestSends':0,'delegationSubmitted':False}
          rendered = json.dumps(result,sort_keys=True)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('### DSH read-only discovery\n```json\n'+rendered+'\n```\n')
          if not any(r.get('pinnedSshAuthenticated') for r in reports): raise SystemExit(1)
          PY
