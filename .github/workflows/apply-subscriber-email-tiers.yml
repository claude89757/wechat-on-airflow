name: Apply subscriber email tiers

on:
  push:
    branches:
      - feat/subscriber-email-tiers
    paths:
      - scripts/apply_subscriber_email_tiers.py
      - .github/workflows/apply-subscriber-email-tiers.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscriber-email-tiers
          fetch-depth: 0
      - name: Apply repository patch
        run: python scripts/apply_subscriber_email_tiers.py
      - name: Remove one-time patch files
        run: rm scripts/apply_subscriber_email_tiers.py .github/workflows/apply-subscriber-email-tiers.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(webapp): add subscriber email tiers and priority invites"
          git push origin HEAD:feat/subscriber-email-tiers
