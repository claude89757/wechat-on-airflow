name: One-time host-core formatter

on:
  push:
    branches:
      - fix/host-core-edge-token-bootstrap-20260904

permissions:
  contents: write

concurrency:
  group: one-time-host-core-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-edge-token-bootstrap-20260904
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Format and commit only the production script
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.11
          ruff format scripts/host_core_production.py
          if git diff --quiet -- scripts/host_core_production.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/host_core_production.py
          git commit -m "style(host-core): format production bootstrap"
          git push origin HEAD:fix/host-core-edge-token-bootstrap-20260904
