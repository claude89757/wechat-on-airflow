name: Fix Weekday UX Changelog

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-weekday-ux-changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.head_ref == 'feat/webapp-weekday-ux-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebuild changelog as UTF-8
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:CHANGELOG.md > /tmp/CHANGELOG.main.md
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/CHANGELOG.main.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          entry = '''### Added

          - Let Web subscribers choose one or more weekdays, including one-tap daily,
            weekday, and weekend presets. Existing subscriptions continue to run every
            day.
          - Celebrate successful subscription creation with a short reduced-motion-aware
            firework effect, and add clear spam-folder guidance for verification and
            reminder email.
          - Add the public GitHub repository to the header More menu.

          ### Changed

          - Order the public venue list and subscription selector by unique active
            follower count, with a deterministic name/ID tie-breaker and visible
            popularity labels.

          '''
          if marker not in text:
              raise SystemExit('Unreleased changelog marker missing')
          Path('CHANGELOG.md').write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY
          git add CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record weekday subscription UX'
          git push origin "HEAD:${HEAD_BRANCH}"
