name: Finalize admin and email lifecycle feature v4
run-name: finalize-v4/admin-email-lifecycle/${{ github.sha }}

on:
  push:
    branches:
      - feat/admin-operations-email-lifecycle

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-admin-email-lifecycle
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[finalize-admin-feature-v4]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/admin-operations-email-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Restore proven long-term UI patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .feature/admin
          gh api "repos/$GITHUB_REPOSITORY/contents/.feature-bootstrap/patch_ui.py?ref=feat/priority-long-term-subscriptions" --jq .content \
            | tr -d '\n' | base64 -d > .feature/admin/patch_ui.py

      - name: Generate implementation
        run: |
          set -euo pipefail
          python .feature/admin/write_backend_files.py
          python .feature/admin/write_frontend_files.py
          python .feature/admin/patch_backend.py
          python .feature/admin/patch_ui.py

      - name: Integrate community and administrator panels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("webapp/src/Prototype.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"missing UI integration marker: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { LULU_LABELS, resolveLuluState } from "./lulu";',
              'import { LULU_LABELS, resolveLuluState } from "./lulu";\nimport { AdminPanel, CommunityPanel } from "./OperationsPanel";',
              "operations imports",
          )
          replace_once(
              'type Panel = "create" | "help" | "subscriptions" | "priority" | null;',
              'type Panel = "create" | "help" | "subscriptions" | "priority" | "community" | "admin" | null;',
              "panel type",
          )
          replace_once(
              '    if (panel === "priority") return "提醒档位";\n    return receipt ? "创建订阅" : "验证邮箱";',
              '    if (panel === "priority") return "提醒档位";\n    if (panel === "community") return "用户社区";\n    if (panel === "admin") return "管理后台";\n    return receipt ? "创建订阅" : "验证邮箱";',
              "panel title",
          )

          subscriptions_block = '''          <button
            className="subscriptions-link"
            type="button"
            onClick={() => openPanel("subscriptions")}
          >
            <ListBulletsIcon size={24} weight="bold" />
            <span>我的订阅</span>
            <span aria-hidden="true">›</span>
          </button>'''
          operations_block = subscriptions_block + '''

          {receipt ? (
            <button
              className="subscriptions-link"
              type="button"
              onClick={() => openPanel("community")}
            >
              <UsersThreeIcon size={24} weight="bold" />
              <span>用户社区</span>
              <span aria-hidden="true">›</span>
            </button>
          ) : null}

          {receipt && dashboard.identity.isAdmin ? (
            <button
              className="subscriptions-link admin-entry"
              type="button"
              onClick={() => openPanel("admin")}
            >
              <ShieldCheckIcon size={24} weight="bold" />
              <span>管理后台</span>
              <span aria-hidden="true">›</span>
            </button>
          ) : null}'''
          replace_once(subscriptions_block, operations_block, "operations entries")

          replace_once(
              '        snap={panel === "create" ? 0.86 : panel === "priority" ? 0.82 : 0.72}',
              '        snap={panel === "create" ? 0.86 : panel === "priority" ? 0.82 : panel === "community" || panel === "admin" ? 0.94 : 0.72}',
              "operations panel snap",
          )
          replace_once(
              '        {panel === "priority" ? (',
              '''        {panel === "community" && receipt ? (
          <CommunityPanel receipt={receipt} />
        ) : null}

        {panel === "admin" && receipt && dashboard.identity.isAdmin ? (
          <AdminPanel receipt={receipt} />
        ) : null}

        {panel === "priority" ? (''',
              "operations panel render",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply deterministic hardening fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('webapp/src/OperationsPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          for unused in ('  CheckCircleIcon,\n', '  KeyIcon,\n'):
              text = text.replace(unused, '')
          panel.write_text(text, encoding='utf-8')

          index = Path('webapp/cloudflare/index.ts')
          text = index.read_text(encoding='utf-8')
          old = '''function base64UrlToBytes(value: string): Uint8Array {\n  const padded = value.replaceAll("-", "+").replaceAll("_", "/")\n    + "=".repeat((4 - value.length % 4) % 4);\n  const binary = atob(padded);\n  return Uint8Array.from(binary, (character) => character.charCodeAt(0));\n}'''
          new = '''function base64UrlToBytes(value: string): Uint8Array<ArrayBuffer> {\n  const padded = value.replaceAll("-", "+").replaceAll("_", "/")\n    + "=".repeat((4 - value.length % 4) % 4);\n  const binary = atob(padded);\n  const bytes = new Uint8Array(new ArrayBuffer(binary.length));\n  for (let index = 0; index < binary.length; index += 1) {\n    bytes[index] = binary.charCodeAt(index);\n  }\n  return bytes;\n}'''
          if old in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          prototype = Path('webapp/src/Prototype.tsx')
          text = prototype.read_text(encoding='utf-8')
          text = text.replace(
              'const allowed = dashboard.subscriptionTerms[dashboard.identity.tier].includes(term);',
              'const allowed = dashboard.subscriptionTerms[dashboard.identity.tier]'
              '.some((allowedTerm) => allowedTerm === term);',
          )
          prototype.write_text(text, encoding='utf-8')

          acceptance = Path('scripts/accept_webapp_admin.sh')
          text = acceptance.read_text(encoding='utf-8')
          old_accept = '''cleanup() {\n  npx wrangler d1 execute zacks-tennis-alerts --remote \\\n    --command "DELETE FROM verified_receipts WHERE token_hash='$token_hash';" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n\nnpx wrangler d1 execute zacks-tennis-alerts --remote --command \\\n  "INSERT OR REPLACE INTO verified_receipts (token_hash,email,masked_email,expires_at,last_used_at,created_at,revoked_at) VALUES ('$token_hash','claudexzt@gmail.com','cl*******@gmail.com',$expires_ms,$now_ms,$now_ms,NULL);" >/dev/null\n\nnpx wrangler d1 execute zacks-tennis-alerts --remote --json --command \\\n  "SELECT email,role,revoked_at FROM user_roles WHERE email='claudexzt@gmail.com' AND role='admin';" \\\n  > "$output_dir/d1-admin.json"'''
          new_accept = '''wrangler() {\n  (cd webapp && npx wrangler "$@")\n}\n\ncleanup() {\n  wrangler d1 execute zacks-tennis-alerts --remote \\\n    --command "DELETE FROM verified_receipts WHERE token_hash='$token_hash';" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n\nwrangler d1 execute zacks-tennis-alerts --remote --command \\\n  "INSERT OR REPLACE INTO verified_receipts (token_hash,email,masked_email,expires_at,last_used_at,created_at,revoked_at) VALUES ('$token_hash','claudexzt@gmail.com','cl*******@gmail.com',$expires_ms,$now_ms,$now_ms,NULL);" >/dev/null\n\nwrangler d1 execute zacks-tennis-alerts --remote --json --command \\\n  "SELECT email,role,revoked_at FROM user_roles WHERE email='claudexzt@gmail.com' AND role='admin';" \\\n  > "../$output_dir/d1-admin.json"'''
          if old_accept in text:
              text = text.replace(old_accept, new_accept, 1)
          text = text.replace(
              '''      cat > "$output_dir/e2e.mjs" <<'JS'\n      import { chromium } from 'playwright';''',
              '''      e2e_script="webapp/.admin-acceptance-e2e.mjs"\n      cat > "$e2e_script" <<'JS'\n      import { chromium } from 'playwright';''',
          )
          text = text.replace(
              '''      node "$output_dir/e2e.mjs" "$base" "$token" "$output_dir"''',
              '''      node "$e2e_script" "$base" "$token" "$output_dir"\n      rm -f "$e2e_script"''',
          )
          acceptance.write_text(text, encoding='utf-8')
          PY

      - name: Verify Web and D1 implementation
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:worker
          npm run build
          npm run cf:migrate:local

      - name: Validate complete requested feature surface
        run: |
          set -euo pipefail
          grep -q 'claudexzt@gmail.com' webapp/migrations/0006_add_admin_email_lifecycle.sql
          grep -q '/api/community/users' webapp/cloudflare/index.ts
          grep -q '/api/admin/users' webapp/cloudflare/index.ts
          grep -q '/api/admin/invites' webapp/cloudflare/index.ts
          grep -q 'GetSendEmailStatus' webapp/cloudflare/tencent-ses.ts
          grep -q 'subscription_expiry' webapp/cloudflare/index.ts
          grep -q '用户社区' webapp/src/Prototype.tsx
          grep -q '管理后台' webapp/src/Prototype.tsx
          grep -q 'CommunityPanel' webapp/src/Prototype.tsx
          grep -q 'AdminPanel' webapp/src/Prototype.tsx
          grep -q '确认送达' webapp/src/Prototype.tsx
          grep -q '发送失败' webapp/src/Prototype.tsx
          grep -q 'wrangler()' scripts/accept_webapp_admin.sh
          grep -q 'webapp/.admin-acceptance-e2e.mjs' scripts/accept_webapp_admin.sh
          test -f .github/workflows/production-admin-acceptance.yml
          test -f .github/workflows/deploy-admin-email-lifecycle.yml

      - name: Remove temporary generation assets
        run: |
          rm -rf .feature/admin
          rm -f .github/workflows/apply-admin-feature.yml
          rm -f .github/workflows/finalize-admin-feature.yml
          rm -f .github/workflows/finalize-admin-feature-v2.yml
          rm -f .github/workflows/finalize-admin-feature-v3.yml
          rm -f .github/workflows/finalize-admin-feature-v4.yml
          rm -f .github/workflows/export-admin-feature-snapshot.yml
          rm -f .github/workflows/export-webapp-deps.yml

      - name: Commit final implementation
        id: commit
        env:
          BRANCH: feat/admin-operations-email-lifecycle
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(webapp): add admin operations and accurate email lifecycle"
          git push origin "HEAD:$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for complete branch CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT/check-runs" \
              --jq '[.check_runs[] | select(.name == "verify")] | sort_by(.started_at) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            if [[ "$result" == $'completed\tsuccess' ]]; then exit 0; fi
            if [[ "$result" == completed$'\t'* && "$result" != $'completed\tsuccess' ]]; then
              echo "Branch CI failed: $result" >&2
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Make pull request ready and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 56 --repo "$GITHUB_REPOSITORY" || true
          gh pr edit 56 --repo "$GITHUB_REPOSITORY" \
            --title "feat(webapp): add admin operations and accurate email lifecycle" \
            --body "Verified implementation of administrator operations, privacy-safe community users, Tencent delivery reconciliation, expiry reminders, long-term priority subscriptions, quota UX, and protected production acceptance. Cloudflare Email Routing was evaluated but is not suitable for arbitrary user-entered verification recipients, so verification email remains on Tencent SES."
          gh pr merge 56 --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "feat(webapp): add admin operations and accurate email lifecycle" \
            --body "Full branch CI passed. Exact-main production Web deployment and protected acceptance run automatically."

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body "Admin/community/email lifecycle v4 finalization passed and PR #56 was merged. Production deployment follows automatically. Run: $RUN_URL"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body "Admin/community/email lifecycle v4 finalization failed before merge. Run: $RUN_URL"
