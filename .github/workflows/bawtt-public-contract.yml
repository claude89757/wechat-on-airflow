name: BAWTT Public Contract Validation
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/bawtt-public-contract.yml]
permissions:
  contents: read
concurrency:
  group: bawtt-public-contract-validation
  cancel-in-progress: false
jobs:
  formatting:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/feat/bawtt-ydmap-onboarding-20260916'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Format only owned files and verify semantic identity
        run: |
          python -m pip install ruff==0.12.11 pytest==9.1.1
          python - <<'PY'
          import ast, pathlib, subprocess
          paths = ['scripts/probe_bawtt_public_browser.py', 'tests/bawtt_public_browser_test.py', 'scripts/bawtt_page_diagnosis.py', 'scripts/github_release_gate.py', 'tests/github_check_pagination_test.py']
          before = {p: ast.dump(ast.parse(pathlib.Path(p).read_text()), include_attributes=False) for p in paths}
          subprocess.run(['ruff', 'format', *paths], check=True)
          assert all(ast.dump(ast.parse(pathlib.Path(p).read_text()), include_attributes=False) == before[p] for p in paths), 'formatter changed AST'
          subprocess.run(['ruff', 'check', *paths], check=True)
          PY
          python -m pytest -q tests/github_check_pagination_test.py tests/github_release_gate_test.py tests/ops_scripts_test.py tests/bawtt_public_browser_test.py tests/bawtt_probe_test.py
      - name: Commit cosmetic changes only if branch has not advanced
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=feat/bawtt-ydmap-onboarding-20260916
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git add scripts/probe_bawtt_public_browser.py tests/bawtt_public_browser_test.py scripts/bawtt_page_diagnosis.py scripts/github_release_gate.py tests/github_check_pagination_test.py
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'style(bawtt): apply AST-preserving formatting to diagnostic and gate tests'
            git push origin HEAD:"refs/heads/$branch"
          fi
  business-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect two already-observed public business script resources once
        run: |
          python3 - <<'PY'
          import hashlib, json, re, urllib.request, urllib.error
          paths = ['/js/app.23918b62.js', '/js/booking-schedule-venue.b6226c5c.js']
          terms = ['getSalesItemList', 'getSportVenueConfig', 'getVenueCalendarList', 'getVenueOrderList', 'beforeRouteEnter', 'created:', 'mounted:', 'getConfig', 'className:', 'not-open', '暂未开放']
          report = []
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          for path in paths:
              item = {'path': path}
              try:
                  try: response = opener.open('https://bawtt.ydmap.cn'+path, timeout=20)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      raw = response.read(1000001)
                      item.update(httpStatus=response.status, contentType=response.headers.get_content_type(), bytes=len(raw))
                  if item['httpStatus'] != 200 or len(raw) > 1000000 or 'javascript' not in item['contentType']:
                      item['reason'] = 'public_script_unavailable_no_retry'
                      report.append(item)
                      break
                  text = raw.decode('utf-8')
                  if re.search(r'Access Verification|aliyun_waf_aa|<html', text[:2000], re.I):
                      item['reason'] = 'verification_or_non_script_response_stop'
                      report.append(item)
                      break
                  item['sha256'] = hashlib.sha256(raw).hexdigest()
                  item['businessExcerpts'] = []
                  for term in terms:
                      matches = list(re.finditer(re.escape(term), text))
                      for match in matches[:2]:
                          excerpt = text[max(0,match.start()-220):match.end()+600]
                          excerpt = re.sub(r'https?://[^\s\"\x27<>]+', '[URL]', excerpt)
                          excerpt = re.sub(r'[A-Za-z0-9_=-]{48,}', '[opaque]', excerpt)
                          item['businessExcerpts'].append({'term':term,'count':len(matches),'excerpt':excerpt})
              except Exception as error:
                  item['errorClass'] = type(error).__name__
              report.append(item)
          print(json.dumps({'mode':'public_business_source_only','piAccess':False,'authenticationUsed':False,'productionChanged':False,'scripts':report},ensure_ascii=False))
          PY
