name: Apply raised email tiers and memorable invite UX

on:
  push:
    branches:
      - feat/subscriber-email-tiers
    paths:
      - .github/workflows/apply-email-tier-copy.yml
      - scripts/apply_email_tier_update.py
  pull_request:
    branches:
      - feat/shenzhen-weather-email-gate
    paths:
      - .github/workflows/apply-email-tier-copy.yml
      - scripts/apply_email_tier_update.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscriber-email-tiers
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply updates
        run: python scripts/apply_email_tier_update.py
      - name: Remove one-time files and commit
        run: |
          rm scripts/apply_email_tier_update.py
          rm .github/workflows/apply-email-tier-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(webapp): clarify 30 and 100 email tiers"
          git push origin HEAD:feat/subscriber-email-tiers
