name: Materialize Court Studio candidate
on:
  push:
    branches: [design/court-studio-20260905]
    paths: [.github/workflows/ui-design-review.yml]
permissions:
  contents: write
concurrency:
  group: ui-design-review
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'claude89757/wechat-on-airflow' && github.ref == 'refs/heads/design/court-studio-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify transport, preimages and final source hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          allowed = {
              '.github/workflows/ci.yml', '.github/workflows/production-webapp.yml',
              'CHANGELOG.md', 'docs/court-studio-0.8.0.md', 'pyproject.toml',
              'src/wechat_airflow/__init__.py',
              'tests/manual_refresh_no_heartbeat_contract_test.py',
              'tests/webapp_header_actions_test.py',
              'tests/webapp_subscription_weekdays_wiring_test.py',
              'tests/webapp_venue_refresh_nudges_test.py',
              'tests/webapp_venue_status_display_test.py', 'webapp/AGENTS.md',
              'webapp/qa/public-acceptance.mjs', 'webapp/src/CourtStudio.tsx',
              'webapp/src/Prototype.tsx', 'webapp/src/court-studio.css',
              'webapp/tests/court-studio.spec.ts', 'webapp/tests/mobile-v2.spec.ts',
              'webapp/tests/more-menu-scroll.spec.ts', 'webapp/tests/subscription-ux.spec.ts',
          }
          encoded = ''.join(Path(f'.ui-transfer/part-{i}.b64').read_text().strip() for i in range(1, 5))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'a73a55bc151fecc17ebb72693f93c2eeabd80eb4bc9cf12a235409e497325852', 'transport hash mismatch'
          entries = json.loads(lzma.decompress(packed, memlimit=256*1024*1024))
          assert set(entries) == allowed, 'unexpected source paths'
          staged = {}
          for name, entry in entries.items():
              path = Path(name)
              if entry['old'] is None:
                  assert not path.exists(), 'new path already exists: ' + name
                  content = entry['text']
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == entry['old'], 'preimage changed: ' + name
                  lines = original.decode().splitlines(keepends=True)
                  edits = entry['edits']
                  assert all(0 <= i <= j <= len(lines) for i,j,_ in edits)
                  assert all(edits[n][1] <= edits[n+1][0] for n in range(len(edits)-1))
                  for i,j,replacement in reversed(edits):
                      lines[i:j] = [replacement]
                  content = ''.join(lines)
              data = content.encode()
              assert hashlib.sha256(data).hexdigest() == entry['new'], 'output mismatch: ' + name
              staged[name] = data
          for name, data in staged.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path('/tmp/court-studio-paths').write_text('\n'.join(sorted(allowed))+'\n')
          print(json.dumps({'sourceFiles':len(staged),'preimagesVerified':True,'outputHashesVerified':True,'productionAccess':False}))
          PY
      - name: Remove branch-only capture and transport helpers
        run: |
          set -euo pipefail
          git rm -r -- .ui-review .ui-transfer
          git rm -- webapp/scripts/ui-design-capture.mjs .github/workflows/ui-design-review.yml
          while IFS= read -r path; do git add -- "$path"; done < /tmp/court-studio-paths
          git diff --cached --check
      - name: Publish candidate source for normal PR CI
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/design/court-studio-20260905
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): implement Court Studio 0.8.0 responsive reminder workspace'
          git push origin HEAD:refs/heads/design/court-studio-20260905
          echo 'Candidate source published; normal exact-commit CI and protected production release remain required.' >> "$GITHUB_STEP_SUMMARY"
