name: UI Design Review
on:
  push:
    branches: [design/court-studio-20260905]
    paths:
      - .github/workflows/ui-design-review.yml
      - webapp/scripts/ui-design-capture.mjs
permissions:
  contents: write
concurrency:
  group: ui-design-review
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'claude89757/wechat-on-airflow' && github.ref == 'refs/heads/design/court-studio-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: webapp
      - run: node webapp/scripts/ui-design-capture.mjs
      - name: Archive public-only screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-baseline-${{ github.sha }}
          path: .ui-review/
          include-hidden-files: true
          retention-days: 30
      - name: Publish review evidence to development branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/design/court-studio-20260905
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ui-review
          git diff --cached --quiet && exit 0
          git commit -m 'test(ui): capture unauthenticated public baseline [skip ci]'
          git push origin HEAD:refs/heads/design/court-studio-20260905
