name: One-time Host Core migration file ownership fix

on:
  push:
    branches:
      - fix/host-core-migration-file-ownership-20260904

permissions:
  contents: write

concurrency:
  group: one-time-host-core-migration-file-ownership-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-migration-file-ownership-20260904
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Patch migration staging ownership and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          script_path = Path("scripts/host_core_production.py")
          source = script_path.read_text(encoding="utf-8")

          old_helper = (
              "def compose_exec(service, *arguments, **kwargs):\n"
              "    capture = bool(kwargs.get(\"capture\", False))\n"
              "    completed = run(\n"
              "        COMPOSE + [\"exec\", \"-T\", service] + list(arguments),\n"
              "        capture=capture,\n"
              "    )\n"
              "    return completed.stdout.strip() if capture and completed.stdout else \"\"\n"
          )
          new_helper = (
              "def compose_exec(service, *arguments, **kwargs):\n"
              "    capture = bool(kwargs.get(\"capture\", False))\n"
              "    check = bool(kwargs.get(\"check\", True))\n"
              "    user = kwargs.get(\"user\")\n"
              "    command = COMPOSE + [\"exec\", \"-T\"]\n"
              "    if user:\n"
              "        command += [\"--user\", str(user)]\n"
              "    command += [service] + list(arguments)\n"
              "    completed = run(command, check=check, capture=capture)\n"
              "    return completed.stdout.strip() if capture and completed.stdout else \"\"\n"
          )
          if source.count(old_helper) != 1:
              raise SystemExit(
                  "expected exactly one compose_exec helper, found "
                  + str(source.count(old_helper))
              )
          source = source.replace(old_helper, new_helper, 1)

          copy_anchor = (
              "    compose(\"cp\", str(source), f\"zacks-api:{container_path}\")\n"
              "    try:\n"
          )
          copy_replacement = (
              "    runtime_uid = compose_exec(\"zacks-api\", \"id\", \"-u\", capture=True)\n"
              "    if not runtime_uid.isdigit():\n"
              "        raise RuntimeError(\"zacks-api runtime UID is unavailable\")\n"
              "    compose(\"cp\", str(source), f\"zacks-api:{container_path}\")\n"
              "    try:\n"
              "        compose_exec(\n"
              "            \"zacks-api\",\n"
              "            \"chown\",\n"
              "            \"{}:0\".format(runtime_uid),\n"
              "            container_path,\n"
              "            user=\"0:0\",\n"
              "        )\n"
              "        compose_exec(\n"
              "            \"zacks-api\",\n"
              "            \"chmod\",\n"
              "            \"0600\",\n"
              "            container_path,\n"
              "            user=\"0:0\",\n"
              "        )\n"
          )
          if source.count(copy_anchor) != 1:
              raise SystemExit(
                  "expected exactly one D1 copy anchor, found "
                  + str(source.count(copy_anchor))
              )
          source = source.replace(copy_anchor, copy_replacement, 1)

          cleanup_anchor = (
              "    finally:\n"
              "        compose_exec(\"zacks-api\", \"rm\", \"-f\", container_path)\n"
          )
          cleanup_replacement = (
              "    finally:\n"
              "        compose_exec(\n"
              "            \"zacks-api\",\n"
              "            \"rm\",\n"
              "            \"-f\",\n"
              "            container_path,\n"
              "            user=\"0:0\",\n"
              "            check=False,\n"
              "        )\n"
          )
          if source.count(cleanup_anchor) != 1:
              raise SystemExit(
                  "expected exactly one D1 cleanup anchor, found "
                  + str(source.count(cleanup_anchor))
              )
          script_path.write_text(
              source.replace(cleanup_anchor, cleanup_replacement, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/host_core_migration_staging_contract_test.py")
          test_path.write_text(
              textwrap.dedent(
                  '''
                  from __future__ import annotations

                  from pathlib import Path

                  ROOT = Path(__file__).resolve().parents[1]
                  SCRIPT = (ROOT / "scripts/host_core_production.py").read_text(
                      encoding="utf-8"
                  )


                  def test_compose_exec_places_user_option_before_service() -> None:
                      helper = SCRIPT.split("def compose_exec", 1)[1].split(
                          "def running_services", 1
                      )[0]
                      assert 'command = COMPOSE + ["exec", "-T"]' in helper
                      assert 'command += ["--user", str(user)]' in helper
                      assert "command += [service] + list(arguments)" in helper
                      assert helper.index(
                          'command += ["--user", str(user)]'
                      ) < helper.index("command += [service] + list(arguments)")
                      assert "completed = run(command, check=check, capture=capture)" in helper


                  def test_d1_snapshot_is_reowned_before_application_import() -> None:
                      migration = SCRIPT.split("def migrate_sql", 1)[1].split(
                          "def enable_dual", 1
                      )[0]
                      uid_lookup = (
                          'runtime_uid = compose_exec("zacks-api", "id", "-u", capture=True)'
                      )
                      ownership = '"{}:0".format(runtime_uid)'
                      importer = '"/opt/airflow/project/scripts/import_d1_sql_export.py"'
                      assert uid_lookup in migration
                      assert ownership in migration
                      assert 'user="0:0"' in migration
                      assert migration.index(uid_lookup) < migration.index('compose("cp"')
                      assert migration.index(ownership) < migration.index(importer)


                  def test_d1_snapshot_cleanup_is_root_and_cannot_mask_import_error() -> None:
                      migration = SCRIPT.split("def migrate_sql", 1)[1].split(
                          "def enable_dual", 1
                      )[0]
                      cleanup = migration.split("finally:", 1)[1]
                      assert '"rm"' in cleanup
                      assert 'user="0:0"' in cleanup
                      assert "check=False" in cleanup
                  '''
              ).lstrip(),
              encoding="utf-8",
          )
          PY

          python -m pip install --disable-pip-version-check ruff==0.12.11 pytest==8.4.2
          ruff format scripts/host_core_production.py tests/host_core_migration_staging_contract_test.py
          ruff check scripts/host_core_production.py tests/host_core_migration_staging_contract_test.py
          pytest -q \
            tests/host_core_migration_staging_contract_test.py \
            tests/host_core_bootstrap_contract_test.py
          git diff --check

          git rm .github/workflows/host-core-migration-file-ownership-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/host_core_production.py tests/host_core_migration_staging_contract_test.py
          git commit -m "fix(host-core): normalize D1 snapshot ownership before import"
          git push origin HEAD:fix/host-core-migration-file-ownership-20260904
