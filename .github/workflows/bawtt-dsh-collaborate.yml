name: BAWTT DSH Collaboration
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/bawtt-dsh-collaborate.yml]
permissions:
  contents: read
  checks: read
concurrency:
  group: bawtt-dsh-collaborate
  cancel-in-progress: false
jobs:
  collaborate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 126c359919556081f68cf8199f5de9898129694b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify reviewed SSH baseline and fixed collaboration client
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit 126c359919556081f68cf8199f5de9898129694b --wait-seconds 0 --format json
          git show 48b6f91f963ea16f9e3dad9432d6744558b1b0d0:scripts/bawtt_dsh_assist.py > "$RUNNER_TEMP/bawtt_dsh_assist.py"
          python -m py_compile "$RUNNER_TEMP/bawtt_dsh_assist.py"
          python -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==50.0.1
      - name: Delegate one isolated query investigation and collect its receipt
        env:
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, logging, os
          from pathlib import Path
          import paramiko
          from wechat_airflow.clients.android_device import PinnedSHA256HostKeyPolicy
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          code = (Path(os.environ['RUNNER_TEMP'])/'bawtt_dsh_assist.py').read_text()
          client = paramiko.SSHClient()
          try:
              client.set_missing_host_key_policy(PinnedSHA256HostKeyPolicy(os.environ['PI_DEVICE_SSH_HOST_KEY_SHA256']))
              client.connect(os.environ['PI_DEVICE_SSH_HOST'],port=int(os.environ['PI_DEVICE_SSH_PORT']),username=os.environ['PI_DEVICE_SSH_USER'],password=os.environ['PI_DEVICE_SSH_PASSWORD'],timeout=12,auth_timeout=12,banner_timeout=12,allow_agent=False,look_for_keys=False)
              client.get_transport().set_keepalive(15)
              stdin,stdout,stderr = client.exec_command('timeout 360s python3 -u -',timeout=400)
              stdin.write(code); stdin.flush(); stdin.channel.shutdown_write()
              raw = stdout.read(131073)
              if len(raw) > 131072: raise ValueError('oversized_sanitized_report')
              report = json.loads(raw)
              rendered = json.dumps(report,ensure_ascii=False,sort_keys=True)
              print(rendered)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('### Pi DSH collaboration; not production acceptance\n```json\n'+rendered+'\n```\n')
              if report.get('status') != 'completed': raise SystemExit(1)
          except SystemExit: raise
          except Exception as error:
              print(json.dumps({'errorClass':type(error).__name__,'status':'unknown_check_owned_receipt_before_retry'}))
              raise SystemExit(1)
          finally: client.close()
          PY
