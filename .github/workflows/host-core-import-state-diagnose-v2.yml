name: One-time Host Core import-state diagnosis v2

on:
  push:
    branches:
      - ops/host-core-broken-pipe-diagnose-20260904

permissions:
  contents: write

concurrency:
  group: one-time-host-core-import-state-diagnosis-v2
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      TARGET_COMMIT: d15718bef5a2a0a8749b5ff93420aa7a7f278190
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/host-core-broken-pipe-diagnose-20260904
          fetch-depth: 0

      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Read import and database state without mutation
        run: |
          set -euo pipefail
          python_payload="$(python - <<'PY'
          import base64
          payload = r'''
          import json
          from sqlalchemy import text
          from wechat_airflow.host_core.database import get_engine

          with get_engine().connect() as connection:
              connection.execute(text("SET statement_timeout = '5s'"))
              activity = [
                  dict(row)
                  for row in connection.execute(text('''
                      SELECT pid, state, wait_event_type, wait_event,
                             now() - query_start AS query_age,
                             left(query, 180) AS query
                      FROM pg_stat_activity
                      WHERE datname = current_database()
                        AND pid <> pg_backend_pid()
                        AND (
                          query ILIKE '%zacks.%'
                          OR application_name ILIKE '%zacks%'
                        )
                      ORDER BY query_start
                  ''')).mappings()
              ]
              state = connection.execute(text('''
                  SELECT source, source_revision, imported_at, cutover_at, details
                  FROM zacks.migration_state
                  WHERE source = 'cloudflare-d1'
              ''')).mappings().one_or_none()
              counts = {
                  'venues': int(connection.execute(text('SELECT count(*) FROM zacks.venue_status')).scalar_one()),
                  'subscriptions': int(connection.execute(text('SELECT count(*) FROM zacks.subscriptions')).scalar_one()),
                  'activeSubscriptions': int(connection.execute(text('SELECT count(*) FROM zacks.subscriptions WHERE active = true')).scalar_one()),
                  'verifiedReceipts': int(connection.execute(text('SELECT count(*) FROM zacks.verified_receipts')).scalar_one()),
                  'notificationOutbox': int(connection.execute(text('SELECT count(*) FROM zacks.notification_outbox')).scalar_one()),
              }
          print(json.dumps({
              'migrationState': dict(state) if state else None,
              'counts': counts,
              'activity': activity,
          }, default=str, sort_keys=True))
          '''
          print(base64.b64encode(payload.encode()).decode())
          PY
          )"
          ssh \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=45 \
            -o TCPKeepAlive=yes \
            -p "$AIRFLOW_SSH_PORT" \
            "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            "set -euo pipefail; cd '$AIRFLOW_REPOSITORY_PATH'; \
             echo REMOTE_HEAD=\$(git rev-parse HEAD); \
             echo IMPORT_PROCESSES=; \
             ps -eo pid=,etime=,stat=,args= | grep '[i]mport_d1_sql_export.py' || true; \
             echo HOST_CORE_LOCAL_HEALTH=; \
             curl --fail --silent --show-error --max-time 20 \
               http://127.0.0.1:8090/zacks-api/api/healthz | jq -c .; \
             echo POSTGRES_STATE=; \
             printf '%s' '$python_payload' | base64 -d | \
               docker compose -f docker-compose.yml exec -T zacks-api python -; \
             test \"\$(git rev-parse HEAD)\" = '$TARGET_COMMIT'"

      - name: Remove one-time diagnostic workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/host-core-import-state-diagnose-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: retire completed Host Core import-state diagnosis"
          git push origin HEAD:ops/host-core-broken-pipe-diagnose-20260904
