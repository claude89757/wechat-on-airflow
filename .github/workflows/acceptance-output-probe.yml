name: Temporary isolated acceptance output contract (expected producer failure)
on:
  pull_request:
    paths:
      - .github/workflows/acceptance-output-probe.yml
      - .github/workflows/_acceptance-output-probe.yml
permissions:
  contents: read
jobs:
  acceptance:
    uses: ./.github/workflows/_acceptance-output-probe.yml
  would_pause:
    needs: acceptance
    if: >-
      always() && ((needs.acceptance.result != 'success' || needs.acceptance.outputs.acceptance_status != 'accepted') &&
      (needs.acceptance.result != 'failure' || needs.acceptance.outputs.acceptance_status != 'pending'))
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Synthetic only; this must be skipped for pending'; exit 1
  would_tag:
    needs: acceptance
    if: always() && needs.acceptance.result == 'success' && needs.acceptance.outputs.acceptance_status == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Synthetic tag eligibility only; no actual tag or release created'
  verify_pending_output:
    needs: [acceptance, would_pause, would_tag]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert actual GitHub cross-failure output propagation
        env:
          RESULT: ${{ needs.acceptance.result }}
          STATUS: ${{ needs.acceptance.outputs.acceptance_status }}
          PAUSE: ${{ needs.would_pause.result }}
          TAG: ${{ needs.would_tag.result }}
        run: |
          printf 'producer_result=%s acceptance_status=%s pause=%s tag=%s\n' "$RESULT" "$STATUS" "$PAUSE" "$TAG"
          test "$PAUSE" = skipped
          if [ "${{ github.run_attempt }}" = 1 ]; then
            test "$RESULT" = failure
            test "$STATUS" = pending
            test "$TAG" = skipped
          else
            test "$RESULT" = success
            test "$STATUS" = accepted
            test "$TAG" = success
          fi
          echo 'Actual reusable failure output contract verified; no production access or delivery.'
