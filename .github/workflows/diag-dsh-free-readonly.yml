name: Diagnose Dashah free courts (read only)

on:
  push:
    branches: [diag/dsh-free-readonly-20260907]
    paths: [.github/workflows/diag-dsh-free-readonly.yml]

permissions:
  contents: read

concurrency:
  group: production-airflow-v2
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure protected SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read bounded task history and sanitized log counters
        env:
          AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
          AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
          AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
          AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
        run: |
          python - <<'RUNNER'
          import os
          import shlex
          import subprocess
          script = r'''
          import json
          import logging
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          logging.disable(logging.CRITICAL)
          def emit(key, value):
              print(json.dumps({key: value}, ensure_ascii=False, default=str), flush=True)
          emit('checked_at', datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          from airflow.settings import Session
          from airflow.configuration import conf
          from sqlalchemy import text
          run_ids = []
          queries = [
              ('recent_runs', 'SELECT run_id,state,logical_date,start_date,end_date FROM dag_run WHERE dag_id=:dag ORDER BY id DESC LIMIT 12'),
              ('last_24h', "SELECT state,count(*) AS count,min(start_date) AS first_start,max(end_date) AS last_end FROM dag_run WHERE dag_id=:dag AND logical_date > now() - interval '24 hours' GROUP BY state"),
          ]
          for name, query in queries:
              try:
                  with Session() as session:
                      session.execute(text('SET TRANSACTION READ ONLY'))
                      session.execute(text("SET LOCAL statement_timeout = '15s'"))
                      rows = session.execute(text(query), {'dag':'大沙河免费场巡检'}).mappings().all()
                      emit(name, [dict(row) for row in rows])
                      if name == 'recent_runs':
                          run_ids = [row['run_id'] for row in rows]
                      session.rollback()
              except Exception as exc:
                  emit(name + '_error', {'type':type(exc).__name__, 'sqlstate':getattr(getattr(exc,'orig',None),'pgcode',None)})
          try:
              roots = [Path(conf.get('logging','base_log_folder')), Path('/opt/airflow/logs')]
              logs = set()
              for root in roots:
                  for run in run_ids[:8]:
                      folder = root / 'dag_id=大沙河免费场巡检' / ('run_id=' + run) / 'task_id=check_free_courts'
                      if folder.is_dir():
                          logs.update(folder.glob('attempt=*.log'))
              evidence = []
              for path in sorted(logs, key=lambda p:p.stat().st_mtime, reverse=True)[:12]:
                  if path.stat().st_size > 2_000_000:
                      continue
                  value = path.read_text(errors='replace')
                  counts = re.findall(r'ready_dates=(\d+), free_dates=(\d+), available_slots=(\d+)',value)
                  errors = sorted(set(re.findall(r'\b(?:NswttAuthExpired|NswttApiError|ConnectTimeout|ReadTimeout|ConnectionError|KeyError|TypeError|ValueError|RuntimeError)\b',value)))
                  missing_dates = re.findall(r'no free courts released for date=(\d{4}-\d{2}-\d{2})',value)
                  queue_errors = re.findall(r'\[HOST_WECHAT_QUEUE\] enqueue failed venue=dsh_free, error=([A-Za-z]+)',value)
                  evidence.append({'run':path.parent.parent.name, 'attempt':path.name, 'inspection_counts':counts[-1:], 'error_types':errors, 'unreleased_dates':missing_dates, 'enqueue_error_types':queue_errors})
              emit('task_log_evidence',evidence)
          except Exception as exc:
              emit('log_read_error',type(exc).__name__)
          '''
          remote = 'set -eu; cd ' + shlex.quote(os.environ['AIRFLOW_REPOSITORY_PATH']) + '; '
          remote += 'printf "DEPLOYED_COMMIT "; git rev-parse HEAD; '
          remote += 'cid=$(docker ps --filter label=com.docker.compose.service=airflow-worker --format "{{.ID}}" | head -n 1); '
          remote += 'test -n "$cid"; docker exec -i -e PYTHONDONTWRITEBYTECODE=1 "$cid" python -B -'
          result = subprocess.run([
              'ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes',
              '-o','ConnectTimeout=15','-o','ServerAliveInterval=15',
              '-o','ServerAliveCountMax=3','-p',os.environ['AIRFLOW_SSH_PORT'],
              os.environ['AIRFLOW_SSH_USER']+'@'+os.environ['AIRFLOW_SSH_HOST'],remote,
          ],input=script,text=True,timeout=120)
          raise SystemExit(result.returncode)
          RUNNER
