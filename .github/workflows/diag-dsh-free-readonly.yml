name: Diagnose Dashah free courts (read only)
on:
  push:
    branches: [diag/dsh-free-readonly-20260907]
    paths: [.github/workflows/diag-dsh-free-readonly.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2698e2cba4b2c171c260c275fe4db9d65eedb68e
      - run: git archive --format=tar.gz HEAD > /tmp/public-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-2698e2c
          path: /tmp/public-source.tar.gz
          retention-days: 1
  email:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: production-airflow-v2
      cancel-in-progress: false
    steps:
      - name: Configure protected identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read matching account eligibility without disclosing addresses
        env:
          HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
          PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
          USER: ${{ secrets.AIRFLOW_SSH_USER }}
        run: |
          python - <<'RUNNER'
          import os, subprocess
          script = r'''
          import hashlib,json,logging
          from datetime import datetime
          from zoneinfo import ZoneInfo
          logging.disable(logging.CRITICAL)
          from sqlalchemy import text
          from wechat_airflow.host_core.database import get_engine
          targets={'ad1c0a9593a14123e1990172268032fc57745f59e390b8669bb0bfacc803fb6f':'connected_gmail','27712e6f09af5722d9d4ba6c9b8c7bc4fdacaacb15b24aabff529e4b7a20b1a6':'known_alias'}
          def emit(name,value):print(json.dumps({name:value},default=str,ensure_ascii=False),flush=True)
          def query(sql,params=None):
              with get_engine().connect() as c:
                  c.execute(text('SET TRANSACTION READ ONLY'))
                  c.execute(text("SET LOCAL statement_timeout='8s'"))
                  rows=[dict(r) for r in c.execute(text(sql),params or {}).mappings()]
                  c.rollback()
                  return rows
          emit('checked_at',datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          accounts=query('SELECT email FROM zacks.user_profiles UNION SELECT email FROM zacks.subscriptions')
          found=[]
          for account in accounts:
              email=account['email']
              label=targets.get(hashlib.sha256(email.lower().strip().encode()).hexdigest())
              if not label:continue
              found.append(label)
              params={'email':email}
              subs=query('SELECT start_time,end_time,weekday_mask,venue_ids,active,auto_renew,active_until,created_at,updated_at FROM zacks.subscriptions WHERE email=:email ORDER BY created_at DESC LIMIT 30',params)
              out=query("SELECT venue_id,status,tier,count(*) AS event_rows,count(DISTINCT message_id) AS messages,min(created_at) AS first_created,max(delivered_at) AS last_delivered FROM zacks.notification_outbox WHERE email=:email AND created_at>=timestamptz '2026-09-07 00:00:00+08' GROUP BY venue_id,status,tier ORDER BY venue_id,status",params)
              history=query("SELECT (created_at AT TIME ZONE 'Asia/Shanghai')::date AS day,status,count(*) AS event_rows,count(DISTINCT message_id) AS messages,max(delivered_at) AS last_delivered FROM zacks.notification_outbox WHERE email=:email AND venue_id='dsh_free' GROUP BY 1,2 ORDER BY 1 DESC LIMIT 20",params)
              tier=query('SELECT tier,revoked_at FROM zacks.user_delivery_tiers WHERE email=:email',params)
              emit(label,{'subscriptions':subs,'today_notifications':out,'free_court_history':history,'tier':tier})
          emit('matched_accounts',found)
          emit('recent_channel_totals',query("SELECT venue_id,status,count(*) AS n FROM zacks.notification_outbox WHERE created_at>now()-interval '2 hours' GROUP BY venue_id,status ORDER BY venue_id,status"))
          '''
          remote='cid=$(docker ps --filter label=com.docker.compose.service=zacks-api --format "{{.ID}}" | head -n 1); test -n "$cid"; docker exec -i -e PYTHONDONTWRITEBYTECODE=1 "$cid" python -B -'
          r=subprocess.run(['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=15','-p',os.environ['PORT'],os.environ['USER']+'@'+os.environ['HOST'],remote],input=script,text=True,timeout=160)
          raise SystemExit(r.returncode)
          RUNNER
  sender:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    concurrency:
      group: production-wechat-sender-v2
      cancel-in-progress: false
    steps:
      - name: Configure protected sender identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WECHAT_SENDER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WECHAT_SENDER_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect ledger and error categories only; no UI actions
        env:
          HOST: ${{ secrets.WECHAT_SENDER_SSH_HOST }}
          PORT: ${{ secrets.WECHAT_SENDER_SSH_PORT }}
          USER: ${{ secrets.WECHAT_SENDER_SSH_USER }}
        run: |
          python - <<'RUNNER'
          import os,subprocess
          script=r'''
          import json,sqlite3,subprocess,re
          from collections import Counter
          def emit(k,v):print(json.dumps({k:v},ensure_ascii=False,default=str),flush=True)
          db=sqlite3.connect('file:/var/lib/wechat-sender/idempotency.sqlite3?mode=ro',uri=True,timeout=5)
          db.row_factory=sqlite3.Row
          db.execute('PRAGMA query_only=ON')
          rows=db.execute("SELECT idempotency_key,status,result_json,created_at,updated_at FROM sends WHERE created_at BETWEEN '2026-09-07 06:42:35' AND '2026-09-07 06:43:00' OR created_at BETWEEN '2026-09-07 07:30:35' AND '2026-09-07 07:31:00'").fetchall()
          safe=[]
          for r in rows:
              d=dict(r); raw=d.pop('result_json'); key=d.pop('idempotency_key');d['intent_prefix']=key[:10]
              try:p=json.loads(raw) if raw else {}
              except ValueError:p={}
              d['result']={k:p.get(k) for k in ('success','sent_count','error','navigation_path','session_reused')}
              safe.append(d)
          emit('target_ledger_results',safe)
          emit('sender_totals',[dict(r) for r in db.execute("SELECT status,count(*) AS n FROM sends WHERE created_at>='2026-09-06 16:00:00' GROUP BY status")])
          db.close()
          signatures=('StaleElementReferenceException','InvalidSessionIdException','NoSuchDriverError','TimeoutException','contact_not_found','send_failed','submission_unknown','wechat_not_ready','target chat was not verified','receiver did not open','unable to return to WeChat main page','visual send button remained active after tap','UiAutomation not connected')
          for unit in ('wechat-sender.service','appium-6002.service'):
              r=subprocess.run(['journalctl','-u',unit,'--since','2026-09-07 02:00:00 UTC','--until','2026-09-07 08:00:00 UTC','--no-pager','-n','5000','-o','cat'],capture_output=True,text=True,timeout=20)
              emit('journal_categories',{'service':unit,'lines':len(r.stdout.splitlines()),'error_counts':{s:r.stdout.count(s) for s in signatures if s in r.stdout},'http_statuses':dict(Counter(re.findall(r'POST /v1/wechat/send HTTP/1.1" (\d{3})',r.stdout)))})
          '''
          r=subprocess.run(['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=15','-p',os.environ['PORT'],os.environ['USER']+'@'+os.environ['HOST'],'python3 -B -'],input=script,text=True,timeout=100)
          raise SystemExit(r.returncode)
          RUNNER
