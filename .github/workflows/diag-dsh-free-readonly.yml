name: Diagnose Dashah free courts (read only)

on:
  push:
    branches: [diag/dsh-free-readonly-20260907]
    paths: [.github/workflows/diag-dsh-free-readonly.yml]

permissions:
  contents: read

concurrency:
  group: production-airflow-v2
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure protected SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Trace whole-day detections and durable notification results without writes or sends
        env:
          AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
          AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
          AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
          AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
        run: |
          python - <<'RUNNER'
          import os
          import shlex
          import subprocess
          worker_script = r'''
          import contextlib
          import io
          import json
          import logging
          import os
          import re
          import time
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          logging.disable(logging.CRITICAL)
          tz = ZoneInfo('Asia/Shanghai')
          def emit(key, value):
              print(json.dumps({key:value},ensure_ascii=False,default=str),flush=True)
          emit('worker_checked_at',datetime.now(tz).isoformat())
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              from airflow.configuration import conf
              from airflow.models.variable import Variable
              cache = Variable.get('大沙河免费场',default_var=[],deserialize_json=True)
          cache_dates = Counter()
          if isinstance(cache,list):
              for item in cache:
                  match = re.search(r'\((\d{2}-\d{2})\)',str(item))
                  if match: cache_dates[match.group(1)] += 1
          emit('wechat_preclaim_cache',{'count':len(cache) if isinstance(cache,list) else None,'booking_date_counts':dict(cache_dates)})
          root = Path(conf.get('logging','base_log_folder')) / 'dag_id=大沙河免费场巡检'
          deadline = time.monotonic()+110
          total_bytes = 0
          daily = defaultdict(Counter)
          hourly = defaultdict(Counter)
          positives = []
          anomalies = []
          if not root.is_dir():
              emit('log_scan_error','missing_dag_log_directory')
          else:
              for entry in os.scandir(root):
                  name = entry.name
                  if not name.startswith('run_id=scheduled__'): continue
                  try: stamp = datetime.fromisoformat(name.split('scheduled__',1)[1]).astimezone(tz)
                  except ValueError: continue
                  day = stamp.strftime('%Y-%m-%d')
                  if not '2026-09-05' <= day <= '2026-09-07': continue
                  if time.monotonic()>deadline or total_bytes>150_000_000:
                      emit('scan_truncated',True)
                      break
                  for path in (Path(entry.path)/'task_id=check_free_courts').glob('attempt=*.log'):
                      size=path.stat().st_size
                      if size>1_000_000: continue
                      total_bytes+=size
                      value=path.read_text(errors='replace')
                      counts=re.findall(r'ready_dates=(\d+), free_dates=(\d+), available_slots=(\d+)',value)
                      queue_errors=re.findall(r'\[HOST_WECHAT_QUEUE\] enqueue failed venue=dsh_free, error=([A-Za-z]+)',value)
                      error_types=sorted(set(re.findall(r'\b(?:NswttAuthExpired|NswttApiError|ConnectTimeout|ReadTimeout|ConnectionError)\b',value)))
                      released=re.findall(r'\[WEBAPP_WECHAT_GATE\] released dedupe venue=dsh_free[^\n]{0,150}?removed=(\d+)',value)
                      hour=stamp.strftime('%Y-%m-%d %H:00')
                      record={'at':stamp.isoformat(),'attempt':path.name,'counts':counts[-1:] ,'enqueue_errors':queue_errors,'dedupe_released':released,'errors':error_types}
                      for bucket in (daily[day],hourly[hour]):
                          bucket['attempt_logs']+=1
                          bucket['complete']+=bool(counts)
                          bucket['positive_polls']+=bool(counts and int(counts[-1][2])>0)
                          bucket['enqueue_failures']+=len(queue_errors)
                          bucket['dedupe_releases']+=len(released)
                          bucket['auth_or_network_errors']+=bool(error_types)
                          if counts: bucket['max_slots']=max(bucket['max_slots'],int(counts[-1][2]))
                      if counts and int(counts[-1][2])>0: positives.append(record)
                      if queue_errors or released or error_types: anomalies.append(record)
              emit('log_scan',{'bytes_read':total_bytes,'daily':dict(sorted(daily.items())),'today_hourly':{k:v for k,v in sorted(hourly.items()) if k.startswith('2026-09-07')}})
              today_positive=sorted([r for r in positives if r['at'].startswith('2026-09-07')],key=lambda r:r['at'])
              emit('today_positive_samples',today_positive[:8]+today_positive[-12:])
              emit('today_anomaly_samples',sorted([r for r in anomalies if r['at'].startswith('2026-09-07')],key=lambda r:r['at'])[-24:])
          '''
          core_script = r'''
          import json
          import logging
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          logging.disable(logging.CRITICAL)
          from sqlalchemy import text
          from wechat_airflow.host_core.database import get_engine
          from wechat_airflow.host_core.wechat_worker import sender_readiness
          tz=ZoneInfo('Asia/Shanghai')
          def emit(key,value):
              print(json.dumps({key:value},ensure_ascii=False,default=str),flush=True)
          emit('core_checked_at',datetime.now(tz).isoformat())
          emit('core_runtime_commit',os.environ.get('DEPLOYMENT_COMMIT'))
          queries=[
          ('runtime_control',"SELECT delivery_enabled,wechat_enabled,phase,deployment_commit,activated_at,updated_at FROM zacks.runtime_control"),
          ('venue_status',"SELECT healthy,last_inspection_at,last_notification_at FROM zacks.venue_status WHERE venue_id='dsh_free'"),
          ('wechat_daily',"SELECT (created_at AT TIME ZONE 'Asia/Shanghai')::date AS day,status,count(*) AS intents,sum(attempt_count) AS attempts,min(created_at) AS first_created,max(created_at) AS last_created,max(sent_at) AS last_sent FROM zacks.wechat_outbox WHERE venue_id='dsh_free' AND created_at>=timestamptz '2026-09-01 00:00:00+08' GROUP BY 1,2 ORDER BY 1,2"),
          ('wechat_today',"SELECT left(id,12) AS intent_id,status,attempt_count,created_at,updated_at,expires_at,sent_at,last_error,jsonb_array_length(event_keys) AS events,(receiver='Zacks_大沙河限定免费') AS intended_free_group FROM zacks.wechat_outbox WHERE venue_id='dsh_free' AND created_at>=timestamptz '2026-09-07 00:00:00+08' ORDER BY created_at LIMIT 100"),
          ('wechat_all_today',"SELECT status,count(*) AS intents,min(created_at) AS first_created,max(sent_at) AS last_sent FROM zacks.wechat_outbox WHERE created_at>=timestamptz '2026-09-07 00:00:00+08' GROUP BY status"),
          ('email_daily',"SELECT (created_at AT TIME ZONE 'Asia/Shanghai')::date AS day,status,count(*) AS slot_recipient_rows,count(DISTINCT message_id) AS provider_messages,count(DISTINCT email) AS recipients,min(created_at) AS first_created,max(delivered_at) AS last_delivered FROM zacks.notification_outbox WHERE venue_id='dsh_free' AND created_at>=timestamptz '2026-09-01 00:00:00+08' GROUP BY 1,2 ORDER BY 1,2"),
          ('email_today',"SELECT left(n.id,12) AS row_id,n.status,n.tier,n.attempt_count,n.created_at,n.submitted_at,n.delivered_at,n.last_error,s.booking_date,s.court_name,s.start_time,s.end_time FROM zacks.notification_outbox n LEFT JOIN zacks.observed_slots s USING(event_key) WHERE n.venue_id='dsh_free' AND n.created_at>=timestamptz '2026-09-07 00:00:00+08' ORDER BY n.created_at LIMIT 100"),
          ('observed_slots_recent',"SELECT booking_date,count(*) AS slot_count,min(first_observed_at) AS first_seen,max(last_observed_at) AS last_seen,count(*) FILTER(WHERE first_observed_at>=timestamptz '2026-09-07 00:00:00+08') AS first_seen_today FROM zacks.observed_slots WHERE venue_id='dsh_free' AND booking_date>='2026-09-01' GROUP BY booking_date ORDER BY booking_date"),
          ('observed_today',"SELECT court_name,booking_date,start_time,end_time,first_observed_at,last_observed_at FROM zacks.observed_slots WHERE venue_id='dsh_free' AND last_observed_at>=timestamptz '2026-09-07 00:00:00+08' ORDER BY first_observed_at LIMIT 100"),
          ('active_subscription_rules',"SELECT s.start_time,s.end_time,s.weekday_mask,count(*) AS subscriptions,count(DISTINCT s.email) AS recipients,min(s.created_at) AS earliest_created,min(s.active_until) AS earliest_expiry FROM zacks.subscriptions s JOIN zacks.subscription_venues v ON v.subscription_id=s.id WHERE v.venue_id='dsh_free' AND s.active AND s.active_until>now() GROUP BY s.start_time,s.end_time,s.weekday_mask"),
          ]
          for name,query in queries:
              try:
                  with get_engine().connect() as c:
                      c.execute(text('SET TRANSACTION READ ONLY'))
                      c.execute(text("SET LOCAL statement_timeout = '8s'"))
                      rows=[dict(r) for r in c.execute(text(query)).mappings()]
                      for row in rows:
                          if 'last_error' in row:
                              error=row.pop('last_error')
                              row['error_code']=error if error and re.fullmatch(r'[A-Za-z_]{1,80}',error) else ('other_redacted' if error else None)
                      emit(name,rows)
                      c.rollback()
              except Exception as exc:
                  emit(name+'_error',{'type':type(exc).__name__,'sqlstate':getattr(getattr(exc,'orig',None),'pgcode',None)})
          emit('sender_readiness',sender_readiness())
          '''
          for service,script in [('airflow-worker',worker_script),('zacks-api',core_script)]:
              remote='set -eu; cd '+shlex.quote(os.environ['AIRFLOW_REPOSITORY_PATH'])+'; '
              remote+='printf "DEPLOYED_WORKTREE "; git rev-parse HEAD; '
              remote+='cid=$(docker ps --filter label=com.docker.compose.service='+service+' --format "{{.ID}}" | head -n 1); '
              remote+='test -n "$cid"; docker exec -i -e PYTHONDONTWRITEBYTECODE=1 "$cid" python -B -'
              result=subprocess.run(['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3','-p',os.environ['AIRFLOW_SSH_PORT'],os.environ['AIRFLOW_SSH_USER']+'@'+os.environ['AIRFLOW_SSH_HOST'],remote],input=script,text=True,timeout=210)
              if result.returncode: raise SystemExit(result.returncode)
          RUNNER
