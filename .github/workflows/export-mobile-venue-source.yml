name: Export Mobile Venue Source

on:
  push:
    branches:
      - feat/mobile-venue-card-quick-create-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-venue-card-quick-create-20260830
          fetch-depth: 0
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: mobile-venue-source
          path: |
            webapp
            scripts/patch_mobile_venue_cards.py
          include-hidden-files: true
          retention-days: 1
