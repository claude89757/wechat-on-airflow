name: Deploy admin and email lifecycle feature
run-name: production/admin-email-lifecycle/${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  checks: read
  contents: read
  issues: write

concurrency:
  group: deploy-admin-email-lifecycle
  cancel-in-progress: false

jobs:
  gate:
    if: contains(github.event.head_commit.message, 'admin operations and accurate email lifecycle')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      target_commit: ${{ steps.target.outputs.sha }}
    steps:
      - name: Record exact main commit
        id: target
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Wait for main CI verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2100))
          while (( SECONDS < deadline )); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT/check-runs" \
              --jq '[.check_runs[] | select(.name == "verify")] | sort_by(.started_at) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            if [[ "$result" == $'completed\tsuccess' ]]; then
              exit 0
            fi
            if [[ "$result" == completed$'\t'* && "$result" != $'completed\tsuccess' ]]; then
              echo "CI verify failed: $result" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for CI verify" >&2
          exit 1

  preflight:
    needs: gate
    uses: ./.github/workflows/production-webapp.yml
    with:
      operation: deploy_preflight
      target_commit: ${{ needs.gate.outputs.target_commit }}
      request_id: admin-email-lifecycle-${{ github.run_id }}-preflight
    secrets: inherit

  apply:
    needs: [gate, preflight]
    uses: ./.github/workflows/production-webapp.yml
    with:
      operation: deploy_apply
      target_commit: ${{ needs.gate.outputs.target_commit }}
      request_id: admin-email-lifecycle-${{ github.run_id }}-apply
    secrets: inherit

  accept:
    needs: [gate, apply]
    uses: ./.github/workflows/production-admin-acceptance.yml
    with:
      target_commit: ${{ needs.gate.outputs.target_commit }}
    secrets: inherit

  report:
    if: always() && needs.gate.result != 'skipped'
    needs: [gate, preflight, apply, accept]
    runs-on: ubuntu-latest
    steps:
      - name: Report production result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ needs.gate.outputs.target_commit }}
          PREFLIGHT: ${{ needs.preflight.result }}
          APPLY: ${{ needs.apply.result }}
          ACCEPT: ${{ needs.accept.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          result=success
          if [[ "$PREFLIGHT" != success || "$APPLY" != success || "$ACCEPT" != success ]]; then
            result=failure
          fi
          gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body \
            "Admin/community/email lifecycle production deployment for \`$TARGET_COMMIT\`: \`$result\` (preflight=$PREFLIGHT, apply=$APPLY, acceptance=$ACCEPT). Run: $RUN_URL"
          test "$result" = success
