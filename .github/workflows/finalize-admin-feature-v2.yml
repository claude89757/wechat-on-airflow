name: Finalize admin and email lifecycle feature v2
run-name: finalize-v2/admin-email-lifecycle/${{ github.sha }}

on:
  push:
    branches:
      - feat/admin-operations-email-lifecycle

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-admin-email-lifecycle
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[finalize-admin-feature-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/admin-operations-email-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Generate implementation when needed
        run: |
          set -euo pipefail
          if [[ ! -f webapp/cloudflare/admin-privacy.ts ]]; then
            python .feature/admin/write_backend_files.py
            python .feature/admin/write_frontend_files.py
            python .feature/admin/patch_backend.py
            python .feature/admin/patch_ui.py
          fi
      - name: Apply deterministic TypeScript compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('webapp/src/OperationsPanel.tsx')
          text = panel.read_text()
          text = text.replace('  CheckCircleIcon,\n', '')
          text = text.replace('  KeyIcon,\n', '')
          panel.write_text(text)

          ses = Path('webapp/cloudflare/tencent-ses.ts')
          text = ses.read_text()
          old = '''function base64UrlToBytes(value: string): Uint8Array {\n  const padded = value.replaceAll("-", "+").replaceAll("_", "/")\n    + "=".repeat((4 - value.length % 4) % 4);\n  const binary = atob(padded);\n  return Uint8Array.from(binary, (character) => character.charCodeAt(0));\n}'''
          new = '''function base64UrlToBytes(value: string): Uint8Array<ArrayBuffer> {\n  const padded = value.replaceAll("-", "+").replaceAll("_", "/")\n    + "=".repeat((4 - value.length % 4) % 4);\n  const binary = atob(padded);\n  const bytes = new Uint8Array(binary.length);\n  for (let index = 0; index < binary.length; index += 1) {\n    bytes[index] = binary.charCodeAt(index);\n  }\n  return bytes;\n}'''
          if old in text:
              text = text.replace(old, new, 1)
          ses.write_text(text)
          PY
      - name: Verify Web and D1 implementation
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:worker
          npm run build
          npm run cf:migrate:local
      - name: Validate complete requested feature surface
        run: |
          set -euo pipefail
          grep -q 'claudexzt@gmail.com' webapp/migrations/0006_add_admin_email_lifecycle.sql
          grep -q '/api/community/users' webapp/cloudflare/index.ts
          grep -q '/api/admin/users' webapp/cloudflare/index.ts
          grep -q '/api/admin/invites' webapp/cloudflare/index.ts
          grep -q 'GetSendEmailStatus' webapp/cloudflare/tencent-ses.ts
          grep -q 'subscription_expiry' webapp/cloudflare/index.ts
          grep -q '用户社区' webapp/src/Prototype.tsx
          grep -q '管理后台' webapp/src/Prototype.tsx
          grep -q '确认送达' webapp/src/Prototype.tsx
          grep -q '发送失败' webapp/src/Prototype.tsx
          test -f .github/workflows/production-admin-acceptance.yml
          test -f .github/workflows/deploy-admin-email-lifecycle.yml
      - name: Remove temporary generation assets
        run: |
          rm -rf .feature/admin
          rm -f .github/workflows/apply-admin-feature.yml
          rm -f .github/workflows/finalize-admin-feature.yml
          rm -f .github/workflows/finalize-admin-feature-v2.yml
          rm -f .github/workflows/export-admin-feature-snapshot.yml
          rm -f .github/workflows/export-webapp-deps.yml
      - name: Commit final implementation
        id: commit
        env:
          BRANCH: feat/admin-operations-email-lifecycle
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(webapp): add admin operations and accurate email lifecycle"
          git push origin "HEAD:$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for complete branch CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT/check-runs" \
              --jq '[.check_runs[] | select(.name == "verify")] | sort_by(.started_at) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            if [[ "$result" == $'completed\tsuccess' ]]; then exit 0; fi
            if [[ "$result" == completed$'\t'* && "$result" != $'completed\tsuccess' ]]; then
              echo "Branch CI failed: $result" >&2
              exit 1
            fi
            sleep 10
          done
          exit 1
      - name: Make pull request ready and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 56 --repo "$GITHUB_REPOSITORY" || true
          gh pr edit 56 --repo "$GITHUB_REPOSITORY" \
            --title "feat(webapp): add admin operations and accurate email lifecycle" \
            --body "Verified implementation of administrator operations, privacy-safe community users, Tencent delivery reconciliation, expiry reminders, long-term priority subscriptions, quota UX, and protected production acceptance. Cloudflare Email Routing was evaluated but is not suitable for arbitrary user-entered verification recipients, so verification email remains on Tencent SES."
          gh pr merge 56 --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "feat(webapp): add admin operations and accurate email lifecycle" \
            --body "Full branch CI passed. Exact-main production Web deployment and protected acceptance run automatically."
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body "Admin/community/email lifecycle v2 finalization passed and PR #56 was merged. Production deployment follows automatically. Run: $RUN_URL"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body "Admin/community/email lifecycle v2 finalization failed before merge. Run: $RUN_URL"
