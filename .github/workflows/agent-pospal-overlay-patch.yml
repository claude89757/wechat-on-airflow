name: Apply PosPal enrollment overlay repair

on:
  push:
    branches:
      - fix/pospal-enroll-overlay-false-alerts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pospal-enroll-overlay-false-alerts
          fetch-depth: 0
      - name: Apply deterministic source and regression patch
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = '''"""PosPal direct-booking availability guards.

          PosPal renders organized enrollment sessions from ``result.enrollSlots`` on
          top of ordinary court inventory from ``result.slots``.  The underlying
          ordinary slot can still report ``apptInfo.canApptOrNot = true`` while the
          mini-program visibly assigns that court to an enrollment activity.  Such a
          slot is not whole-court inventory and must never be published as an empty
          court.
          """

          from __future__ import annotations

          import datetime
          from dataclasses import dataclass

          DATETIME_FORMAT = "%Y-%m-%d %H:%M:%S"


          @dataclass(frozen=True)
          class _EnrollmentInterval:
              court_uid: str
              court_name: str
              begin: datetime.datetime
              end_exclusive: datetime.datetime


          def _as_mapping(value: object) -> dict[str, object]:
              if not isinstance(value, dict):
                  return {}
              return {str(key): item for key, item in value.items()}


          def _clean_text(value: object) -> str:
              if value is None:
                  return ""
              return " ".join(str(value).split())


          def _court_uid(item: dict[str, object]) -> str:
              return _clean_text(item.get("txtClassroomUid") or item.get("classroomUid"))


          def _court_name(item: dict[str, object]) -> str:
              return _clean_text(item.get("classRoomName"))


          def _time_range(
              item: dict[str, object],
          ) -> tuple[datetime.datetime, datetime.datetime] | None:
              begin_raw = item.get("beginDatetime")
              end_raw = item.get("endDatetime")
              if not isinstance(begin_raw, str) or not isinstance(end_raw, str):
                  return None
              try:
                  begin = datetime.datetime.strptime(begin_raw, DATETIME_FORMAT)
                  # PosPal represents hour cells as inclusive ranges such as 18:00-18:59.
                  end_exclusive = datetime.datetime.strptime(
                      end_raw, DATETIME_FORMAT
                  ) + datetime.timedelta(minutes=1)
              except ValueError:
                  return None
              if end_exclusive <= begin:
                  return None
              return begin, end_exclusive


          def _enrollment_intervals(value: object) -> list[_EnrollmentInterval]:
              if not isinstance(value, list):
                  return []
              intervals: list[_EnrollmentInterval] = []
              for raw_item in value:
                  item = _as_mapping(raw_item)
                  time_range = _time_range(item)
                  if time_range is None:
                      continue
                  court_uid = _court_uid(item)
                  court_name = _court_name(item)
                  if not court_uid and not court_name:
                      continue
                  intervals.append(
                      _EnrollmentInterval(
                          court_uid=court_uid,
                          court_name=court_name,
                          begin=time_range[0],
                          end_exclusive=time_range[1],
                      )
                  )
              return intervals


          def _same_court(slot: dict[str, object], enrollment: _EnrollmentInterval) -> bool:
              slot_uid = _court_uid(slot)
              if slot_uid and enrollment.court_uid:
                  return slot_uid == enrollment.court_uid
              slot_name = _court_name(slot)
              return bool(slot_name and enrollment.court_name and slot_name == enrollment.court_name)


          def _blocked_by_enrollment(
              slot: dict[str, object], enrollments: list[_EnrollmentInterval]
          ) -> bool:
              slot_range = _time_range(slot)
              if slot_range is None:
                  return False
              slot_begin, slot_end = slot_range
              return any(
                  _same_court(slot, enrollment)
                  and max(slot_begin, enrollment.begin)
                  < min(slot_end, enrollment.end_exclusive)
                  for enrollment in enrollments
              )


          def directly_bookable_slots(json_data: object) -> list[dict[str, object]]:
              """Return PosPal slots that are genuinely available for whole-court booking.

              ``canApptOrNot`` describes the ordinary appointment layer only.  Every valid
              interval returned in ``enrollSlots`` is therefore treated as a court blocker,
              irrespective of enrollment capacity or participant count.  This intentionally
              prefers suppressing a doubtful alert over announcing inventory that the official
              mini-program does not expose as an empty court.
              """

              payload = _as_mapping(json_data)
              result = _as_mapping(payload.get("result"))
              raw_slots = result.get("slots")
              if not isinstance(raw_slots, list):
                  return []

              enrollments = _enrollment_intervals(result.get("enrollSlots"))
              available: list[dict[str, object]] = []
              for raw_slot in raw_slots:
                  slot = _as_mapping(raw_slot)
                  appt_info = _as_mapping(slot.get("apptInfo"))
                  if appt_info.get("canApptOrNot") is not True:
                      continue
                  if _blocked_by_enrollment(slot, enrollments):
                      continue
                  available.append(slot)
              return available
          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines()) + "\n"
          Path("src/wechat_airflow/venues/pospal_slots.py").write_text(helper, encoding="utf-8")

          import_anchor = "from wechat_airflow.notifications.wechat import send_wechat_text_to_chatrooms_best_effort\n"
          import_with_guard = import_anchor + "from wechat_airflow.venues.pospal_slots import directly_bookable_slots\n"
          for path in (
              "src/wechat_airflow/venues/fsb_watcher.py",
              "src/wechat_airflow/venues/ppba_watcher.py",
              "src/wechat_airflow/venues/pospal_venue.py",
              "src/wechat_airflow/venues/tops_watcher.py",
          ):
              replace_once(path, import_anchor, import_with_guard)

          standalone_old = '''    payload = _as_mapping(json_data)
              result = _as_mapping(payload.get("result"))
              slots = result.get("slots")
              court_availability: dict[str, list[list[str]]] = {}
              if not isinstance(slots, list):
                  return {}

              for raw_slot in slots:
                  slot = _as_mapping(raw_slot)
                  appt_info = _as_mapping(slot.get("apptInfo"))
                  if appt_info.get("canApptOrNot") is not True:
                      continue
          '''
          standalone_old = "\n".join(line[10:] if line.startswith("          ") else line for line in standalone_old.splitlines()) + "\n"
          standalone_new = '''    court_availability: dict[str, list[list[str]]] = {}

              for slot in directly_bookable_slots(json_data):
          '''
          standalone_new = "\n".join(line[10:] if line.startswith("          ") else line for line in standalone_new.splitlines()) + "\n"
          for path in (
              "src/wechat_airflow/venues/fsb_watcher.py",
              "src/wechat_airflow/venues/ppba_watcher.py",
          ):
              replace_once(path, standalone_old, standalone_new)

          unused_mapping = '''def _as_mapping(value: object) -> dict[str, object]:
              if isinstance(value, dict):
                  return {str(key): item for key, item in value.items()}
              return {}


          '''
          unused_mapping = "\n".join(line[10:] if line.startswith("          ") else line for line in unused_mapping.splitlines())
          for path in (
              "src/wechat_airflow/venues/fsb_watcher.py",
              "src/wechat_airflow/venues/ppba_watcher.py",
          ):
              replace_once(path, unused_mapping, "")

          shared_old = '''    payload = _as_mapping(json_data)
              result = _as_mapping(payload.get("result"))
              slots = result.get("slots")
              court_availability: dict[str, list[list[str]]] = {}
              if not isinstance(slots, list):
                  return {}

              for raw_slot in slots:
                  slot = _as_mapping(raw_slot)
                  appt_info = _as_mapping(slot.get("apptInfo"))
                  if appt_info.get("canApptOrNot") is not True:
                      continue
          '''
          shared_old = "\n".join(line[10:] if line.startswith("          ") else line for line in shared_old.splitlines()) + "\n"
          shared_new = '''    court_availability: dict[str, list[list[str]]] = {}

              for slot in directly_bookable_slots(json_data):
          '''
          shared_new = "\n".join(line[10:] if line.startswith("          ") else line for line in shared_new.splitlines()) + "\n"
          replace_once("src/wechat_airflow/venues/pospal_venue.py", shared_old, shared_new)

          tops_old = '''    slots = json_data.get("result", {}).get("slots", [])
              court_availability = {}

              for slot in slots:
                  appt_info = slot.get("apptInfo") or {}
                  if appt_info.get("canApptOrNot") is not True:
                      continue
          '''
          tops_old = "\n".join(line[10:] if line.startswith("          ") else line for line in tops_old.splitlines()) + "\n"
          tops_new = '''    court_availability = {}

              for slot in directly_bookable_slots(json_data):
          '''
          tops_new = "\n".join(line[10:] if line.startswith("          ") else line for line in tops_new.splitlines()) + "\n"
          replace_once("src/wechat_airflow/venues/tops_watcher.py", tops_old, tops_new)

          regression = '''
              def test_enrollment_overlays_are_not_reported_as_empty_courts(self) -> None:
                  slots = []
                  enroll_slots = []
                  for court_name, court_uid in (("5号风雨场", "court-5"), ("6号风雨场", "court-6")):
                      for hour in range(18, 24):
                          slots.append(
                              {
                                  "classRoomName": court_name,
                                  "txtClassroomUid": court_uid,
                                  "beginDatetime": f"2026-09-07 {hour:02d}:00:00",
                                  "endDatetime": f"2026-09-07 {hour:02d}:59:00",
                                  "apptInfo": {"canApptOrNot": True},
                              }
                          )
                      for begin_hour in (18, 20, 22):
                          enroll_slots.append(
                              {
                                  "classRoomName": court_name,
                                  "txtClassroomUid": court_uid,
                                  "beginDatetime": f"2026-09-07 {begin_hour:02d}:00:00",
                                  "endDatetime": f"2026-09-07 {begin_hour + 1:02d}:59:00",
                                  "status": 0,
                                  "capacity": 0,
                              }
                          )

                  result = fsb_watcher.parse_availability(
                      {
                          "successed": True,
                          "status": "success",
                          "result": {"slots": slots, "enrollSlots": enroll_slots},
                      }
                  )

                  self.assertEqual(result, {})

          '''
          regression = "\n".join(line[14:] if line.startswith("              ") else line for line in regression.splitlines())
          replace_once(
              "tests/fsb_watcher_test.py",
              "    def test_filter_slots_uses_weekday_and_weekend_windows(self) -> None:\n",
              regression + "    def test_filter_slots_uses_weekday_and_weekend_windows(self) -> None:\n",
          )

          helper_test = '''#!/usr/bin/env python3
          from __future__ import annotations

          from wechat_airflow.venues.pospal_slots import directly_bookable_slots


          def _slot(court: str, uid: str, begin: str, end: str, *, can_book: bool = True) -> dict[str, object]:
              return {
                  "classRoomName": court,
                  "txtClassroomUid": uid,
                  "beginDatetime": begin,
                  "endDatetime": end,
                  "apptInfo": {"canApptOrNot": can_book},
              }


          def test_directly_bookable_slots_subtracts_enrollment_overlay_by_overlap() -> None:
              response = {
                  "result": {
                      "slots": [
                          _slot("5号风雨场", "5", "2026-09-07 18:00:00", "2026-09-07 18:59:00"),
                          _slot("5号风雨场", "5", "2026-09-07 19:00:00", "2026-09-07 19:59:00"),
                          _slot("6号风雨场", "6", "2026-09-07 18:00:00", "2026-09-07 18:59:00"),
                      ],
                      "enrollSlots": [
                          {
                              "classRoomName": "5号风雨场",
                              "txtClassroomUid": "5",
                              "beginDatetime": "2026-09-07 18:00:00",
                              "endDatetime": "2026-09-07 19:59:00",
                              "capacity": 0,
                              "status": 0,
                          }
                      ],
                  }
              }

              result = directly_bookable_slots(response)

              assert [(slot["classRoomName"], slot["beginDatetime"]) for slot in result] == [
                  ("6号风雨场", "2026-09-07 18:00:00")
              ]


          def test_directly_bookable_slots_preserves_normal_direct_inventory() -> None:
              response = {
                  "result": {
                      "slots": [
                          _slot("1号场", "1", "2026-09-08 18:00:00", "2026-09-08 18:59:00"),
                          _slot(
                              "2号场",
                              "2",
                              "2026-09-08 18:00:00",
                              "2026-09-08 18:59:00",
                              can_book=False,
                          ),
                      ],
                      "enrollSlots": [],
                  }
              }

              result = directly_bookable_slots(response)

              assert len(result) == 1
              assert result[0]["classRoomName"] == "1号场"


          def test_malformed_enrollment_overlay_does_not_hide_valid_inventory() -> None:
              response = {
                  "result": {
                      "slots": [
                          _slot("1号场", "1", "2026-09-08 18:00:00", "2026-09-08 18:59:00")
                      ],
                      "enrollSlots": [
                          {
                              "classRoomName": "1号场",
                              "txtClassroomUid": "1",
                              "beginDatetime": "bad-time",
                              "endDatetime": "bad-time",
                          }
                      ],
                  }
              }

              assert len(directly_bookable_slots(response)) == 1
          '''
          helper_test = "\n".join(line[10:] if line.startswith("          ") else line for line in helper_test.splitlines()) + "\n"
          Path("tests/pospal_slots_test.py").write_text(helper_test, encoding="utf-8")

          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n",
              "## Unreleased\n\n### Fixed\n\n- Treat PosPal `result.enrollSlots` as occupied court overlays before publishing direct-booking availability. Organized activities can leave the underlying `slots[].apptInfo.canApptOrNot` flag true even though the official mini-program assigns the court; overlapping cells are now suppressed across 福中福, TOPS, PICKLE POP, the shared 泛思博特 chain, and FFT 前海 adapters.\n- Add a regression reproducing the 2026-09-07 福中福 5/6号风雨场 18:00-24:00 enrollment blocks so participant-count activities such as 4/4, 2/4, or 0/4 are never announced as empty whole courts.\n\n### Operations\n\n- Airflow-only parsing correction. No polling cadence, subscriber data, database schema, Web asset, Sender runtime, or provider credential changes; acceptance must use natural inspections without synthetic notifications.\n",
          )

          # Keep the branch clean: the patch workflow is implementation scaffolding, not product code.
          Path(".github/workflows/agent-pospal-overlay-patch.yml").unlink()
          PY
      - name: Commit the deterministic repair
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(pospal): suppress enrollment overlay false availability"
          git push origin HEAD:fix/pospal-enroll-overlay-false-alerts
