name: One-Time Host Core Formatter

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: one-time-host-core-formatter
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 188 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/format-host-core-188'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the repository's pinned Ruff formatter
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.11
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit only deterministic formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "style(host-core): apply repository Ruff formatting"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3
