name: One-time host-core compatibility formatting

on:
  push:
    branches:
      - fix/host-core-production-final-20260904

permissions:
  contents: write

concurrency:
  group: one-time-host-core-compatibility-formatting
  cancel-in-progress: false

jobs:
  format:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-production-final-20260904
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply deterministic Ruff fixes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.11
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Preserve Python 3.6 host compatibility
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          for relative in (
              "scripts/host_core_production.py",
              "scripts/configure_zacks_tunnel.py",
          ):
              source = Path(relative).read_text(encoding="utf-8")
              ast.parse(source, filename=relative, feature_version=(3, 6))
              for forbidden in (
                  "from __future__ import annotations",
                  "capture_output=",
                  "text=True",
                  "missing_ok=",
              ):
                  if forbidden in source:
                      raise SystemExit(f"{relative} contains Python 3.6-incompatible {forbidden}")
          PY
          git rm .github/workflows/host-core-final-format-once.yml
      - name: Commit formatting repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          git commit -m "style(host-core): format production cutover repair"
          git push origin HEAD:fix/host-core-production-final-20260904
