name: Production Pi YDMap Scraper
run-name: production/pi_ydmap/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      drain_preflight:
        description: Reserve the shared Pi browser capacity during a manual deep preflight
        type: boolean
        required: false
        default: true
      allow_interruption:
        description: Replace the live scraper without waiting for the current inspection to finish
        type: boolean
        required: false
        default: false
      target_commit:
        description: Exact reviewed main commit with successful CI
        required: true
        type: string
      operation:
        description: ready, preflight, apply, health or inspect
        required: true
        type: string
      request_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      capture_browser_ui:
        description: Capture a bounded public candidate page on source-readiness failure
        type: boolean
        required: false
        default: false
      drain_preflight:
        description: Quiesce only the YDMap DAGs during candidate preflight, then restore pause flags
        type: boolean
        required: false
        default: true
      allow_interruption:
        description: Replace the live scraper without waiting for the current inspection to finish
        type: boolean
        required: false
        default: false
      target_commit:
        description: Exact reviewed main commit with successful CI
        required: true
        type: string
      operation:
        type: choice
        options: [ready, preflight, apply, health, inspect]
        default: preflight
        required: true
      request_id:
        type: string
        required: true

permissions:
  contents: read
  checks: read
concurrency:
  group: production-airflow-v2
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact main commit and CI
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          OPERATION: ${{ inputs.operation }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$OPERATION" in ready|preflight|apply|health|inspect) ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit "$TARGET_COMMIT" --wait-seconds 0 --format json
      - name: Install pinned SSH dependency
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==50.0.1
      - name: Configure existing Airflow SSH identity for scoped drain
        if: inputs.allow_interruption != true && (inputs.operation == 'apply' || (inputs.operation == 'preflight' && inputs.drain_preflight == true))
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run protected scraper operation
        env:
          DRAIN_PREFLIGHT: ${{ inputs.operation == 'preflight' && inputs.drain_preflight }}
          ALLOW_INTERRUPTION: ${{ inputs.allow_interruption || false }}
          CAPTURE_BROWSER_UI: ${{ inputs.capture_browser_ui || false }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          OPERATION: ${{ inputs.operation }}
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
          AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
          AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
          AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python scripts/deploy_pi_ydmap.py | tee /tmp/pi-ydmap-report.json
      - name: Record bounded evidence
        if: always()
        run: |
          if [ -f /tmp/pi-ydmap-report.json ]; then
            {
              echo '## Pi scraper operation'
              echo '```json'
              cat /tmp/pi-ydmap-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload explicit public verification UI diagnostic
        if: always() && inputs.operation == 'preflight' && inputs.capture_browser_ui == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-ydmap-ui-${{ inputs.request_id }}
          path: .local/diagnostics/pi-ydmap/*.png
          if-no-files-found: warn
          retention-days: 1
