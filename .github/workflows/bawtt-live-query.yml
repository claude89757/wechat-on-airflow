name: YDMap Loaded Booking Evidence
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/bawtt-live-query.yml]
permissions:
  contents: read
  checks: read
concurrency:
  group: bawtt-public-contract-validation
  cancel-in-progress: false
jobs:
  query-preflight:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 126c359919556081f68cf8199f5de9898129694b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify baseline and already-loaded business-resource observer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/github_release_gate.py > scripts/github_release_gate.py
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit 126c359919556081f68cf8199f5de9898129694b --wait-seconds 0 --format json
          for path in scripts/ydmap_source_compare.py tests/ydmap_source_compare_test.py; do
            git show "$SOURCE_SHA:$path" > "$path"
          done
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/bawtt_live_query.py > scripts/bawtt_live_query.py
          python -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==50.0.1 pytest==9.1.1 ruff==0.12.11
          ruff check scripts/ydmap_source_compare.py tests/ydmap_source_compare_test.py
          ruff format --check scripts/ydmap_source_compare.py tests/ydmap_source_compare_test.py
          python -m pytest -q tests/ydmap_source_compare_test.py
      - name: Observe source-specific data and already-loaded public resources
        env:
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, logging, os
          from pathlib import Path
          import paramiko
          from wechat_airflow.clients.android_device import PinnedSHA256HostKeyPolicy
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          sources={name:Path('scripts',name).read_text() for name in ('ydmap_source_compare.py','bawtt_live_query.py')}
          code='import pathlib,tempfile,sys,runpy\nsources='+repr(sources)+'\n'
          code+="with tempfile.TemporaryDirectory(prefix='ydmap-public-business-') as directory:\n"
          code+="    for name,content in sources.items():\n        pathlib.Path(directory,name).write_text(content)\n"
          code+="    sys.path.insert(0,directory)\n    runpy.run_path(str(pathlib.Path(directory,'ydmap_source_compare.py')),run_name='__main__')\n"
          compile(code,'<already-loaded-public-business-evidence>','exec')
          outdir=Path(os.environ['RUNNER_TEMP'])/'ydmap-business-evidence'
          outdir.mkdir(exist_ok=True)
          client=paramiko.SSHClient()
          try:
              client.set_missing_host_key_policy(PinnedSHA256HostKeyPolicy(os.environ['PI_DEVICE_SSH_HOST_KEY_SHA256']))
              client.connect(os.environ['PI_DEVICE_SSH_HOST'],port=int(os.environ['PI_DEVICE_SSH_PORT']),username=os.environ['PI_DEVICE_SSH_USER'],password=os.environ['PI_DEVICE_SSH_PASSWORD'],timeout=12,auth_timeout=12,banner_timeout=12,allow_agent=False,look_for_keys=False)
              client.get_transport().set_keepalive(15)
              stdin,stdout,stderr=client.exec_command('timeout --kill-after=10s 210s python3 -u -',timeout=235)
              stdin.write(code)
              stdin.flush()
              stdin.channel.shutdown_write()
              raw=stdout.read(196609)
              if len(raw)>196608 or not raw:
                  raise ValueError('missing_or_oversized_report')
              report=json.loads(raw)
              report['remoteExitCode']=stdout.channel.recv_exit_status()
              (outdir/'observation.json').write_text(json.dumps(report,ensure_ascii=False))
              print(json.dumps(report,ensure_ascii=False,sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('### Already-loaded public resources; no request replay or release\n```json\n'+json.dumps(report,ensure_ascii=False)+'\n```\n')
              if report['remoteExitCode'] or len(report.get('sources',[]))!=3 or any(s.get('state')!='schedule_cells_observed_without_query_samples' for s in report['sources']):
                  raise SystemExit(1)
          except SystemExit:
              raise
          except Exception as error:
              print(json.dumps({'state':'business_evidence_incomplete','errorClass':type(error).__name__,'productionChanged':False}))
              raise SystemExit(1)
          finally:
              client.close()
          PY
      - name: Preserve bounded business evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ydmap-business-evidence
          path: ${{ runner.temp }}/ydmap-business-evidence/
          retention-days: 1
          if-no-files-found: ignore
