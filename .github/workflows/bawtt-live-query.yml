name: YDMap Native Data and DSH Review
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/bawtt-live-query.yml]
permissions:
  contents: read
  checks: read
concurrency:
  group: bawtt-public-contract-validation
  cancel-in-progress: false
jobs:
  query-preflight:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 126c359919556081f68cf8199f5de9898129694b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify baseline and corrected observation inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/github_release_gate.py > scripts/github_release_gate.py
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit 126c359919556081f68cf8199f5de9898129694b --wait-seconds 0 --format json
          for path in scripts/ydmap_source_compare.py scripts/ydmap_dsh_review.py tests/ydmap_source_compare_test.py tests/ydmap_dsh_review_test.py; do
            git show "$SOURCE_SHA:$path" > "$path"
          done
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/bawtt_live_query.py > scripts/bawtt_live_query.py
          git show 126c359919556081f68cf8199f5de9898129694b:pi_host/dsh_ydmap/server.py > scripts/dashah_server.py
          python -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==50.0.1 pytest==9.1.1 ruff==0.12.11
          ruff check scripts/ydmap_source_compare.py scripts/ydmap_dsh_review.py tests/ydmap_source_compare_test.py tests/ydmap_dsh_review_test.py
          ruff format --check scripts/ydmap_source_compare.py scripts/ydmap_dsh_review.py tests/ydmap_source_compare_test.py tests/ydmap_dsh_review_test.py
          python -m pytest -q tests/ydmap_source_compare_test.py tests/ydmap_dsh_review_test.py
      - name: Observe actual cells then request independent static review
        env:
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, logging, os
          from pathlib import Path
          import paramiko
          from wechat_airflow.clients.android_device import PinnedSHA256HostKeyPolicy
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          names=('ydmap_source_compare.py','ydmap_dsh_review.py','bawtt_live_query.py','dashah_server.py')
          sources={name:Path('scripts',name).read_text() for name in names}
          code='import contextlib,io,json,pathlib,tempfile,sys,runpy\nsources='+repr(sources)+'\n'
          code+="with tempfile.TemporaryDirectory(prefix='ydmap-readonly-inputs-') as directory:\n"
          code+="    for name,content in sources.items():\n        pathlib.Path(directory,name).write_text(content)\n"
          code+="    sys.path.insert(0,directory)\n    import ydmap_source_compare\n    buffer=io.StringIO()\n"
          code+="    with contextlib.redirect_stdout(buffer):\n        ydmap_source_compare.main()\n"
          code+="    report=json.loads(buffer.getvalue())\n    print(json.dumps(report,ensure_ascii=False),flush=True)\n"
          code+="    pathlib.Path(directory,'latest_observation.json').write_text(json.dumps(report,ensure_ascii=False))\n"
          code+="    runpy.run_path(str(pathlib.Path(directory,'ydmap_dsh_review.py')),run_name='__main__')\n"
          compile(code,'<native-data-and-static-review>','exec')
          outdir=Path(os.environ['RUNNER_TEMP'])/'ydmap-data-review'
          outdir.mkdir(exist_ok=True)
          client=paramiko.SSHClient()
          try:
              client.set_missing_host_key_policy(PinnedSHA256HostKeyPolicy(os.environ['PI_DEVICE_SSH_HOST_KEY_SHA256']))
              client.connect(os.environ['PI_DEVICE_SSH_HOST'],port=int(os.environ['PI_DEVICE_SSH_PORT']),username=os.environ['PI_DEVICE_SSH_USER'],password=os.environ['PI_DEVICE_SSH_PASSWORD'],timeout=12,auth_timeout=12,banner_timeout=12,allow_agent=False,look_for_keys=False)
              client.get_transport().set_keepalive(15)
              stdin,stdout,stderr=client.exec_command('timeout --kill-after=10s 380s python3 -u -',timeout=410)
              stdin.write(code)
              stdin.flush()
              stdin.channel.shutdown_write()
              reports=[]
              for name in ('observation.json','dsh-review.json'):
                  raw=stdout.readline(131073)
                  if len(raw)>131072 or not raw:
                      raise ValueError('missing_or_oversized_report')
                  report=json.loads(raw)
                  reports.append(report)
                  (outdir/name).write_text(json.dumps(report,ensure_ascii=False))
                  print(json.dumps(report,ensure_ascii=False,sort_keys=True),flush=True)
              status=stdout.channel.recv_exit_status()
              rendered=json.dumps({'reports':reports,'remoteExitCode':status,'productionReady':False},ensure_ascii=False,sort_keys=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('### Native DOM observations and DSH review; not release acceptance\n```json\n'+rendered+'\n```\n')
              if status or len(reports[0].get('sources',[]))!=3 or any(s.get('state')!='schedule_cells_observed_without_query_samples' for s in reports[0]['sources']) or reports[1].get('state')!='review_completed':
                  raise SystemExit(1)
          except SystemExit:
              raise
          except Exception as error:
              print(json.dumps({'state':'observation_or_review_incomplete','errorClass':type(error).__name__,'productionChanged':False}))
              raise SystemExit(1)
          finally:
              client.close()
          PY
      - name: Preserve bounded observation and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ydmap-data-review
          path: ${{ runner.temp }}/ydmap-data-review/
          retention-days: 1
          if-no-files-found: ignore
