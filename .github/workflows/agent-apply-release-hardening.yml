name: Apply release hardening patch

on:
  push:
    branches:
      - feat/web-more-menu-release-hardening
    paths:
      - scripts/_apply_release_hardening_patch.py
      - .github/workflows/agent-apply-release-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply repository patch
        run: python scripts/_apply_release_hardening_patch.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No patch changes were produced"
            exit 1
          fi
          git commit -m "feat: harden web navigation and release recovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
