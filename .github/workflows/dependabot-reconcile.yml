name: Dependabot Reconcile

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update and merge eligible patch updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            gh label create "$name" \
              --repo "$REPO" \
              --color "$color" \
              --description "$description" \
              --force >/dev/null
          }

          ensure_label "automerge:patch" "0e8a16" "Patch-only Dependabot update eligible for protected automatic merge"
          ensure_label "automerge:blocked" "b60205" "Automatic dependency processing is blocked"
          ensure_label "needs-manual-review" "d93f0b" "Dependency update requires manual compatibility review"

          declare -a pull_requests=()
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            mapfile -t pull_requests < <(
              jq -r '.workflow_run.pull_requests[]?.number' "$GITHUB_EVENT_PATH"
            )
          else
            mapfile -t pull_requests < <(
              gh api --method GET --paginate "search/issues" \
                -f q="repo:$REPO is:pr is:open label:\"automerge:patch\"" \
                -f per_page=100 \
                --jq '.items[].number'
            )
          fi

          if ((${#pull_requests[@]} == 0)); then
            echo "No eligible Dependabot pull requests were associated with this run."
            exit 0
          fi

          for number in "${pull_requests[@]}"; do
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              echo "Skipping invalid pull request number: $number"
              continue
            fi

            pr_json="$(gh api "repos/$REPO/pulls/$number")"

            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            author="$(jq -r '.user.login' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            body="$(jq -r '.body // ""' <<<"$pr_json")"
            has_eligible_label="$(
              jq -r '[.labels[].name] | index("automerge:patch") != null' <<<"$pr_json"
            )"

            if [[ "$state" != "open" ||
                  "$draft" != "false" ||
                  "$author" != "dependabot[bot]" ||
                  "$base_ref" != "main" ||
                  "$head_repo" != "$REPO" ||
                  "$has_eligible_label" != "true" ]]; then
              echo "Skipping #$number because its identity or state is not eligible."
              continue
            fi

            if [[ "$EVENT_NAME" == "workflow_run" &&
                  "$WORKFLOW_HEAD_SHA" != "$head_sha" ]]; then
              echo "Skipping #$number because CI completed for ${WORKFLOW_HEAD_SHA:-unknown}, not current head $head_sha."
              continue
            fi

            if [[ "$body" == *"Maintainer changes"* ]]; then
              gh issue edit "$number" \
                --repo "$REPO" \
                --remove-label "automerge:patch" >/dev/null 2>&1 || true
              gh issue edit "$number" \
                --repo "$REPO" \
                --add-label "needs-manual-review" >/dev/null
              echo "Skipping #$number because the branch contains maintainer changes."
              continue
            fi

            mapfile -t changed_files < <(
              gh api --paginate "repos/$REPO/pulls/$number/files?per_page=100" \
                --jq '.[].filename'
            )

            manifest_kind=""
            allowed_files=true
            has_primary_manifest=false
            for path in "${changed_files[@]}"; do
              case "$path" in
                pyproject.toml)
                  [[ -z "$manifest_kind" || "$manifest_kind" == "pip" ]] || allowed_files=false
                  manifest_kind="pip"
                  has_primary_manifest=true
                  ;;
                webapp/package.json)
                  [[ -z "$manifest_kind" || "$manifest_kind" == "npm" ]] || allowed_files=false
                  manifest_kind="npm"
                  has_primary_manifest=true
                  ;;
                webapp/package-lock.json)
                  [[ -z "$manifest_kind" || "$manifest_kind" == "npm" ]] || allowed_files=false
                  manifest_kind="npm"
                  ;;
                *)
                  allowed_files=false
                  ;;
              esac
            done

            if [[ "$allowed_files" != "true" ||
                  "$has_primary_manifest" != "true" ||
                  -z "$manifest_kind" ]]; then
              gh issue edit "$number" \
                --repo "$REPO" \
                --remove-label "automerge:patch" >/dev/null 2>&1 || true
              gh issue edit "$number" \
                --repo "$REPO" \
                --add-label "needs-manual-review" >/dev/null
              echo "Skipping #$number because its changed-file set is no longer eligible."
              continue
            fi

            safe_status="$(
              gh api "repos/$REPO/commits/$head_sha/status" \
                --jq '[.statuses[] | select(.context == "dependabot-safe-patch")][0].state // ""'
            )"
            if [[ "$safe_status" != "success" ]]; then
              echo "Skipping #$number because its current head has not passed patch classification."
              continue
            fi

            mergeable_state="unknown"
            for _ in 1 2 3; do
              pr_json="$(gh api "repos/$REPO/pulls/$number")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
              head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
              [[ "$mergeable_state" != "unknown" ]] && break
              sleep 2
            done

            if [[ "$EVENT_NAME" == "workflow_run" &&
                  "$WORKFLOW_HEAD_SHA" != "$head_sha" ]]; then
              echo "Skipping #$number because its head moved after the completed CI run."
              continue
            fi

            safe_status="$(
              gh api "repos/$REPO/commits/$head_sha/status" \
                --jq '[.statuses[] | select(.context == "dependabot-safe-patch")][0].state // ""'
            )"
            if [[ "$safe_status" != "success" ]]; then
              echo "Skipping #$number because its head changed after classification."
              continue
            fi

            case "$mergeable_state" in
              behind)
                if gh api --method PUT "repos/$REPO/pulls/$number/update-branch" \
                  -f expected_head_sha="$head_sha" >/dev/null; then
                  gh issue edit "$number" \
                    --repo "$REPO" \
                    --remove-label "automerge:blocked" >/dev/null 2>&1 || true
                  echo "Updated #$number to the latest main; fresh CI and classification will run."
                else
                  gh issue edit "$number" \
                    --repo "$REPO" \
                    --add-label "automerge:blocked" >/dev/null
                  echo "Could not update #$number to the latest main."
                fi
                continue
                ;;
              dirty)
                gh issue edit "$number" \
                  --repo "$REPO" \
                  --add-label "automerge:blocked" >/dev/null
                echo "Marked #$number blocked because it has merge conflicts."
                continue
                ;;
              clean)
                ;;
              *)
                if [[ "$EVENT_NAME" == "workflow_run" &&
                      "$WORKFLOW_CONCLUSION" != "success" ]]; then
                  gh issue edit "$number" \
                    --repo "$REPO" \
                    --add-label "automerge:blocked" >/dev/null
                fi
                echo "Leaving #$number open; mergeable state is $mergeable_state."
                continue
                ;;
            esac

            if [[ "$EVENT_NAME" == "workflow_run" &&
                  "$WORKFLOW_CONCLUSION" != "success" ]]; then
              gh issue edit "$number" \
                --repo "$REPO" \
                --add-label "automerge:blocked" >/dev/null
              echo "Leaving #$number open because CI concluded $WORKFLOW_CONCLUSION."
              continue
            fi

            merge_response="$(
              gh api --method PUT "repos/$REPO/pulls/$number/merge" \
                -f sha="$head_sha" \
                -f merge_method="squash" 2>/dev/null || true
            )"
            if [[ -z "$merge_response" ]]; then
              merge_response='{}'
            fi
            merged="$(jq -r '.merged // false' <<<"$merge_response")"

            if [[ "$merged" == "true" ]]; then
              gh issue edit "$number" \
                --repo "$REPO" \
                --remove-label "automerge:blocked" >/dev/null 2>&1 || true
              echo "Merged #$number after protected branch checks passed."
            else
              gh issue edit "$number" \
                --repo "$REPO" \
                --add-label "automerge:blocked" >/dev/null
              message="$(jq -r '.message // "GitHub rejected the merge"' <<<"$merge_response")"
              echo "Left #$number open: $message"
            fi
          done
