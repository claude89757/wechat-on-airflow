name: Apply Webapp Weekday UX Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-webapp-weekday-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.head_ref == 'feat/webapp-weekday-ux-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verified product patch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/ux-patch/part-*)
          if (( ${#parts[@]} == 0 )); then
            echo 'Patch has already been applied.'
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/webapp-weekday-ux.patch
          echo 'fd6c49bf26887b536c93a5f6a201d401cd8f05d7bc24441b9f1192b4db5a7310  /tmp/webapp-weekday-ux.patch' | sha256sum --check -
          git apply --index --3way /tmp/webapp-weekday-ux.patch
          rm -rf .github/ux-patch
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(web): add weekday subscriptions and polish UX'
          git push origin "HEAD:${HEAD_BRANCH}"
