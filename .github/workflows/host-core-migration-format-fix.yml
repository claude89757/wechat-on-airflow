name: One-time host-core migration format fix

on:
  push:
    branches:
      - feat/airflow-host-core-v0.7.0-final3

permissions:
  contents: write

concurrency:
  group: one-time-host-core-migration-format-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - name: Restore module-level function spacing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wechat_airflow/host_core/migration.py")
          source = path.read_text(encoding="utf-8")
          old = '    return str(value or "").strip().lower() in {"1", "true", "yes", "on"}\n\ndef _integer'
          new = '    return str(value or "").strip().lower() in {"1", "true", "yes", "on"}\n\n\ndef _integer'
          if old not in source:
              raise SystemExit("expected helper spacing was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/host-core-migration-format-fix.yml
      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wechat_airflow/host_core/migration.py
          git commit -m "style(host-core): format migration helpers"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3
