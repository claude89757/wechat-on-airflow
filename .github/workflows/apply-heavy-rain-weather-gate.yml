name: Apply Heavy-Rain Weather Gate
run-name: apply-heavy-rain-weather-gate/${{ github.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-heavy-rain-weather-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Apply the focused threshold and Web notice changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one occurrence, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text and text.count(new) >= expected:
                  return
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrences, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new))

          replace_once(
              "webapp/cloudflare/weather-email-gate.ts",
              "const DEFAULT_PRECIPITATION_THRESHOLD_MM = 2.5;",
              "const DEFAULT_PRECIPITATION_THRESHOLD_MM = 25;",
          )
          replace_once(
              "webapp/wrangler.jsonc",
              '"WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM": "2.5",',
              '"WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM": "25",',
          )

          replace_once(
              "webapp/cloudflare/weather-email-gate.test.ts",
              'WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM: "2.5",',
              'WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM: "25",',
          )
          replace_once(
              "webapp/cloudflare/weather-email-gate.test.ts",
              "mockResolvedValue(weatherResponse(1.2))",
              "mockResolvedValue(weatherResponse(13.3))",
          )
          replace_once(
              "webapp/cloudflare/weather-email-gate.test.ts",
              "precipitationMm: 1.2,",
              "precipitationMm: 13.3,",
          )
          replace_once(
              "webapp/cloudflare/weather-email-gate.test.ts",
              "mockResolvedValue(weatherResponse(2.5))",
              "mockResolvedValue(weatherResponse(25))",
          )
          replace_once(
              "webapp/cloudflare/weather-email-gate.test.ts",
              "precipitationMm: 2.5,",
              "precipitationMm: 25,",
          )
          replace_all(
              "webapp/cloudflare/weather-email-gate.test.ts",
              "thresholdMm: 2.5,",
              "thresholdMm: 25,",
              3,
          )

          replace_once(
              "docs/adr/0009-weather-gated-subscriber-email.md",
              """- The Cloudflare Worker evaluates Shenzhen's current-day forecast
            `precipitation_sum` only when eligible subscriber outbox rows exist.
          """,
              """- The Cloudflare Worker evaluates Shenzhen's current-day forecast
            `precipitation_sum` for eligible subscriber outbox rows and for the Web
            status indicator.
          """,
          )
          replace_once(
              "docs/adr/0009-weather-gated-subscriber-email.md",
              """- The default suppression threshold is `2.5 mm/day`. This is a configurable
            product heuristic, not an official court-playability standard. It avoids
            treating trace drizzle as a shutdown while remaining within the national
            24-hour light-rain band defined by GB/T 28592-2012.
          """,
              """- The default suppression threshold is `25 mm/day`, the lower bound of the
            national 24-hour heavy-rain band in GB/T 28592-2012. Light and moderate
            rain continue to send email; only a heavy-rain forecast pauses subscriber
            email.
          """,
          )

          replace_once(
              "webapp/cloudflare/index.ts",
              """  const dayStart = shanghaiDayStart(now);

            const globalResults = await env.DB.batch([
          """,
              """  const dayStart = shanghaiDayStart(now);
            const weatherEmailGate = await evaluateWeatherEmailGate(env);

            const globalResults = await env.DB.batch([
          """,
          )
          replace_once(
              "webapp/cloudflare/index.ts",
              """  return json({
              generatedAt: nowIso,
              metrics: {
          """,
              """  return json({
              generatedAt: nowIso,
              weatherEmailGate: {
                suppressed:
                  !weatherEmailGate.sendEmail
                  && weatherEmailGate.reason === "precipitation_threshold_met",
                precipitationMm: weatherEmailGate.precipitationMm,
                thresholdMm: weatherEmailGate.thresholdMm,
              },
              metrics: {
          """,
          )

          replace_once(
              "webapp/src/api.ts",
              """export type Dashboard = {
              generatedAt: string;
              metrics: {
          """,
              """export type Dashboard = {
              generatedAt: string;
              weatherEmailGate?: {
                suppressed: boolean;
                precipitationMm: number | null;
                thresholdMm: number;
              };
              metrics: {
          """,
          )
          replace_once(
              "webapp/src/api.ts",
              """export const FALLBACK_DASHBOARD: Dashboard = {
              generatedAt: "2026-07-29T10:42:00+08:00",
              metrics: { activeSubscriptions: 128, remindersToday: 6, healthyVenues: 8, totalVenues: 8 },
          """,
              """export const FALLBACK_DASHBOARD: Dashboard = {
              generatedAt: "2026-07-29T10:42:00+08:00",
              weatherEmailGate: { suppressed: false, precipitationMm: null, thresholdMm: 25 },
              metrics: { activeSubscriptions: 128, remindersToday: 6, healthyVenues: 8, totalVenues: 8 },
          """,
          )

          replace_once(
              "webapp/src/Prototype.tsx",
              """          </div>

                    <section className="metric-band" aria-label="运行概况">
          """,
              """          </div>

                    {dashboard.weatherEmailGate?.suppressed ? (
                      <div className="weather-notice" role="status">
                        <span aria-hidden="true">🌧️</span>
                        <div>
                          <strong>深圳今日预计大雨，邮件推送已暂停</strong>
                          <p>
                            预计降水 {dashboard.weatherEmailGate.precipitationMm ?? "—"} mm，
                            达到 {dashboard.weatherEmailGate.thresholdMm} mm 阈值；微信通知不受影响。
                          </p>
                        </div>
                      </div>
                    ) : null}

                    <section className="metric-band" aria-label="运行概况">
          """,
          )
          replace_once(
              "webapp/src/Prototype.tsx",
              """                        <span>{venueState === "unknown" ? "状态未知"
                                      : venue.lastNotificationAt ? "确认送达" : "今日未确认送达"}</span>
          """,
              """                        <span>{venueState === "unknown" ? "状态未知"
                                      : venue.lastNotificationAt ? "确认送达"
                                        : dashboard.weatherEmailGate?.suppressed ? "因大雨暂停邮件"
                                          : "今日未确认送达"}</span>
          """,
          )

          replace_once(
              "webapp/src/prototype.css",
              ".metric-band {\n",
              """.weather-notice {
              display: flex;
              align-items: flex-start;
              gap: 10px;
              margin: 0 0 12px;
              padding: 10px 12px;
              border: 1px solid #efd79f;
              border-radius: 8px;
              background: #fff8e8;
              color: #5f4614;
              font-size: 12px;
              line-height: 1.45;
            }

            .weather-notice > span {
              flex: 0 0 auto;
              font-size: 20px;
              line-height: 1;
            }

            .weather-notice strong {
              display: block;
              color: #50390d;
              font-size: 13px;
            }

            .weather-notice p {
              margin: 3px 0 0;
              color: #806326;
            }

            .metric-band {
            """,
          )

          print("Focused heavy-rain weather gate patch is present")
          PY
      - name: Install Web dependencies
        working-directory: webapp
        run: npm ci
      - name: Run Web unit tests
        working-directory: webapp
        run: npm test
      - name: Check Worker types
        working-directory: webapp
        run: npm run check:worker
      - name: Build production Web application
        working-directory: webapp
        run: npm run build
      - name: Commit verified changes to the pull-request branch
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "The focused weather patch is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/cloudflare/weather-email-gate.ts \
                  webapp/cloudflare/weather-email-gate.test.ts \
                  webapp/cloudflare/index.ts \
                  webapp/wrangler.jsonc \
                  webapp/worker-configuration.d.ts \
                  webapp/src/api.ts \
                  webapp/src/Prototype.tsx \
                  webapp/src/prototype.css \
                  docs/adr/0009-weather-gated-subscriber-email.md
          git commit -m "fix(webapp): pause email only for heavy rain [weather-threshold-applied]"
          git push origin "HEAD:${HEAD_BRANCH}"
