name: Apply Heavy-Rain Weather Gate
run-name: apply-heavy-rain-weather-gate/${{ github.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-heavy-rain-weather-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Apply the focused threshold and Web notice changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one occurrence, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text and text.count(new) >= expected:
                  return
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrences, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new))

          replace_once(
              "webapp/cloudflare/weather-email-gate.ts",
              "const DEFAULT_PRECIPITATION_THRESHOLD_MM = 2.5;",
              "const DEFAULT_PRECIPITATION_THRESHOLD_MM = 25;",
          )
          replace_once(
              "webapp/wrangler.jsonc",
              '"WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM": "2.5",',
              '"WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM": "25",',
          )

          test_path = "webapp/cloudflare/weather-email-gate.test.ts"
          replace_once(
              test_path,
              'WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM: "2.5",',
              'WEATHER_EMAIL_PRECIPITATION_THRESHOLD_MM: "25",',
          )
          replace_once(
              test_path,
              "mockResolvedValue(weatherResponse(1.2))",
              "mockResolvedValue(weatherResponse(13.3))",
          )
          replace_once(test_path, "precipitationMm: 1.2,", "precipitationMm: 13.3,")
          replace_once(
              test_path,
              "mockResolvedValue(weatherResponse(2.5))",
              "mockResolvedValue(weatherResponse(25))",
          )
          replace_once(test_path, "precipitationMm: 2.5,", "precipitationMm: 25,")
          replace_all(test_path, "thresholdMm: 2.5,", "thresholdMm: 25,", 3)

          replace_once(
              "docs/adr/0009-weather-gated-subscriber-email.md",
              (
                  "- The Cloudflare Worker evaluates Shenzhen's current-day forecast\n"
                  "  `precipitation_sum` only when eligible subscriber outbox rows exist.\n"
              ),
              (
                  "- The Cloudflare Worker evaluates Shenzhen's current-day forecast\n"
                  "  `precipitation_sum` for eligible subscriber outbox rows and for the Web\n"
                  "  status indicator.\n"
              ),
          )
          replace_once(
              "docs/adr/0009-weather-gated-subscriber-email.md",
              (
                  "- The default suppression threshold is `2.5 mm/day`. This is a configurable\n"
                  "  product heuristic, not an official court-playability standard. It avoids\n"
                  "  treating trace drizzle as a shutdown while remaining within the national\n"
                  "  24-hour light-rain band defined by GB/T 28592-2012.\n"
              ),
              (
                  "- The default suppression threshold is `25 mm/day`, the lower bound of the\n"
                  "  national 24-hour heavy-rain band in GB/T 28592-2012. Light and moderate\n"
                  "  rain continue to send email; only a heavy-rain forecast pauses subscriber\n"
                  "  email.\n"
              ),
          )

          replace_once(
              "webapp/cloudflare/index.ts",
              (
                  "  const dayStart = shanghaiDayStart(now);\n"
                  "\n"
                  "  const globalResults = await env.DB.batch([\n"
              ),
              (
                  "  const dayStart = shanghaiDayStart(now);\n"
                  "  const weatherEmailGate = await evaluateWeatherEmailGate(env);\n"
                  "\n"
                  "  const globalResults = await env.DB.batch([\n"
              ),
          )
          replace_once(
              "webapp/cloudflare/index.ts",
              "  return json({\n    generatedAt: nowIso,\n    metrics: {\n",
              (
                  "  return json({\n"
                  "    generatedAt: nowIso,\n"
                  "    weatherEmailGate: {\n"
                  "      suppressed:\n"
                  "        !weatherEmailGate.sendEmail\n"
                  "        && weatherEmailGate.reason === \"precipitation_threshold_met\",\n"
                  "      precipitationMm: weatherEmailGate.precipitationMm,\n"
                  "      thresholdMm: weatherEmailGate.thresholdMm,\n"
                  "    },\n"
                  "    metrics: {\n"
              ),
          )

          replace_once(
              "webapp/src/api.ts",
              "export type Dashboard = {\n  generatedAt: string;\n  metrics: {\n",
              (
                  "export type Dashboard = {\n"
                  "  generatedAt: string;\n"
                  "  weatherEmailGate?: {\n"
                  "    suppressed: boolean;\n"
                  "    precipitationMm: number | null;\n"
                  "    thresholdMm: number;\n"
                  "  };\n"
                  "  metrics: {\n"
              ),
          )
          replace_once(
              "webapp/src/api.ts",
              (
                  "export const FALLBACK_DASHBOARD: Dashboard = {\n"
                  "  generatedAt: \"2026-07-29T10:42:00+08:00\",\n"
                  "  metrics: { activeSubscriptions: 128, remindersToday: 6, healthyVenues: 8, totalVenues: 8 },\n"
              ),
              (
                  "export const FALLBACK_DASHBOARD: Dashboard = {\n"
                  "  generatedAt: \"2026-07-29T10:42:00+08:00\",\n"
                  "  weatherEmailGate: { suppressed: false, precipitationMm: null, thresholdMm: 25 },\n"
                  "  metrics: { activeSubscriptions: 128, remindersToday: 6, healthyVenues: 8, totalVenues: 8 },\n"
              ),
          )

          replace_once(
              "webapp/src/Prototype.tsx",
              "\n          <section className=\"metric-band\" aria-label=\"运行概况\">\n",
              (
                  "\n"
                  "          {dashboard.weatherEmailGate?.suppressed ? (\n"
                  "            <div className=\"weather-notice\" role=\"status\">\n"
                  "              <span aria-hidden=\"true\">🌧️</span>\n"
                  "              <div>\n"
                  "                <strong>深圳今日预计大雨，邮件推送已暂停</strong>\n"
                  "                <p>\n"
                  "                  预计降水 {dashboard.weatherEmailGate.precipitationMm ?? \"—\"} mm，\n"
                  "                  达到 {dashboard.weatherEmailGate.thresholdMm} mm 阈值；微信通知不受影响。\n"
                  "                </p>\n"
                  "              </div>\n"
                  "            </div>\n"
                  "          ) : null}\n"
                  "\n"
                  "          <section className=\"metric-band\" aria-label=\"运行概况\">\n"
              ),
          )
          replace_once(
              "webapp/src/Prototype.tsx",
              (
                  "                        <span>{venueState === \"unknown\" ? \"状态未知\"\n"
                  "                          : venue.lastNotificationAt ? \"确认送达\" : \"今日未确认送达\"}</span>\n"
              ),
              (
                  "                        <span>{venueState === \"unknown\" ? \"状态未知\"\n"
                  "                          : venue.lastNotificationAt ? \"确认送达\"\n"
                  "                            : dashboard.weatherEmailGate?.suppressed ? \"因大雨暂停邮件\"\n"
                  "                              : \"今日未确认送达\"}</span>\n"
              ),
          )

          replace_once(
              "webapp/src/prototype.css",
              ".metric-band {\n",
              (
                  ".weather-notice {\n"
                  "  display: flex;\n"
                  "  align-items: flex-start;\n"
                  "  gap: 10px;\n"
                  "  margin: 0 0 12px;\n"
                  "  padding: 10px 12px;\n"
                  "  border: 1px solid #efd79f;\n"
                  "  border-radius: 8px;\n"
                  "  background: #fff8e8;\n"
                  "  color: #5f4614;\n"
                  "  font-size: 12px;\n"
                  "  line-height: 1.45;\n"
                  "}\n"
                  "\n"
                  ".weather-notice > span {\n"
                  "  flex: 0 0 auto;\n"
                  "  font-size: 20px;\n"
                  "  line-height: 1;\n"
                  "}\n"
                  "\n"
                  ".weather-notice strong {\n"
                  "  display: block;\n"
                  "  color: #50390d;\n"
                  "  font-size: 13px;\n"
                  "}\n"
                  "\n"
                  ".weather-notice p {\n"
                  "  margin: 3px 0 0;\n"
                  "  color: #806326;\n"
                  "}\n"
                  "\n"
                  ".metric-band {\n"
              ),
          )

          print("Focused heavy-rain weather gate patch is present")
          PY
      - name: Install Web dependencies
        working-directory: webapp
        run: npm ci
      - name: Run Web unit tests
        working-directory: webapp
        run: npm test
      - name: Check Worker types
        working-directory: webapp
        run: npm run check:worker
      - name: Build production Web application
        working-directory: webapp
        run: npm run build
      - name: Commit verified changes to the pull-request branch
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "The focused weather patch is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/cloudflare/weather-email-gate.ts \
                  webapp/cloudflare/weather-email-gate.test.ts \
                  webapp/cloudflare/index.ts \
                  webapp/wrangler.jsonc \
                  webapp/worker-configuration.d.ts \
                  webapp/src/api.ts \
                  webapp/src/Prototype.tsx \
                  webapp/src/prototype.css \
                  docs/adr/0009-weather-gated-subscriber-email.md
          git commit -m "fix(webapp): pause email only for heavy rain [weather-threshold-applied]"
          git push origin "HEAD:${HEAD_BRANCH}"
