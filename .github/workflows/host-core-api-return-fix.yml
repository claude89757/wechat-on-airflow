name: One-time host-core API return fix

on:
  push:
    branches:
      - feat/airflow-host-core-v0.7.0-final3

permissions:
  contents: write

concurrency:
  group: one-time-host-core-api-return-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - name: Apply deterministic import-time fix and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/wechat_airflow/host_core/api.py')
          source = path.read_text(encoding='utf-8')
          old = '''@app.api_route(f"{API_PREFIX}/admin/invites", methods=["GET", "POST"])
def admin_invites(
    request: Request, payload: dict[str, Any] | None = Body(default=None)
) -> JSONResponse | dict[str, Any]:'''
          new = '''@app.api_route(
    f"{API_PREFIX}/admin/invites",
    methods=["GET", "POST"],
    response_model=None,
)
def admin_invites(
    request: Request, payload: dict[str, Any] | None = Body(default=None)
) -> JSONResponse | dict[str, Any]:'''
          if old not in source:
              raise SystemExit('expected FastAPI admin_invites declaration was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/host-core-api-return-fix.yml
      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wechat_airflow/host_core/api.py
          git commit -m "fix(host-core): disable inferred response model for mixed admin response"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3
