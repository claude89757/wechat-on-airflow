name: Production WeChat Sender
run-name: production/sender/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation
        required: true
        type: choice
        options:
          - health
          - device_diagnose
          - ui_screenshot
          - device_recover
          - dry_run
          - apply
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      request_id:
        description: Unique request correlation ID
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-wechat-sender-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WECHAT_SENDER_SSH_HOST: ${{ secrets.WECHAT_SENDER_SSH_HOST }}
      WECHAT_SENDER_SSH_PORT: ${{ secrets.WECHAT_SENDER_SSH_PORT }}
      WECHAT_SENDER_SSH_USER: ${{ secrets.WECHAT_SENDER_SSH_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - name: Validate exact target
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install operations dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WECHAT_SENDER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WECHAT_SENDER_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Execute protected operation
        if: inputs.operation != 'ui_screenshot'
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          case "$OPERATION" in
            health)
              MODE=health
              ;;
            device_diagnose)
              MODE=device-diagnose
              ;;
            device_recover)
              MODE=device-recover
              ;;
            dry_run)
              MODE=dry-run
              ;;
            apply)
              MODE=apply
              ;;
            *)
              exit 2
              ;;
          esac
          PYTHONPATH=src python scripts/deploy_wechat_sender.py \
            --operation "$MODE" --target-commit "$TARGET_COMMIT" --format json
      - name: Capture protected UI evidence
        if: inputs.operation == 'ui_screenshot'
        run: |
          python scripts/capture_wechat_sender_ui.py \
            --output .local/diagnostics/wechat-ui.png
      - name: Upload protected UI evidence
        if: inputs.operation == 'ui_screenshot'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-sender-ui-${{ inputs.request_id }}
          path: .local/diagnostics/wechat-ui.png
          if-no-files-found: error
          retention-days: 1
