name: Apply FFT integration payload

on:
  push:
    branches:
      - feat/fft-qianhai-release-20260830
    paths:
      - .github/workflows/fft-apply-integration.yml
      - .tmp/fft-integration.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply integration patch and remove workbench files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .tmp/fft-integration.patch.gz.b64 | gunzip > /tmp/fft-integration.patch
          git apply --check /tmp/fft-integration.patch
          git apply --whitespace=error-all /tmp/fft-integration.patch
          rm -f .tmp/fft-integration.patch.gz.b64
          rm -f .github/workflows/fft-apply-integration.yml
          rmdir .tmp 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate FFTENNIS Qianhai venue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
