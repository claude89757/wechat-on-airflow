name: Apply FFT integration payload

on:
  push:
    branches:
      - feat/fft-qianhai-release-20260830
    paths:
      - .github/workflows/fft-apply-integration.yml
      - .tmp/fft-integration.patch.gz.b64.part*

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Assemble, verify, and apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/fft-integration.patch.gz.b64.part* > /tmp/fft-integration.patch.gz.b64
          echo "d8a68b387ba14586725c07c1a0625fcef5c56570ff11bb4b4fff4cb9a8111b07  /tmp/fft-integration.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/fft-integration.patch.gz.b64 | gunzip > /tmp/fft-integration.patch
          echo "2bedf2c32c03512d56f2eea5e18627f06e45792ab7914b9a70f4e561c8e562e3  /tmp/fft-integration.patch" | sha256sum --check
          git apply --check /tmp/fft-integration.patch
          git apply --whitespace=error-all /tmp/fft-integration.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate FFTENNIS Qianhai venue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
