name: One-time host-core bootstrap repair finalize

on:
  push:
    branches:
      - fix/host-core-edge-token-bootstrap-20260904

permissions:
  actions: write
  contents: write

concurrency:
  group: one-time-host-core-bootstrap-repair-finalize
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-edge-token-bootstrap-20260904
          fetch-depth: 0

      - name: Cancel obsolete repair attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=fix%2Fhost-core-edge-token-bootstrap-20260904&status=in_progress&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" \
            | while read -r run_id; do
                test -n "$run_id" || continue
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=fix%2Fhost-core-edge-token-bootstrap-20260904&status=queued&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" \
            | while read -r run_id; do
                test -n "$run_id" || continue
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done

      - name: Reuse the reviewed deterministic patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/host-core-edge-token-bootstrap-fix-retry.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit("reviewed patch start marker is not unique")
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ]
          Path("/tmp/apply_host_core_bootstrap_repair.py").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          python /tmp/apply_host_core_bootstrap_repair.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Run focused and repository validation
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check --fix scripts/host_core_production.py src/wechat_airflow/host_core/secret_sync.py tests/host_core_secret_sync_test.py tests/host_core_bootstrap_contract_test.py
          ruff format scripts/host_core_production.py src/wechat_airflow/host_core/secret_sync.py tests/host_core_secret_sync_test.py tests/host_core_bootstrap_contract_test.py
          PYTHONPATH=src pytest -q tests/host_core_secret_sync_test.py tests/host_core_bootstrap_contract_test.py
          python -m py_compile scripts/host_core_production.py src/wechat_airflow/host_core/secret_sync.py
          git diff --check

      - name: Remove one-time workflows and commit repair
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/host-core-edge-token-bootstrap-fix-once.yml \
            .github/workflows/host-core-edge-token-bootstrap-fix-retry.yml \
            .github/workflows/host-core-edge-token-bootstrap-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix(host-core): bootstrap runtime secrets before startup"
          git push origin HEAD:fix/host-core-edge-token-bootstrap-20260904
