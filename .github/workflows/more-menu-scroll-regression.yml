name: More Menu Scroll Regression

on:
  push:
    branches: [fix/more-menu-drag-scroll]

permissions:
  contents: read
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install Web and browser dependencies
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify More menu pointer transfer
        working-directory: webapp
        run: npx playwright test tests/more-menu-scroll.spec.ts
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 73 --repo "$GITHUB_REPOSITORY" --body \
            "✅ Chromium regression passed for \`${GITHUB_SHA}\`: moving from the More trigger into the opened menu leaves MobileScroll at zero drag, zero rubber-band overscroll, and unchanged scroll position."
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 73 --repo "$GITHUB_REPOSITORY" --body \
            "❌ Chromium regression failed for \`${GITHUB_SHA}\`. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
