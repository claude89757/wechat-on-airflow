name: Implement Mobile Venue Card Quick Create

on:
  push:
    branches:
      - feat/mobile-venue-card-quick-create-20260830

permissions:
  contents: write

concurrency:
  group: implement-mobile-venue-card-quick-create
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[venue-card-ux-prepared]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-venue-card-quick-create-20260830
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Apply audited mobile venue-card patches
        run: |
          set -euo pipefail
          for patch in scripts/venue-card-patches/*.patch; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Validate source changes
        run: |
          git diff --check
          grep -q 'data-testid={`venue-card-${venue.id}`}' webapp/src/Prototype.tsx
          grep -q 'grid-template-columns: repeat(3' webapp/public/mobile-v2.css
          grep -q 'grid-template-columns: repeat(2' webapp/public/mobile-v2.css

      - name: Install Web dependencies
        working-directory: webapp
        run: npm ci

      - name: Build Web application
        working-directory: webapp
        run: npm run build

      - name: Install Chromium
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Run venue-card interaction tests
        working-directory: webapp
        run: npx playwright test tests/subscription-ux.spec.ts tests/mobile-v2.spec.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/src/Prototype.tsx webapp/src/prototype.css webapp/public/mobile-v2.css \
            webapp/tests/subscription-ux.spec.ts webapp/tests/mobile-v2.spec.ts
          git commit -m "feat(web): add compact venue cards and quick subscriptions [venue-card-ux-prepared]"
          git push origin HEAD:feat/mobile-venue-card-quick-create-20260830
