name: Prepare Release 0.6.5

on:
  push:
    branches:
      - "release/0.6.5"

permissions:
  contents: write

concurrency:
  group: prepare-release-0.6.5
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: "release/0.6.5"
          fetch-depth: 0

      - name: Update and validate release contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('version = "0.6.4"', 'version = "0.6.5"', 1)
          pyproject.write_text(text, encoding="utf-8")

          package = Path("src/wechat_airflow/__init__.py")
          text = package.read_text(encoding="utf-8")
          text = text.replace('__version__ = "0.6.4"', '__version__ = "0.6.5"', 1)
          package.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          section = (
              "## [0.6.5] - 2026-08-30\n\n"
              "### Added\n\n"
              "- Replace the mobile venue status rows with compact, touch-friendly cards that\n"
              "  retain inspection health, configured cadence, status-sync age, follower count,\n"
              "  and the latest confirmed reminder delivery.\n"
              "- Open a venue-prefilled quick subscription flow directly from each card while\n"
              "  preserving email verification, weekday, time-window, and term controls.\n\n"
              "### Changed\n\n"
              "- Use three venue-card columns on typical phones and two below 360px, with\n"
              "  keyboard activation, visible focus, subscription-count and limit states, and\n"
              "  post-creation card highlighting.\n"
              "- Keep the existing full multi-venue creation flow available through “添加其他场地”.\n\n"
          )
          marker = "## Unreleased\n\n"
          if "## [0.6.5] - " not in text:
              if marker not in text:
                  raise SystemExit("Unreleased changelog marker missing")
              text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

          python scripts/release_contract.py --version 0.6.5
          git diff --check

      - name: Commit release metadata when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml src/wechat_airflow/__init__.py CHANGELOG.md; then
            echo "Release metadata already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/wechat_airflow/__init__.py CHANGELOG.md
          git commit -m "chore(release): prepare 0.6.5 [release-0.6.5-prepared]"
          git push origin HEAD:release/0.6.5
