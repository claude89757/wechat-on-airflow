name: FFT integration workbench

on:
  push:
    branches:
      - feat/fft-qianhai-integration-20260830
    paths:
      - .github/workflows/fft-integration-workbench.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: feat/fft-qianhai-integration-20260830

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/fft-patch-00.b64 \
              .tmp/fft-patch-01.b64 \
              .tmp/fft-patch-02.b64 \
              .tmp/fft-patch-03.b64 \
              .tmp/fft-patch-04.b64 > /tmp/fft.patch.gz.b64
          echo "f90e56dbe0cecc597993b28a0228207bc0e0dba1a6feddaa7b172aa8257c8b42  /tmp/fft.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/fft.patch.gz.b64 | gzip --decompress > /tmp/fft.patch
          echo "e0a59c5db2565e331b23bd0915ee8e36307189a5b1b502c6271ac9bf71fb5586  /tmp/fft.patch" | sha256sum --check --strict
          git apply --index /tmp/fft.patch
          git rm -f .tmp/fft-patch-00.b64 \
                    .tmp/fft-patch-01.b64 \
                    .tmp/fft-patch-02.b64 \
                    .tmp/fft-patch-03.b64 \
                    .tmp/fft-patch-04.b64
          git diff --cached --check
          git status --short

      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install Web application dependencies
        working-directory: webapp
        run: npm ci

      - name: Verify Python and repository contracts
        run: |
          python -m ruff check .
          python -m ruff format --check --diff .
          python -m mypy
          PYTHONPATH=src python -m pytest -m 'not airflow'
          PYTHONPATH=src python scripts/check_active_components.py

      - name: Verify Web application
        run: make webapp-check

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add FFTENNIS Qianhai venue monitoring"
          git push origin HEAD:feat/fft-qianhai-integration-20260830
