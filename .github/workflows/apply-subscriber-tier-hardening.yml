name: Apply subscriber tier hardening

on:
  push:
    branches:
      - feat/subscriber-email-tiers
    paths:
      - scripts/apply_subscriber_tier_hardening.py
      - .github/workflows/apply-subscriber-tier-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscriber-email-tiers
          fetch-depth: 0
      - name: Apply hardening patch
        run: python scripts/apply_subscriber_tier_hardening.py
      - name: Remove one-time patch files
        run: rm scripts/apply_subscriber_tier_hardening.py .github/workflows/apply-subscriber-tier-hardening.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(webapp): harden priority invite redemption"
          git push origin HEAD:feat/subscriber-email-tiers
