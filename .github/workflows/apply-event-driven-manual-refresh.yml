name: Apply event-driven manual-refresh patch

on:
  push:
    branches:
      - fix/event-driven-manual-refresh-2026-09-03
    paths:
      - .github/event-driven-manual-refresh.trigger

permissions:
  contents: write

concurrency:
  group: apply-event-driven-manual-refresh
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/event-driven-manual-refresh-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Apply bounded patches
        run: python scripts/apply_event_driven_manual_refresh.py
      - name: Install verification dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e '.[dev]'
          cd webapp && npm ci
      - name: Format and verify changed behavior
        run: |
          .venv/bin/ruff format src/wechat_airflow/notifications/observation_cache.py tests/webapp_observation_cache_test.py tests/webapp_current_observation_migration_test.py tests/event_driven_manual_refresh_contract_test.py
          .venv/bin/ruff check --fix src/wechat_airflow/notifications/observation_cache.py tests/webapp_observation_cache_test.py tests/webapp_current_observation_migration_test.py tests/event_driven_manual_refresh_contract_test.py
          PYTHONPATH=src .venv/bin/pytest -q tests/webapp_observation_cache_test.py tests/webapp_current_observation_migration_test.py tests/event_driven_manual_refresh_contract_test.py tests/webapp_notification_free_tier_test.py tests/webapp_subscription_weekdays_wiring_test.py
          cd webapp
          npm test
          npm run check:worker
          npm run build
      - name: Commit verified source and remove one-shot runner
        run: |
          rm -f scripts/apply_event_driven_manual_refresh.py
          rm -f .github/event-driven-manual-refresh.trigger
          rm -f .github/workflows/apply-event-driven-manual-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(free-tier): remove heartbeats and use manual refresh"
          git push origin HEAD:fix/event-driven-manual-refresh-2026-09-03
