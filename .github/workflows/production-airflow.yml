name: Production Airflow
run-name: production/airflow/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
      confirm_real_send:
        required: false
        default: false
        type: boolean
      probe_target_membership:
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation
        required: true
        type: choice
        options:
          - health
          - deploy_preflight
          - deploy_apply
          - deploy_recovery
          - db_cleanup_check
          - phone_diagnose
          - wechat_delivery_diagnose
          - wechat_delivery_probe
          - wechat_quiesce
          - airflow_resume
          - nswtt_config_sync
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      request_id:
        description: Unique request correlation ID
        required: false
        default: manual
        type: string
      confirm_real_send:
        description: Explicit approval for a real WeChat acceptance message
        required: true
        default: false
        type: boolean
      probe_target_membership:
        description: Optional redacted target selector such as tyzx:1 or dsh_free:1
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: production-airflow
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - name: Validate exact target
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install operations dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Execute protected operation
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          CONFIRM_REAL_SEND: ${{ inputs.confirm_real_send }}
          PROBE_TARGET_MEMBERSHIP: ${{ inputs.probe_target_membership }}
          NSWTT_API_CONFIG: ${{ secrets.NSWTT_API_CONFIG }}
        run: |
          case "$OPERATION" in
            health)
              PYTHONPATH=src python scripts/production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_preflight)
              PYTHONPATH=src python scripts/deploy_airflow.py --target-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_apply)
              PYTHONPATH=src python scripts/deploy_airflow.py --apply --target-commit "$TARGET_COMMIT" --format json
              PYTHONPATH=src python scripts/production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_recovery)
              PYTHONPATH=src python scripts/deploy_airflow.py --apply --recover-active-tasks \
                --target-commit "$TARGET_COMMIT" --format json
              PYTHONPATH=src python scripts/production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            db_cleanup_check)
              PYTHONPATH=src python scripts/airflow_db_cleanup.py --format json
              ;;
            phone_diagnose)
              PYTHONPATH=src python scripts/diagnose_zacks_phone.py --format json
              ;;
            wechat_delivery_diagnose)
              PYTHONPATH=scripts python scripts/diagnose_wechat_delivery.py --format json
              ;;
            wechat_delivery_probe)
              test "$CONFIRM_REAL_SEND" = "true"
              PYTHONPATH=scripts python scripts/probe_wechat_delivery.py \
                --confirm-real-send --target-membership "$PROBE_TARGET_MEMBERSHIP" \
                --format json
              ;;
            wechat_quiesce)
              PYTHONPATH=scripts python scripts/quiesce_wechat_delivery.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            airflow_resume)
              PYTHONPATH=scripts python scripts/resume_airflow_scheduling.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            nswtt_config_sync)
              PYTHONPATH=scripts python scripts/sync_nswtt_config.py
              ;;
            *)
              exit 2
              ;;
          esac
