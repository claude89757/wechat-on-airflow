name: Production Airflow
run-name: production/airflow/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
      confirm_real_send:
        required: false
        default: false
        type: boolean
      probe_target_membership:
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation
        required: true
        type: choice
        options:
          - health
          - deploy_preflight
          - deploy_apply
          - deploy_recovery
          - db_cleanup_check
          - phone_diagnose
          - webapp_observation_diagnose
          - wechat_delivery_diagnose
          - wechat_delivery_probe
          - wechat_quiesce
          - airflow_resume
          - nswtt_config_sync
          - pi_device_ssh_sync
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      request_id:
        description: Unique request correlation ID
        required: false
        default: manual
        type: string
      confirm_real_send:
        description: Explicit approval for a real WeChat acceptance message
        required: true
        default: false
        type: boolean
      probe_target_membership:
        description: Optional redacted target selector such as tyzx:1 or dsh_free:1
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: production-airflow-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - name: Validate exact target
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.operation == 'webapp_observation_diagnose'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install operations dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install Web diagnostic dependencies
        if: inputs.operation == 'webapp_observation_diagnose'
        working-directory: webapp
        run: npm ci
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Execute protected operation
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          CONFIRM_REAL_SEND: ${{ inputs.confirm_real_send }}
          PROBE_TARGET_MEMBERSHIP: ${{ inputs.probe_target_membership }}
          NSWTT_API_CONFIG: ${{ secrets.NSWTT_API_CONFIG }}
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          case "$OPERATION" in
            health)
              PYTHONPATH=src python scripts/production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_preflight)
              PYTHONPATH=scripts python scripts/repair_airflow_worktree.py \
                --target-commit "$TARGET_COMMIT" \
                --expected-dirty-count 1 \
                --if-needed \
                --format json
              PYTHONPATH=scripts python scripts/diagnose_airflow_deploy_preflight.py \
                --target-commit "$TARGET_COMMIT" --format json
              PYTHONPATH=src python scripts/deploy_airflow.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_apply)
              PYTHONPATH=scripts python scripts/diagnose_airflow_deploy_preflight.py \
                --target-commit "$TARGET_COMMIT" --format json
              PYTHONPATH=src python scripts/deploy_airflow_transaction.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_recovery)
              PYTHONPATH=src python scripts/deploy_airflow_transaction.py \
                --recover-active-tasks --target-commit "$TARGET_COMMIT" --format json
              ;;
            db_cleanup_check)
              PYTHONPATH=src python scripts/airflow_db_cleanup.py --format json
              ;;
            phone_diagnose)
              PYTHONPATH=src python scripts/diagnose_zacks_phone.py --format json
              ;;
            webapp_observation_diagnose)
              bash scripts/diagnose_webapp_observation.sh
              bash scripts/diagnose_email_delivery_metrics.sh
              ;;
            wechat_delivery_diagnose)
              PYTHONPATH=scripts python scripts/diagnose_wechat_delivery.py --format json
              ;;
            wechat_delivery_probe)
              test "$CONFIRM_REAL_SEND" = "true"
              PYTHONPATH=scripts python scripts/probe_wechat_delivery.py \
                --confirm-real-send --target-membership "$PROBE_TARGET_MEMBERSHIP" \
                --format json
              ;;
            wechat_quiesce)
              PYTHONPATH=scripts python scripts/quiesce_wechat_delivery.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            airflow_resume)
              PYTHONPATH=scripts python scripts/resume_airflow_scheduling.py \
                --target-commit "$TARGET_COMMIT" --format json
              ;;
            nswtt_config_sync)
              PYTHONPATH=scripts python scripts/sync_nswtt_config.py
              ;;
            pi_device_ssh_sync)
              PYTHONPATH=scripts python scripts/sync_pi_device_ssh.py
              ;;
            *)
              exit 2
              ;;
          esac
