name: One-time Host Core API restart readiness fix

on:
  push:
    branches:
      - fix/host-core-api-restart-readiness-20260904

permissions:
  contents: write

concurrency:
  group: one-time-host-core-api-restart-readiness-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/host-core-api-restart-readiness-20260904
          fetch-depth: 0

      - name: Add bounded API health and readiness warm-up
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/host_core_production.py")
          source = script_path.read_text(encoding="utf-8")

          helper_anchor = '''def _wait_for_local_health(target_commit, timeout_seconds=180):
              deadline = time.monotonic() + timeout_seconds
              last_error = None
              while time.monotonic() < deadline:
                  try:
                      return local_health(target_commit)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(3)
              raise RuntimeError(f"host core did not become healthy: {last_error}")
          '''
          helper_anchor = "\n".join(line[10:] if line.startswith("          ") else line for line in helper_anchor.splitlines()) + "\n"
          helper_replacement = helper_anchor + '''
          
          def _wait_for_local_ready(timeout_seconds=180):
              deadline = time.monotonic() + timeout_seconds
              last_error = None
              while time.monotonic() < deadline:
                  try:
                      return local_ready()
                  except Exception as exc:
                      last_error = exc
                      time.sleep(3)
              raise RuntimeError(f"host core did not become ready: {last_error}")
          '''
          helper_replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in helper_replacement.splitlines()) + "\n"
          if source.count(helper_anchor) != 1:
              raise SystemExit(f"health helper anchor count: {source.count(helper_anchor)}")
          source = source.replace(helper_anchor, helper_replacement, 1)

          start = source.index("def prepare_cutover(target_commit):")
          end = source.index("\n\ndef cutover(target_commit):", start)
          block = source[start:end]
          old = '''    compose("restart", "zacks-api")
              health_value = local_health(target_commit)
              ready_value = local_ready()
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''    compose("restart", "zacks-api")
              health_value = _wait_for_local_health(target_commit)
              ready_value = _wait_for_local_ready()
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if block.count(old) != 1:
              raise SystemExit(f"prepare-cutover restart anchor count: {block.count(old)}")
          block = block.replace(old, new, 1)
          source = source[:start] + block + source[end:]
          script_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/host_core_restart_readiness_test.py")
          test_path.write_text(
              '''from __future__ import annotations

import importlib.util
from pathlib import Path
from unittest.mock import Mock, patch

ROOT = Path(__file__).resolve().parents[1]
SPEC = importlib.util.spec_from_file_location(
    "host_core_production_restart_test",
    ROOT / "scripts" / "host_core_production.py",
)
assert SPEC is not None and SPEC.loader is not None
MODULE = importlib.util.module_from_spec(SPEC)
SPEC.loader.exec_module(MODULE)


def test_local_ready_wait_retries_transient_restart_errors() -> None:
    ready = {"ok": True, "databaseReady": True}
    with (
        patch.object(
            MODULE,
            "local_ready",
            side_effect=[RuntimeError("connection reset"), ready],
        ) as local_ready,
        patch.object(MODULE.time, "monotonic", side_effect=[0, 1, 2]),
        patch.object(MODULE.time, "sleep") as sleep,
    ):
        assert MODULE._wait_for_local_ready(timeout_seconds=10) == ready

    assert local_ready.call_count == 2
    sleep.assert_called_once_with(3)


def test_prepare_cutover_waits_after_restarting_api() -> None:
    target = "a" * 40
    health = {
        "ok": True,
        "deliveryOwner": "cloudflare",
        "observationMode": "host",
    }
    ready = {"ok": True, "databaseReady": True}
    with (
        patch.object(MODULE, "assert_target"),
        patch.object(MODULE, "check_ses_credentials"),
        patch.object(MODULE, "variable_set"),
        patch.object(MODULE, "compose") as compose,
        patch.object(MODULE, "_wait_for_local_health", return_value=health) as wait_health,
        patch.object(MODULE, "_wait_for_local_ready", return_value=ready) as wait_ready,
        patch.object(MODULE, "running_services", return_value=set()),
        patch.object(MODULE, "local_health", Mock(side_effect=AssertionError("immediate health call"))),
        patch.object(MODULE, "local_ready", Mock(side_effect=AssertionError("immediate ready call"))),
    ):
        result = MODULE.prepare_cutover(target)

    compose.assert_any_call("restart", "zacks-api")
    wait_health.assert_called_once_with(target)
    wait_ready.assert_called_once_with()
    assert result["notificationWorker"] == "stopped"
    assert result["localHealth"] == health
    assert result["localReady"] == ready
''',
              encoding="utf-8",
          )
          PY
          git rm .github/workflows/host-core-api-restart-readiness-fix-once.yml

      - name: Format and run focused tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.11 pytest==9.1.1
          ruff format scripts/host_core_production.py tests/host_core_restart_readiness_test.py
          ruff check scripts/host_core_production.py tests/host_core_restart_readiness_test.py
          PYTHONPATH=src pytest -q tests/host_core_restart_readiness_test.py

      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/host_core_production.py tests/host_core_restart_readiness_test.py
          git commit -m "fix(host-core): wait for API readiness after restart"
          git push origin HEAD:fix/host-core-api-restart-readiness-20260904
