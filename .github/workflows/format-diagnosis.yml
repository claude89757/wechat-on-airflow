name: Format diagnosis script

on:
  push:
    branches:
      - ops/webapp-observation-diagnosis

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/webapp-observation-diagnosis
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Format file
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.11
          ruff format scripts/diagnose_webapp_observation.py
      - name: Commit formatting
        run: |
          if git diff --quiet -- scripts/diagnose_webapp_observation.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/diagnose_webapp_observation.py
          git commit -m 'style: format Web observation diagnosis'
          git push origin HEAD:ops/webapp-observation-diagnosis
