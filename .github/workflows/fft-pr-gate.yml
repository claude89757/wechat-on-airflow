name: Gate FFT Qianhai pull request

on:
  push:
    branches:
      - feat/fft-qianhai-release-prep-20260830
    paths:
      - .github/workflows/fft-pr-gate.yml

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publish clean feature head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          rm -f .github/workflows/fft-pr-gate.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove temporary FFT release gate'
          git push origin HEAD:${GITHUB_REF_NAME}
          head_sha=$(git rev-parse HEAD)
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Open or locate pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.head.outputs.sha }}'
          pr_number=$(gh api "repos/$GH_REPO/pulls?state=open&head=${{ github.repository_owner }}:${GITHUB_REF_NAME}&base=main" --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title 'feat: 接入 FFTENNIS 前海国际网球中心' \
              --body "## 变更\n\n- 接入 FFTENNIS 前海国际网球中心只读 PosPal 场地查询。\n- 新增 30 秒 Airflow 巡检，并发布原始观测到 Web 订阅服务。\n- Web 场地目录、视觉标识和 D1 迁移同步上线。\n- 仅发布 1–6 号标准双打场；排除非标单打场和发球机场。\n- 首次完整巡检只建立微信去重基线，不推送历史余量。\n\n## 验证\n\n- 标准 TLS、无登录态、无代理的三日只读 API 探测通过。\n- 定向测试、格式、类型、Python 全量测试、Web 检查、Compose 合约与 DAG 导入均通过。\n- 最终合并绑定精确 head SHA：\`$head_sha\`。\n\n## 安全边界\n\n不创建订单、不锁场、不支付；不发送真实邮件或微信验收消息。")
            pr_number=${pr_url##*/}
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Pull request: #$pr_number" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact head: $head_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact CI verify
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.head.outputs.sha }}'
          pr_number='${{ steps.pr.outputs.number }}'
          for attempt in $(seq 1 180); do
            runs=$(gh api "repos/$GH_REPO/commits/$head_sha/check-runs?per_page=100")
            conclusion=$(jq -r '[.check_runs[] | select(.name == "verify")][0].conclusion // empty' <<<"$runs")
            status=$(jq -r '[.check_runs[] | select(.name == "verify")][0].status // empty' <<<"$runs")
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "CI verify concluded: $conclusion" >&2
                exit 1
              fi
              echo "CI verify passed for $head_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for CI verify on PR #$pr_number" >&2
          exit 1

      - name: Merge exact verified head
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.head.outputs.sha }}'
          pr_number='${{ steps.pr.outputs.number }}'
          response=$(gh api \
            --method PUT \
            "repos/$GH_REPO/pulls/$pr_number/merge" \
            -f sha="$head_sha" \
            -f merge_method=squash \
            -f commit_title='feat: 接入 FFTENNIS 前海国际网球中心' \
            -f commit_message='Add the read-only venue API adapter, Airflow inspection, Web subscription catalog entry, D1 migration, safety filters, tests, and operational contracts.')
          jq -e '.merged == true' <<<"$response" >/dev/null
          merge_sha=$(jq -r '.sha' <<<"$response")
          echo "Merged PR #$pr_number as $merge_sha" >> "$GITHUB_STEP_SUMMARY"
