name: YDMap Normal Date Query Evidence
on:
  workflow_dispatch:
  push:
    branches: [feat/bawtt-ydmap-onboarding-20260916]
    paths: [.github/workflows/ydmap-date-query.yml]
permissions:
  contents: read
  checks: read
concurrency:
  group: bawtt-public-contract-validation
  cancel-in-progress: false
jobs:
  evidence:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 126c359919556081f68cf8199f5de9898129694b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact baseline and bounded date-query inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/github_release_gate.py > scripts/github_release_gate.py
          PYTHONPATH=scripts python scripts/github_release_gate.py --target-commit 126c359919556081f68cf8199f5de9898129694b --wait-seconds 0 --format json
          for path in scripts/ydmap_date_query.py scripts/ydmap_query_evidence.py tests/ydmap_date_query_test.py tests/ydmap_query_evidence_test.py; do
            git show "$SOURCE_SHA:$path" > "$path"
          done
          git show 60251efc990faf79014a24ff952e75dd622dea5f:scripts/ydmap_source_compare.py > scripts/ydmap_source_compare.py
          git show 8c6577b3c21d84d5aac5a94ee7717d09ccd9737c:scripts/bawtt_live_query.py > scripts/bawtt_live_query.py
          python -m pip install paramiko==3.5.1 cryptography==50.0.1 pytest==9.1.1 ruff==0.12.11
          ruff check scripts/ydmap_date_query.py scripts/ydmap_query_evidence.py tests/ydmap_date_query_test.py tests/ydmap_query_evidence_test.py
          ruff format --check scripts/ydmap_date_query.py scripts/ydmap_query_evidence.py tests/ydmap_date_query_test.py tests/ydmap_query_evidence_test.py
          python -m pytest -q tests/ydmap_date_query_test.py tests/ydmap_query_evidence_test.py
      - name: Passively capture queries after one normal visible date click per source
        env:
          PI_DEVICE_SSH_HOST: ${{ secrets.PI_DEVICE_SSH_HOST }}
          PI_DEVICE_SSH_PORT: ${{ secrets.PI_DEVICE_SSH_PORT }}
          PI_DEVICE_SSH_USER: ${{ secrets.PI_DEVICE_SSH_USER }}
          PI_DEVICE_SSH_PASSWORD: ${{ secrets.PI_DEVICE_SSH_PASSWORD }}
          PI_DEVICE_SSH_HOST_KEY_SHA256: ${{ secrets.PI_DEVICE_SSH_HOST_KEY_SHA256 }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, logging, os
          from pathlib import Path
          import paramiko
          from wechat_airflow.clients.android_device import PinnedSHA256HostKeyPolicy
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          names=('ydmap_date_query.py','ydmap_query_evidence.py','ydmap_source_compare.py','bawtt_live_query.py')
          sources={name:Path('scripts',name).read_text() for name in names}
          code='import pathlib,tempfile,sys,runpy\nsources='+repr(sources)+'\n'
          code+="with tempfile.TemporaryDirectory(prefix='ydmap-date-source-') as directory:\n"
          code+="    for name,content in sources.items():\n        pathlib.Path(directory,name).write_text(content)\n"
          code+="    sys.path.insert(0,directory)\n    runpy.run_path(str(pathlib.Path(directory,'ydmap_date_query.py')),run_name='__main__')\n"
          compile(code,'<normal-date-query>','exec')
          client=paramiko.SSHClient()
          try:
              client.set_missing_host_key_policy(PinnedSHA256HostKeyPolicy(os.environ['PI_DEVICE_SSH_HOST_KEY_SHA256']))
              client.connect(os.environ['PI_DEVICE_SSH_HOST'],port=int(os.environ['PI_DEVICE_SSH_PORT']),username=os.environ['PI_DEVICE_SSH_USER'],password=os.environ['PI_DEVICE_SSH_PASSWORD'],timeout=12,auth_timeout=12,banner_timeout=12,allow_agent=False,look_for_keys=False)
              client.get_transport().set_keepalive(15)
              stdin,stdout,stderr=client.exec_command('timeout --kill-after=10s 190s python3 -u -',timeout=210)
              stdin.write(code)
              stdin.flush()
              stdin.channel.shutdown_write()
              raw=stdout.read(196609)
              if len(raw)>196608 or not raw:
                  raise ValueError('missing_or_oversized_evidence')
              report=json.loads(raw)
              report['remoteExitCode']=stdout.channel.recv_exit_status()
              text=json.dumps(report,ensure_ascii=False,sort_keys=True)
              print(text)
              outdir=Path(os.environ['RUNNER_TEMP'])/'ydmap-date-query'
              outdir.mkdir(exist_ok=True)
              (outdir/'observation.json').write_text(text)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('### Normal date query evidence; never production acceptance\n```json\n'+text+'\n```\n')
              rows=report.get('sources',[])
              if report['remoteExitCode'] or len(rows)!=3 or any(r.get('state')!='evidence_collected_not_acceptance' or not r.get('queries') for r in rows):
                  raise SystemExit(1)
          except SystemExit:
              raise
          except Exception as error:
              print(json.dumps({'state':'date_query_evidence_failed','errorClass':type(error).__name__,'productionChanged':False}))
              raise SystemExit(1)
          finally:
              client.close()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ydmap-date-query
          path: ${{ runner.temp }}/ydmap-date-query/
          retention-days: 1
          if-no-files-found: ignore
