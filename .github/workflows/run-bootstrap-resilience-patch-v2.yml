name: Run bootstrap resilience patch v2

on:
  push:
    branches:
      - fix/bootstrap-degraded-fallback-2026-09-03
    paths:
      - .github/workflows/run-bootstrap-resilience-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/bootstrap-degraded-fallback-2026-09-03
          fetch-depth: 0
      - name: Execute staged patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-bootstrap-resilience-patch.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          original = '''def replace_once(path: str, old: str, new: str) -> None:
    target = Path(path)
    text = target.read_text(encoding="utf-8")
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{path}: expected one match, found {count}")
    target.write_text(text.replace(old, new, 1), encoding="utf-8")
'''
          replacement = '''def replace_once(path: str, old: str, new: str) -> None:
    target = Path(path)
    text = target.read_text(encoding="utf-8")
    count = text.count(old)
    if count == 1:
        target.write_text(text.replace(old, new, 1), encoding="utf-8")
        return
    if path == "webapp/src/api.ts" and old.startswith("  const promise = jsonRequest<Dashboard>"):
        start = text.index("  const promise = jsonRequest<Dashboard>")
        end = text.index("  dashboardRequest = { identityKey, epoch, promise };", start)
        target.write_text(text[:start] + new + text[end:], encoding="utf-8")
        return
    raise SystemExit(f"{path}: expected one match, found {count}; anchor={old[:120]!r}")
'''
          if original not in script:
              raise SystemExit("replace_once helper anchor missing")
          script = script.replace(original, replacement, 1)
          exec(compile(script, str(workflow), "exec"), {})
          for name in (
              ".github/workflows/run-bootstrap-resilience-patch.yml",
              ".github/workflows/debug-bootstrap-resilience-patch.yml",
              ".github/workflows/run-bootstrap-resilience-patch-v2.yml",
          ):
              Path(name).unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): preserve last dashboard during D1 outages"
          git push origin HEAD:fix/bootstrap-degraded-fallback-2026-09-03
