name: One-time guarded v0.7.0 host-core finalizer

on:
  push:
    branches:
      - feat/airflow-host-core-v0.7.0-final3

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-time-v070-host-core-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/airflow-host-core-v0.7.0-final3
      PR_NUMBER: "188"
      RELEASE_TAG: "0.7.0"
      PUBLIC_BASE_URL: https://zacks.claude89757.cc
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0

      - name: Validate immutable release inputs
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$FEATURE_BRANCH"
          test "$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )" = "$RELEASE_TAG"
          test -f .github/workflows/production-host-core.yml
          test -f config/host-core-contract.yaml
          test -f docs/runbooks/host-core-cutover.md
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$pr_head" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)" = open

      - name: Define exact-SHA workflow helpers
        run: |
          cat > /tmp/v070-functions.sh <<'BASH'
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local ref="$2"
            local expected_sha="$3"
            shift 3
            local started_at run_json run_id deadline
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --ref "$ref" "$@"
            deadline=$((SECONDS + 2400))
            run_json=""
            while (( SECONDS < deadline )); do
              run_json="$(
                gh run list \
                  --workflow "$workflow" \
                  --branch "$ref" \
                  --event workflow_dispatch \
                  --limit 30 \
                  --json databaseId,headSha,createdAt,status,conclusion \
                | jq -c \
                    --arg sha "$expected_sha" \
                    --arg started "$started_at" \
                    '[.[] | select(.headSha == $sha and .createdAt >= $started)]
                     | sort_by(.createdAt)
                     | last // empty'
              )"
              if [[ -n "$run_json" ]]; then
                break
              fi
              sleep 5
            done
            if [[ -z "$run_json" ]]; then
              echo "Timed out locating $workflow for $expected_sha" >&2
              return 1
            fi
            run_id="$(jq -r .databaseId <<<"$run_json")"
            echo "Watching $workflow run $run_id for $expected_sha"
            gh run watch "$run_id" --exit-status
            gh run view "$run_id" --json databaseId,headSha,status,conclusion,url \
              | tee "/tmp/${workflow//\//_}-${expected_sha}.json"
          }
          BASH

      - name: Run full CI for the current branch head
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          head_sha="$(git rev-parse HEAD)"
          dispatch_and_wait ci.yml "$FEATURE_BRANCH" "$head_sha"

      - name: Remove this one-time workflow before merge
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/host-core-v070-autofinalize.yml
          git commit -m "ci: remove one-time v0.7.0 finalizer"
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run full CI for the cleaned exact PR head
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          test "$(git rev-parse HEAD)" = "$CLEAN_HEAD"
          dispatch_and_wait ci.yml "$FEATURE_BRANCH" "$CLEAN_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$CLEAN_HEAD"

      - name: Merge the exact tested PR head
        run: |
          set -euo pipefail
          response="$(
            gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f sha="$CLEAN_HEAD" \
              -f merge_method=merge \
              -f commit_title="feat: move notification core to the Airflow host (#188)" \
              -f commit_message="Promote PostgreSQL on the Airflow host to the durable notification core and retain Cloudflare as a stateless edge with a reversible D1 rollback window."
          )"
          jq -e '.merged == true and (.sha | length == 40)' <<<"$response"
          merge_sha="$(jq -r .sha <<<"$response")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$merge_sha"
          echo "MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"
          echo "$response" > /tmp/v070-merge.json

      - name: Run full CI for the exact main commit
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          dispatch_and_wait ci.yml main "$MERGE_SHA"

      - name: Execute the protected production cutover
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          dispatch_and_wait \
            production-host-core.yml \
            main \
            "$MERGE_SHA" \
            -f operation=full-cutover \
            -f target_commit="$MERGE_SHA"

      - name: Observe three natural production cycles
        run: |
          set -euo pipefail
          mkdir -p /tmp/v070-acceptance
          for cycle in 1 2 3; do
            curl --fail --silent --show-error --max-time 20 \
              "$PUBLIC_BASE_URL/api/healthz" \
              -o "/tmp/v070-acceptance/health-$cycle.json"
            curl --fail --silent --show-error --max-time 20 \
              "$PUBLIC_BASE_URL/api/readyz" \
              -o "/tmp/v070-acceptance/ready-$cycle.json"
            curl --fail --silent --show-error --max-time 20 \
              "$PUBLIC_BASE_URL/api/edge-healthz" \
              -o "/tmp/v070-acceptance/edge-$cycle.json"
            curl --fail --silent --show-error --max-time 30 \
              "$PUBLIC_BASE_URL/api/bootstrap" \
              -o "/tmp/v070-acceptance/bootstrap-$cycle.json"

            CYCLE="$cycle" MERGE_SHA="$MERGE_SHA" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          cycle = int(os.environ["CYCLE"])
          expected = os.environ["MERGE_SHA"]
          root = Path("/tmp/v070-acceptance")

          def load(name: str) -> dict[str, object]:
              value = json.loads((root / f"{name}-{cycle}.json").read_text())
              if not isinstance(value, dict):
                  raise SystemExit(f"{name} payload is not an object")
              return value

          health = load("health")
          ready = load("ready")
          edge = load("edge")
          bootstrap = load("bootstrap")

          assert health.get("ok") is True, health
          assert health.get("runtime") == "airflow-host", health
          assert health.get("deploymentCommit") == expected, health
          capabilities = health.get("capabilities")
          assert isinstance(capabilities, dict), health
          assert capabilities.get("priorityWeatherBypass") is True, health
          assert ready.get("ok") is True, ready
          assert edge.get("ok") is True, edge
          assert edge.get("runtime") == "cloudflare-stateless-edge", edge
          assert edge.get("deploymentCommit") == expected, edge
          assert edge.get("cutover") is True, edge
          assert edge.get("quiesced") is False, edge
          assert edge.get("migrationEndpoint") is False, edge
          assert edge.get("durableBusinessState") == "none", edge

          venues = bootstrap.get("venues")
          assert isinstance(venues, list) and len(venues) == 26, len(venues or [])
          now = datetime.now(UTC)
          fresh: list[str] = []
          snapshot: list[tuple[str, str]] = []
          for item in venues:
              if not isinstance(item, dict):
                  continue
              venue_id = str(item.get("id") or item.get("venueId") or item.get("venue_id") or "")
              raw = (
                  item.get("lastInspectionAt")
                  or item.get("last_inspection_at")
                  or item.get("updatedAt")
                  or item.get("updated_at")
              )
              if not isinstance(raw, str) or not raw:
                  continue
              snapshot.append((venue_id, raw))
              try:
                  observed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  continue
              if observed.tzinfo is None:
                  observed = observed.replace(tzinfo=UTC)
              if observed >= now - timedelta(minutes=20):
                  fresh.append(venue_id)
          assert len(fresh) >= 20, {"fresh": len(fresh), "cycle": cycle}
          digest = hashlib.sha256(
              json.dumps(sorted(snapshot), separators=(",", ":")).encode()
          ).hexdigest()
          (root / f"snapshot-{cycle}.txt").write_text(digest + "\n")
          (root / f"summary-{cycle}.json").write_text(
              json.dumps(
                  {
                      "cycle": cycle,
                      "commit": expected,
                      "venueCount": len(venues),
                      "freshVenueCount": len(fresh),
                      "snapshotDigest": digest,
                      "checkedAt": now.isoformat(),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          PY

            if [[ "$cycle" != 3 ]]; then
              sleep 90
            fi
          done

          distinct_snapshots="$(sort -u /tmp/v070-acceptance/snapshot-*.txt | wc -l | tr -d ' ')"
          if (( distinct_snapshots < 2 )); then
            echo "Natural venue observations did not advance across the acceptance window" >&2
            exit 1
          fi

      - name: Create the immutable 0.7.0 release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/tmp/existing-release.json 2>/dev/null; then
            existing_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            test "$existing_target" = "$MERGE_SHA"
          else
            python - <<'PY'
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = "## [0.7.0]"
          start = text.index(marker)
          remainder = text[start:]
          next_heading = remainder.find("\n## [", len(marker))
          notes = remainder if next_heading < 0 else remainder[:next_heading]
          Path("/tmp/v070-release-notes.md").write_text(notes.strip() + "\n", encoding="utf-8")
          PY
            gh release create "$RELEASE_TAG" \
              --target "$MERGE_SHA" \
              --title "0.7.0 — Airflow host notification core" \
              --notes-file /tmp/v070-release-notes.md
          fi

      - name: Publish authoritative acceptance evidence
        if: success()
        run: |
          set -euo pipefail
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          production_run="$(
            gh run list \
              --workflow production-host-core.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,conclusion,url \
            | jq -r --arg sha "$MERGE_SHA" \
                '[.[] | select(.headSha == $sha and .conclusion == "success")] | first | .url'
          )"
          {
            echo "### v0.7.0 host-core production acceptance"
            echo "- Main commit: \`$MERGE_SHA\`"
            echo "- Production workflow: $production_run"
            echo "- Release: $release_url"
            echo "- Edge runtime: \`cloudflare-stateless-edge\`"
            echo "- Durable business state: \`postgresql:zacks\`"
            echo "- Natural acceptance cycles: 3"
            echo "- Synthetic email/WeChat notifications: none"
            for summary in /tmp/v070-acceptance/summary-*.json; do
              echo
              echo '```json'
              cat "$summary"
              echo '```'
            done
          } | tee /tmp/v070-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file /tmp/v070-acceptance-summary.md
