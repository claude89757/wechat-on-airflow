name: Production Control
run-name: control/${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: production-control-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      ((github.event.issue.number == 39 &&
        (startsWith(github.event.comment.body, '/release ') ||
         startsWith(github.event.comment.body, '/ops '))) ||
       (github.event.issue.number == 188 &&
        startsWith(github.event.comment.body, '/format-host-core ')))
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.command.outputs.action }}
      mode: ${{ steps.command.outputs.mode }}
      version: ${{ steps.command.outputs.version }}
      target_commit: ${{ steps.command.outputs.target_commit }}
      scope: ${{ steps.command.outputs.scope }}
      include_sender: ${{ steps.command.outputs.include_sender }}
      target_selector: ${{ steps.command.outputs.target_selector }}
    steps:
      - name: Parse exact production command
        id: command
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import shlex
          from pathlib import Path

          body = os.environ["BODY"].strip()
          tokens = shlex.split(body)
          sha = re.compile(r"^[0-9a-fA-F]{40}$")
          version = re.compile(r"^\d+\.\d+\.\d+$")
          scopes = {"auto", "all", "webapp", "airflow", "sender", "control"}
          outputs = {
              "action": "",
              "mode": "",
              "version": "",
              "target_commit": "",
              "scope": "auto",
              "include_sender": "false",
              "target_selector": "all",
          }

          def fail(message: str) -> None:
              raise SystemExit(message)

          def parse_options(values: list[str]) -> None:
              seen: set[str] = set()
              for value in values:
                  if "=" not in value:
                      fail(f"invalid option: {value}")
                  key, raw = value.split("=", 1)
                  if key in seen:
                      fail(f"duplicate option: {key}")
                  seen.add(key)
                  if key == "scope" and raw in scopes:
                      outputs["scope"] = raw
                  elif key == "sender" and raw in {"true", "false"}:
                      outputs["include_sender"] = raw
                  else:
                      fail(f"invalid option: {value}")

          if len(tokens) >= 2 and tokens[0] == "/release":
              command = tokens[1]
              if command in {"preflight", "apply"}:
                  if len(tokens) < 3 or not sha.fullmatch(tokens[2]):
                      fail("release preflight/apply requires a full 40-character SHA")
                  outputs["action"] = "release"
                  outputs["mode"] = command
                  outputs["target_commit"] = tokens[2].lower()
                  parse_options(tokens[3:])
              elif command == "ship":
                  if len(tokens) < 4 or not version.fullmatch(tokens[2]) or not sha.fullmatch(tokens[3]):
                      fail("release ship requires a semantic version and full 40-character SHA")
                  outputs["action"] = "ship"
                  outputs["version"] = tokens[2]
                  outputs["target_commit"] = tokens[3].lower()
                  parse_options(tokens[4:])
              elif command == "tag":
                  if len(tokens) != 4 or not version.fullmatch(tokens[2]) or not sha.fullmatch(tokens[3]):
                      fail("release tag requires a semantic version and full 40-character SHA")
                  outputs["action"] = "tag"
                  outputs["version"] = tokens[2]
                  outputs["target_commit"] = tokens[3].lower()
              else:
                  fail(f"unknown release command: {command}")
          elif tokens[:2] == ["/ops", "webapp-observation-diagnose"]:
              if len(tokens) != 3 or not sha.fullmatch(tokens[2]):
                  fail("webapp observation diagnosis requires a full 40-character SHA")
              outputs["action"] = "webapp_observation_diagnose"
              outputs["target_commit"] = tokens[2].lower()
          elif tokens[:2] == ["/ops", "wechat-contact-probe"]:
              if len(tokens) != 4 or not sha.fullmatch(tokens[2]):
                  fail("WeChat contact probe requires a full 40-character SHA and simple contact name")
              if not re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", tokens[3]):
                  fail("contact name must contain only letters, numbers, dot, underscore, or hyphen")
              outputs["action"] = "wechat_contact_probe"
              outputs["target_commit"] = tokens[2].lower()
              outputs["target_selector"] = f"direct:{tokens[3]}"
          elif tokens[:1] == ["/format-host-core"]:
              if len(tokens) != 2 or not sha.fullmatch(tokens[1]):
                  fail("host-core formatter requires the exact 40-character PR head SHA")
              outputs["action"] = "format_host_core"
              outputs["target_commit"] = tokens[1].lower()
          else:
              fail("unsupported production command")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY
      - name: Explain invalid command
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          Production command was rejected before any operation ran.

          Supported forms:
          - \`/release ship <version> <40-char-sha> [scope=auto|all|webapp|airflow|sender|control] [sender=true|false]\`
          - \`/release preflight <40-char-sha> [scope=...] [sender=true|false]\`
          - \`/release apply <40-char-sha> [scope=...] [sender=true|false]\`
          - \`/release tag <version> <40-char-sha>\`
          - \`/ops webapp-observation-diagnose <40-char-sha>\`
          - \`/ops wechat-contact-probe <40-char-sha> <simple-contact-name>\`
          - on PR #188 only: \`/format-host-core <40-char-pr-head-sha>\`

          Run: $RUN_URL
          EOF

  release:
    if: needs.route.outputs.action == 'release'
    needs: route
    uses: ./.github/workflows/production-release.yml
    with:
      mode: ${{ needs.route.outputs.mode }}
      target_commit: ${{ needs.route.outputs.target_commit }}
      scope: ${{ needs.route.outputs.scope }}
      include_sender: ${{ needs.route.outputs.include_sender == 'true' }}
    secrets: inherit

  ship:
    if: needs.route.outputs.action == 'ship'
    needs: route
    uses: ./.github/workflows/production-ship.yml
    with:
      version: ${{ needs.route.outputs.version }}
      target_commit: ${{ needs.route.outputs.target_commit }}
      scope: ${{ needs.route.outputs.scope }}
      include_sender: ${{ needs.route.outputs.include_sender == 'true' }}
    secrets: inherit

  tag:
    if: needs.route.outputs.action == 'tag'
    needs: route
    uses: ./.github/workflows/release-tag-chatops.yml
    with:
      version: ${{ needs.route.outputs.version }}
      target_commit: ${{ needs.route.outputs.target_commit }}
    secrets: inherit

  webapp_observation_diagnose:
    if: needs.route.outputs.action == 'webapp_observation_diagnose'
    needs: route
    uses: ./.github/workflows/production-airflow.yml
    with:
      operation: webapp_observation_diagnose
      target_commit: ${{ needs.route.outputs.target_commit }}
      request_id: ops-${{ github.run_id }}
      confirm_real_send: false
      probe_target_membership: all
    secrets: inherit

  wechat_contact_probe:
    if: needs.route.outputs.action == 'wechat_contact_probe'
    needs: route
    uses: ./.github/workflows/production-airflow.yml
    with:
      operation: wechat_delivery_probe
      target_commit: ${{ needs.route.outputs.target_commit }}
      request_id: contact-probe-${{ github.run_id }}
      confirm_real_send: true
      probe_target_membership: ${{ needs.route.outputs.target_selector }}
    secrets: inherit

  format_host_core:
    if: needs.route.outputs.action == 'format_host_core'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the exact requested PR head
        env:
          TARGET_COMMIT: ${{ needs.route.outputs.target_commit }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
      - name: Apply the repository's pinned Ruff formatter
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.11
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit only deterministic formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "style(host-core): apply repository Ruff formatting"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3

  report:
    if: always() && needs.route.result == 'success'
    needs:
      - route
      - release
      - ship
      - tag
      - webapp_observation_diagnose
      - wechat_contact_probe
      - format_host_core
    runs-on: ubuntu-latest
    steps:
      - name: Publish one authoritative result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ needs.route.outputs.action }}
          MODE: ${{ needs.route.outputs.mode }}
          VERSION: ${{ needs.route.outputs.version }}
          TARGET_COMMIT: ${{ needs.route.outputs.target_commit }}
          REQUESTED_SCOPE: ${{ needs.route.outputs.scope }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_RESOLVED_SCOPE: ${{ needs.release.outputs.resolved_scope }}
          RELEASE_WEBAPP: ${{ needs.release.outputs.deploy_webapp }}
          RELEASE_AIRFLOW: ${{ needs.release.outputs.deploy_airflow }}
          RELEASE_SENDER: ${{ needs.release.outputs.deploy_sender }}
          SHIP_RESULT: ${{ needs.ship.result }}
          SHIP_RESOLVED_SCOPE: ${{ needs.ship.outputs.resolved_scope }}
          SHIP_WEBAPP: ${{ needs.ship.outputs.deploy_webapp }}
          SHIP_AIRFLOW: ${{ needs.ship.outputs.deploy_airflow }}
          SHIP_SENDER: ${{ needs.ship.outputs.deploy_sender }}
          TAG_RESULT: ${{ needs.tag.result }}
          WEB_DIAG_RESULT: ${{ needs.webapp_observation_diagnose.result }}
          WECHAT_PROBE_RESULT: ${{ needs.wechat_contact_probe.result }}
          FORMAT_RESULT: ${{ needs.format_host_core.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            release)
              result="$RELEASE_RESULT"
              label="release $MODE"
              resolved="$RELEASE_RESOLVED_SCOPE"
              webapp="$RELEASE_WEBAPP"
              airflow="$RELEASE_AIRFLOW"
              sender="$RELEASE_SENDER"
              ;;
            ship)
              result="$SHIP_RESULT"
              label="ship $VERSION"
              resolved="$SHIP_RESOLVED_SCOPE"
              webapp="$SHIP_WEBAPP"
              airflow="$SHIP_AIRFLOW"
              sender="$SHIP_SENDER"
              ;;
            tag)
              result="$TAG_RESULT"
              label="tag $VERSION"
              resolved="n/a"
              webapp=""
              airflow=""
              sender=""
              ;;
            webapp_observation_diagnose)
              result="$WEB_DIAG_RESULT"
              label="Web observation diagnosis"
              resolved="n/a"
              webapp=""
              airflow=""
              sender=""
              ;;
            wechat_contact_probe)
              result="$WECHAT_PROBE_RESULT"
              label="one-contact WeChat probe"
              resolved="n/a"
              webapp=""
              airflow=""
              sender=""
              ;;
            format_host_core)
              result="$FORMAT_RESULT"
              label="host-core deterministic formatting"
              resolved="n/a"
              webapp=""
              airflow=""
              sender=""
              ;;
            *) echo "Unknown routed action: $ACTION" >&2; exit 2 ;;
          esac

          if [ "$result" = success ]; then
            marker="✅"
          else
            marker="❌"
          fi

          if [ "$resolved" = n/a ]; then
            components="n/a"
          elif [ -z "$webapp$airflow$sender" ]; then
            components="unknown"
          else
            selected=()
            [ "$webapp" = true ] && selected+=(webapp)
            [ "$airflow" = true ] && selected+=(airflow)
            [ "$sender" = true ] && selected+=(sender)
            if [ "${#selected[@]}" -eq 0 ]; then
              components="none"
            else
              components="$(IFS=,; echo "${selected[*]}")"
            fi
          fi
          resolved="${resolved:-unknown}"

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "$marker Production control \`$label\`: \`$result\`; target=\`$TARGET_COMMIT\`; requested_scope=\`$REQUESTED_SCOPE\`; resolved_scope=\`$resolved\`; components=\`$components\`. Run: $RUN_URL"
          test "$result" = success