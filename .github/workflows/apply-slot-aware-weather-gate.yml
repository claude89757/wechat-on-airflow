name: Apply Slot-Aware Weather Gate
run-name: apply-weather-gate/${{ github.sha }}

on:
  push:
    branches:
      - fix/slot-aware-weather-email-gate

permissions:
  contents: write

concurrency:
  group: apply-slot-aware-weather-gate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PATCH_GZIP_B64: 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Decode and apply patch
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          target = Path('.feature/weather-gate-v2/patch.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_B64'])))
          PY
          python .feature/weather-gate-v2/patch.py
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Install Web dependencies
        working-directory: webapp
        run: npm ci
      - name: Refresh protected Web runtime lock
        working-directory: webapp
        run: npm run update:runtime-lock
      - name: Validate Web application
        run: |
          npm --prefix webapp test
          npm --prefix webapp run check:worker
          npm --prefix webapp run check:runtime
          npm --prefix webapp run build
      - name: Validate Python and release contracts
        run: |
          ruff check .
          ruff format --check --diff .
          PYTHONPATH=src pytest -m 'not airflow'
          PYTHONPATH=src python scripts/check_active_components.py
      - name: Remove one-shot patch assets
        run: |
          rm -rf .feature/weather-gate-v2
          rm -f .github/workflows/apply-slot-aware-weather-gate.yml
      - name: Commit final implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(webapp): make weather suppression slot-aware'
          git push origin HEAD:fix/slot-aware-weather-email-gate
