name: Isolated regression tooling
on:
  push:
    branches: [diag/dsh-free-readonly-20260907]
    paths: [.github/workflows/diagnostic-tooling.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --dest /tmp/wheels ruff==0.12.11 mypy==1.17.1 types-PyYAML types-requests psycopg2-binary==2.9.10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-lint-wheels
          path: /tmp/wheels
          retention-days: 1
