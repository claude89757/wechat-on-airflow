name: Format FFT integration

on:
  push:
    branches:
      - feat/fft-qianhai-release-v2
    paths:
      - .github/workflows/fft-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/fft-qianhai-release-v2
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format the two files reported by CI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.12.11
          ruff format \
            src/wechat_airflow/venues/pospal_venue.py \
            tests/pospal_venue_test.py
          ruff format --check \
            src/wechat_airflow/venues/pospal_venue.py \
            tests/pospal_venue_test.py
          rm -f .github/workflows/fft-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format FFT integration"
          git push origin HEAD:feat/fft-qianhai-release-v2
