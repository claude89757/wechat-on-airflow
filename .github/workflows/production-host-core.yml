name: Production Host Core

on:
  workflow_call:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: string
      target_commit:
        description: Exact full commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: choice
        options:
          - preflight
          - full-cutover
          - health
          - rollback
      target_commit:
        description: Exact full commit SHA; empty uses current main
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-host-core
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      target_commit: ${{ steps.resolve.outputs.target_commit }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          operation="$INPUT_OPERATION"
          target_commit="${INPUT_TARGET:-$(git rev-parse origin/main)}"
          [[ "$operation" =~ ^(preflight|full-cutover|health|rollback)$ ]]
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet origin main
          [[ "$(git rev-parse origin/main)" == "$target_commit" ]]
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"

  operate:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
      OPERATION: ${{ needs.resolve.outputs.operation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.target_commit }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require successful CI for exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/github_release_gate.py \
            --target-commit "$TARGET_COMMIT" \
            --required-check verify \
            --wait-seconds 1800 \
            --missing-check-wait-seconds 0 \
            --main-head-missing-check-wait-seconds 90 \
            --poll-seconds 10 \
            --format json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build exact edge artifact
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci
          npm run test
          npm run check:worker
          npm run build
          npx wrangler deploy --dry-run --outdir /tmp/zacks-edge-dry-run

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Prepare exact remote commit
        run: |
          set -euo pipefail
          ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            "set -euo pipefail; cd '$AIRFLOW_REPOSITORY_PATH'; \
             git fetch --prune origin main; \
             test -z \"\$(git status --porcelain --untracked-files=no)\"; \
             git checkout --detach '$TARGET_COMMIT'; \
             test \"\$(git rev-parse HEAD)\" = '$TARGET_COMMIT'"

      - name: Operate host core
        working-directory: webapp
        run: |
          set -euo pipefail

          remote() {
            local quoted=()
            local argument escaped
            for argument in "$@"; do
              printf -v escaped '%q' "$argument"
              quoted+=("$escaped")
            done
            ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
              "set -euo pipefail; cd '$AIRFLOW_REPOSITORY_PATH'; \
               DEPLOYMENT_COMMIT='$TARGET_COMMIT' python3 scripts/host_core_production.py \
               ${quoted[*]} --target-commit '$TARGET_COMMIT'"
          }

          deploy_edge() {
            local cutover="$1"
            local quiesce="$2"
            local migration="$3"
            local runtime_config=".wrangler-host-core-runtime.json"
            node - "$cutover" "$quiesce" "$migration" <<'NODE'
          const fs = require("node:fs");
          const [, , cutover, quiesce, migration] = process.argv;
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.vars = {
            ...(config.vars || {}),
            DEPLOYMENT_COMMIT: process.env.TARGET_COMMIT,
            HOST_CORE_CUTOVER: cutover,
            HOST_CORE_QUIESCE: quiesce,
            HOST_CORE_MIGRATION_ENABLED: migration,
          };
          fs.writeFileSync(
            ".wrangler-host-core-runtime.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE
            if ! npx wrangler deploy --config "$runtime_config"; then
              rm -f "$runtime_config"
              return 1
            fi
            rm -f "$runtime_config"
          }

          verify_public_edge() {
            PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
              --expected-commit "$TARGET_COMMIT" --format json
          }

          export_d1_snapshot() {
            local pass_name="$1"
            local sql_path="/tmp/zacks-d1-${pass_name}-${GITHUB_RUN_ID}.sql"
            local gzip_path="${sql_path}.gz"
            local log_path="/tmp/zacks-d1-${pass_name}-${GITHUB_RUN_ID}.log"
            rm -f "$sql_path" "$gzip_path" "$log_path"
            if ! npx wrangler d1 export zacks-tennis-alerts \
              --remote --output "$sql_path" --skip-confirmation \
              >"$log_path" 2>&1; then
              sed -E 's#https://[^ ]+#<redacted-url>#g' "$log_path" >&2
              return 1
            fi
            test -s "$sql_path"
            gzip -9 "$sql_path"
            local snapshot_sha
            snapshot_sha="$(sha256sum "$gzip_path" | cut -d' ' -f1)"
            local remote_dir="$AIRFLOW_REPOSITORY_PATH/.local/host-core-migration"
            local remote_path="$remote_dir/d1-${pass_name}-${snapshot_sha}.sql.gz"
            ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
              "install -d -m 0700 '$remote_dir'"
            scp -P "$AIRFLOW_SSH_PORT" "$gzip_path" \
              "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST:$remote_path"
            ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
              "chmod 0600 '$remote_path'; test -s '$remote_path'; \
               test \"\$(sha256sum '$remote_path' | cut -d' ' -f1)\" = '$snapshot_sha'"
            printf '%s|%s\n' "$remote_path" "$snapshot_sha"
          }

          if [[ "$OPERATION" == "full-cutover" ]]; then
            current_runtime="$(curl --silent --max-time 10 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.runtime // "unknown"' || true)"
            current_commit="$(curl --silent --max-time 10 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.deploymentCommit // "unknown"' || true)"
            current_owner="$(curl --silent --max-time 10 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.deliveryOwner // "unknown"' || true)"
            if [[ "$current_runtime" == "airflow-host" \
              && "$current_commit" == "$TARGET_COMMIT" \
              && "$current_owner" == "airflow_host" ]]; then
              remote health --include-public
              verify_public_edge
              exit 0
            fi
          fi

          case "$OPERATION" in
            preflight)
              remote preflight
              ;;
            health)
              remote health --include-public
              verify_public_edge
              ;;
            rollback)
              current_runtime="$(curl --silent --max-time 10 \
                https://zacks.claude89757.cc/api/healthz | jq -r '.runtime // "unknown"' || true)"
              if [[ "$current_runtime" == "airflow-host" ]]; then
                remote pause-host-delivery
                verify_public_edge
              else
                remote rollback
                deploy_edge false false false
                curl --fail --silent --show-error --max-time 15 \
                  https://zacks.claude89757.cc/api/healthz >/dev/null
              fi
              ;;
            full-cutover)
              rollback_required=false
              host_pause_required=false
              recover() {
                status=$?
                set +e
                if [[ "$host_pause_required" == "true" ]]; then
                  remote pause-host-delivery
                elif [[ "$rollback_required" == "true" ]]; then
                  remote rollback
                  deploy_edge false false false
                fi
                exit "$status"
              }
              trap recover ERR

              remote preflight
              rollback_required=true
              deploy_edge false false true
              remote sync-secrets
              remote deploy-shadow

              initial_snapshot="$(export_d1_snapshot initial)"
              IFS='|' read -r initial_path initial_sha <<< "$initial_snapshot"
              remote migrate-sql --pass-name initial \
                --sql-export "$initial_path" --snapshot-sha256 "$initial_sha"
              remote enable-dual

              # Natural Airflow observations seed PostgreSQL. No synthetic slot,
              # email, or WeChat delivery is generated for acceptance.
              sleep 180
              remote shadow-evidence

              deploy_edge false true true
              sleep 60
              final_snapshot="$(export_d1_snapshot final)"
              IFS='|' read -r final_path final_sha <<< "$final_snapshot"
              remote migrate-sql --pass-name final \
                --sql-export "$final_path" --snapshot-sha256 "$final_sha"
              remote prepare-cutover

              # Route and verify the public API while local delivery is stopped.
              deploy_edge true false false
              verify_public_edge

              rollback_required=false
              host_pause_required=true
              remote cutover
              remote health --include-public
              verify_public_edge
              host_pause_required=false
              trap - ERR
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 2
              ;;
          esac

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Production Host Core"
            echo "- Operation: \`$OPERATION\`"
            echo "- Target commit: \`$TARGET_COMMIT\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- D1 migration source: control-plane SQL export"
            echo "- Real test notifications: none"
          } >> "$GITHUB_STEP_SUMMARY"
