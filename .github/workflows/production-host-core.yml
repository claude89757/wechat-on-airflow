name: Production Host Core

on:
  workflow_call:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: string
      target_commit:
        description: Exact full commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: choice
        options:
          - preflight
          - full-cutover
          - health
          - rollback
      target_commit:
        description: Exact full commit SHA; empty uses current main
        required: false
        type: string
  schedule:
    - cron: "5 0 4 9 *"
    - cron: "25 0 4 9 *"

permissions:
  contents: read
  checks: read

concurrency:
  group: production-host-core
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      target_commit: ${{ steps.resolve.outputs.target_commit }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$(date -u +%F)" != "2026-09-04" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "operation=health" >> "$GITHUB_OUTPUT"
              echo "target_commit=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            operation=full-cutover
            target_commit="$(git rev-parse origin/main)"
          else
            operation="$INPUT_OPERATION"
            target_commit="${INPUT_TARGET:-$(git rev-parse origin/main)}"
          fi
          [[ "$operation" =~ ^(preflight|full-cutover|health|rollback)$ ]]
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse origin/main)" == "$target_commit" ]]
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"

  operate:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
      OPERATION: ${{ needs.resolve.outputs.operation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.target_commit }}
          fetch-depth: 0

      - name: Require successful CI for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            result="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_COMMIT}/check-runs" \
              --jq '[.check_runs[] | select(.name == "verify") | .conclusion] | last // "pending"')"
            if [[ "$result" == "success" ]]; then
              exit 0
            fi
            if [[ "$result" =~ ^(failure|cancelled|timed_out|action_required|stale)$ ]]; then
              echo "CI / verify concluded $result" >&2
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for CI / verify" >&2
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build exact edge artifact
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci
          npm run test
          npm run check:worker
          npm run build
          npx wrangler deploy --dry-run --outdir /tmp/zacks-edge-dry-run

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Prepare exact remote commit
        run: |
          set -euo pipefail
          ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            "set -euo pipefail; cd '$AIRFLOW_REPOSITORY_PATH'; \
             git fetch --prune origin main; \
             test -z \"\$(git status --porcelain)\"; \
             git checkout --detach '$TARGET_COMMIT'; \
             test \"\$(git rev-parse HEAD)\" = '$TARGET_COMMIT'"

      - name: Operate host core
        working-directory: webapp
        run: |
          set -euo pipefail

          remote() {
            local quoted=()
            local argument escaped
            for argument in "$@"; do
              printf -v escaped '%q' "$argument"
              quoted+=("$escaped")
            done
            ssh -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
              "set -euo pipefail; cd '$AIRFLOW_REPOSITORY_PATH'; \
               DEPLOYMENT_COMMIT='$TARGET_COMMIT' python scripts/host_core_production.py \
               ${quoted[*]} --target-commit '$TARGET_COMMIT'"
          }

          deploy_edge() {
            local cutover="$1"
            local quiesce="$2"
            local migration="$3"
            local runtime_config=".wrangler-host-core-runtime.json"
            node - "$cutover" "$quiesce" "$migration" <<'NODE'
          const fs = require("node:fs");
          const [, , cutover, quiesce, migration] = process.argv;
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.vars = {
            ...(config.vars || {}),
            DEPLOYMENT_COMMIT: process.env.TARGET_COMMIT,
            HOST_CORE_CUTOVER: cutover,
            HOST_CORE_QUIESCE: quiesce,
            HOST_CORE_MIGRATION_ENABLED: migration,
          };
          fs.writeFileSync(
            ".wrangler-host-core-runtime.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE
            if ! npx wrangler deploy --config "$runtime_config"; then
              rm -f "$runtime_config"
              return 1
            fi
            rm -f "$runtime_config"
          }

          verify_public_edge() {
            PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
              --expected-commit "$TARGET_COMMIT" --format json
          }

          if [[ "$OPERATION" == "full-cutover" ]]; then
            current_runtime="$(curl --silent --max-time 10 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.runtime // "unknown"' || true)"
            current_commit="$(curl --silent --max-time 10 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.deploymentCommit // "unknown"' || true)"
            if [[ "$current_runtime" == "airflow-host" && "$current_commit" == "$TARGET_COMMIT" ]]; then
              remote health --include-public
              verify_public_edge
              exit 0
            fi
          fi

          case "$OPERATION" in
            preflight)
              remote preflight
              ;;
            health)
              remote health --include-public
              verify_public_edge
              ;;
            rollback)
              remote rollback
              deploy_edge false false false
              remote health
              ;;
            full-cutover)
              remote preflight
              deploy_edge false false true
              remote deploy-shadow
              remote sync-secrets
              remote migrate --pass-name initial
              remote enable-dual

              # Let natural venue schedules seed the local state. No synthetic
              # slot, email, or WeChat delivery is generated for acceptance.
              sleep 180
              remote shadow-evidence

              rollback_required=true
              recover() {
                status=$?
                if [[ "$rollback_required" == "true" ]]; then
                  set +e
                  remote rollback
                  deploy_edge false false false
                fi
                exit "$status"
              }
              trap recover ERR

              deploy_edge false true true
              sleep 60
              remote migrate --pass-name final
              remote cutover
              deploy_edge true false false
              remote health --include-public
              verify_public_edge
              rollback_required=false
              trap - ERR
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 2
              ;;
          esac

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Production Host Core"
            echo "- Operation: \`$OPERATION\`"
            echo "- Target commit: \`$TARGET_COMMIT\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Real test notifications: none"
          } >> "$GITHUB_STEP_SUMMARY"
