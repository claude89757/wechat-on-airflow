name: Production Host Core

on:
  workflow_call:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: string
      target_commit:
        description: Exact full commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Host-core lifecycle operation
        required: true
        type: choice
        options:
          - preflight
          - full-cutover
          - routine-upgrade
          - health
          - activate-workers
          - acceptance
          - pause
      target_commit:
        description: Exact full commit SHA; empty uses current main
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-host-core
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      target_commit: ${{ steps.resolve.outputs.target_commit }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          operation="$INPUT_OPERATION"
          target_commit="${INPUT_TARGET:-$(git rev-parse origin/main)}"
          [[ "$operation" =~ ^(preflight|full-cutover|routine-upgrade|health|activate-workers|acceptance|pause)$ ]]
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet origin main
          [[ "$(git rev-parse origin/main)" == "$target_commit" ]]
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"

  operate:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      TARGET_COMMIT: ${{ needs.resolve.outputs.target_commit }}
      OPERATION: ${{ needs.resolve.outputs.operation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.target_commit }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and validate runner operations dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          PYTHONPATH=scripts python scripts/webapp_production_health.py --help >/dev/null

      - name: Require successful CI for exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/github_release_gate.py \
            --target-commit "$TARGET_COMMIT" \
            --required-check verify \
            --wait-seconds 1800 \
            --missing-check-wait-seconds 0 \
            --main-head-missing-check-wait-seconds 90 \
            --poll-seconds 10 \
            --format json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build exact edge artifact
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci
          npm run test
          npm run check:worker
          npm run build
          npx wrangler deploy --dry-run --outdir /tmp/zacks-edge-dry-run

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Prepare exact remote commit
        id: prepare_remote
        run: |
          set -euo pipefail
          prepared="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes \
            -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            "bash -s -- '$AIRFLOW_REPOSITORY_PATH' '$TARGET_COMMIT' '$OPERATION'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          target="$2"
          operation="$3"
          previous="$(git rev-parse HEAD)"
          live=none
          if [[ "$operation" == routine-upgrade ]]; then
            live="$(docker compose exec -T zacks-api python -c 'import os; print(os.environ.get("DEPLOYMENT_COMMIT", "unknown"))' </dev/null)"
            [[ "$live" =~ ^[0-9a-f]{40}$ ]]
          fi
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=no)"
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          printf '%s %s\n' "$previous" "$live"
          REMOTE
          )"
          read -r previous_commit live_commit <<<"$prepared"
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "previous_commit=$previous_commit" >> "$GITHUB_OUTPUT"
          echo "live_commit=$live_commit" >> "$GITHUB_OUTPUT"

      - name: Operate host core
        working-directory: webapp
        run: bash ../scripts/host_core_release.sh

      - name: Restore source after rejected routine preflight
        if: failure() && inputs.operation == 'routine-upgrade' && steps.prepare_remote.outputs.previous_commit != ''
        env:
          PREVIOUS_COMMIT: ${{ steps.prepare_remote.outputs.previous_commit }}
          LIVE_COMMIT: ${{ steps.prepare_remote.outputs.live_commit }}
        run: |
          set -euo pipefail
          if grep -Fq '"event": "host_runtime_mutation_started"' /tmp/host-core-prepare.log 2>/dev/null; then
            echo 'Runtime mutation started; source-only restoration is unsafe and was skipped.'
            exit 0
          fi
          [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LIVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            "bash -s -- '$AIRFLOW_REPOSITORY_PATH' '$TARGET_COMMIT' '$PREVIOUS_COMMIT' '$LIVE_COMMIT'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          target="$2"
          previous="$3"
          live="$4"
          test "$(git rev-parse HEAD)" = "$target"
          test -z "$(git status --porcelain --untracked-files=no)"
          # A missing runner marker alone is not proof: SSH may have lost output.
          # Compare actual runtime with its own baseline, not the worktree SHA.
          docker compose exec -T zacks-api python - "$live" <<'PY'
          import os
          import sys
          from wechat_airflow.host_core.control import runtime_state
          state = runtime_state()
          assert os.environ.get("DEPLOYMENT_COMMIT") == sys.argv[1], "live runtime changed"
          assert state.get("delivery_enabled") is True, "delivery baseline changed"
          assert state.get("wechat_enabled") is True, "WeChat baseline changed"
          PY
          git checkout --quiet --detach "$previous"
          test "$(git rev-parse HEAD)" = "$previous"
          echo 'Rejected preflight: previous source identity restored; live services untouched.'
          REMOTE

      - name: Publish sanitized acceptance evidence
        if: always() && inputs.operation == 'acceptance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-core-acceptance-${{ inputs.target_commit }}
          path: /tmp/host-core-business-health.log
          retention-days: 30
          if-no-files-found: error

      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Production Host Core'
            echo '- Operation: `${{ inputs.operation }}`'
            echo '- Commit: `${{ inputs.target_commit }}`'
            echo '- Result: `${{ job.status }}`'
            echo '- Legacy runtime: removed; failure recovery pauses Host Core'
            echo '- D1: preserved, unbound from the final Worker'
            echo '- Synthetic real notifications: none'
          } >> "$GITHUB_STEP_SUMMARY"
