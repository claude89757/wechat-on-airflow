name: Court Studio settled public UI audit
on:
  push:
    branches: [ops/court-studio-settled-audit-20260906]
    paths:
      - .github/workflows/court-studio-settled-audit.yml
      - webapp/qa/settled-public-audit.mjs
permissions:
  contents: read
concurrency:
  group: court-studio-settled-public-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'claude89757/wechat-on-airflow' && github.ref == 'refs/heads/ops/court-studio-settled-audit-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install isolated browser tools
        working-directory: webapp
        run: npm ci && npx playwright install --with-deps chromium
      - name: Verify settled public UI without production credentials or writes
        working-directory: webapp
        run: node qa/settled-public-audit.mjs
      - name: Archive public visual audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: court-studio-settled-public-26511a3
          path: webapp/settled-qa-output/
          retention-days: 30
          if-no-files-found: error
