name: One-time live production status audit

on:
  push:
    branches:
      - ops/live-status-audit-20260904

permissions:
  contents: read

concurrency:
  group: one-time-live-production-status-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Inspect Airflow host, venue DAGs, WeChat and host core
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            bash -s -- "$AIRFLOW_REPOSITORY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          compose() {
            if docker compose version >/dev/null 2>&1; then docker compose "$@";
            else docker-compose "$@"; fi
          }
          api_service="$(compose ps --services --status running | awk '/^airflow-api-server$|^web$/{print; exit}')"

          echo '__HOST_COMMIT__'
          git rev-parse HEAD
          echo '__COMPOSE_PS__'
          compose ps --format json || true
          echo '__LOCAL_HOST_CORE_HEALTH__'
          for path in /zacks-api/api/healthz /zacks-api/api/readyz; do
            code="$(curl -sS --max-time 8 -o /tmp/zacks-audit-body -w '%{http_code}' "http://127.0.0.1:8090${path}" || true)"
            body="$(head -c 2000 /tmp/zacks-audit-body 2>/dev/null || true)"
            printf '{"path":"%s","http":%s,"body":%s}\n' "$path" "${code:-0}" "$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' <<<"$body")"
          done

          echo '__AIRFLOW_LIVE_STATE__'
          compose exec -T "$api_service" python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          import yaml
          from airflow.models.dagrun import DagRun
          from airflow.models.variable import Variable
          from airflow.utils.session import create_session

          now = datetime.now(UTC)
          manifest_path = Path('/opt/airflow/project/config/active-components.yaml')
          if not manifest_path.exists():
              manifest_path = Path('/opt/airflow/config/active-components.yaml')
          manifest = yaml.safe_load(manifest_path.read_text(encoding='utf-8'))
          components = [item for item in manifest.get('active_dags', []) if isinstance(item, dict)]
          dag_ids = [str(item.get('dag_id') or '') for item in components if item.get('dag_id')]

          def iso(value):
              if value is None:
                  return None
              if value.tzinfo is None:
                  value = value.replace(tzinfo=UTC)
              return value.astimezone(UTC).isoformat()

          def age_minutes(value):
              if value is None:
                  return None
              if value.tzinfo is None:
                  value = value.replace(tzinfo=UTC)
              return round((now - value.astimezone(UTC)).total_seconds() / 60, 2)

          details = []
          with create_session() as session:
              for dag_id in dag_ids:
                  runs = (
                      session.query(DagRun)
                      .filter(DagRun.dag_id == dag_id)
                      .order_by(DagRun.id.desc())
                      .limit(12)
                      .all()
                  )
                  latest = runs[0] if runs else None
                  latest_success = next((run for run in runs if str(run.state).lower() == 'success'), None)
                  latest_failure = next((run for run in runs if str(run.state).lower() == 'failed'), None)
                  success_time = (
                      latest_success.end_date or latest_success.start_date or latest_success.logical_date
                      if latest_success else None
                  )
                  failure_time = (
                      latest_failure.end_date or latest_failure.start_date or latest_failure.logical_date
                      if latest_failure else None
                  )
                  details.append({
                      'dag_id': dag_id,
                      'latest_state': str(latest.state) if latest else None,
                      'latest_run_at': iso(latest.start_date or latest.logical_date) if latest else None,
                      'last_success_at': iso(success_time),
                      'last_success_age_minutes': age_minutes(success_time),
                      'last_failure_at': iso(failure_time),
                      'recent_failure_30m': bool(
                          failure_time and age_minutes(failure_time) is not None and age_minutes(failure_time) <= 30
                      ),
                  })

          stale = [item for item in details if item['last_success_age_minutes'] is None or item['last_success_age_minutes'] > 10]
          failed = [item for item in details if item['recent_failure_30m']]

          try:
              fallback = Variable.get('WECHAT_SEND_FALLBACK_OUTBOX', default_var=[], deserialize_json=True)
          except Exception:
              fallback = None
          recent_wechat_failures = 0
          latest_wechat_failure = None
          if isinstance(fallback, list):
              cutoff = now - timedelta(hours=24)
              for item in fallback:
                  if not isinstance(item, dict):
                      continue
                  raw = item.get('last_failed_at')
                  try:
                      when = datetime.fromisoformat(str(raw)).astimezone(UTC)
                  except Exception:
                      continue
                  if when >= cutoff:
                      recent_wechat_failures += 1
                      latest_wechat_failure = max(latest_wechat_failure or when, when)

          latest_wechat_success = None
          latest_wechat_success_line = None
          log_root = Path('/opt/airflow/logs')
          if log_root.exists():
              for path in log_root.rglob('*.log'):
                  try:
                      stat = path.stat()
                  except OSError:
                      continue
                  if datetime.fromtimestamp(stat.st_mtime, UTC) < now - timedelta(hours=48):
                      continue
                  try:
                      with path.open('rb') as handle:
                          handle.seek(max(0, stat.st_size - 250_000))
                          text_value = handle.read().decode('utf-8', errors='replace')
                  except OSError:
                      continue
                  lines = [line for line in text_value.splitlines() if '[WECHAT_SEND_API] sent' in line]
                  if not lines:
                      continue
                  when = datetime.fromtimestamp(stat.st_mtime, UTC)
                  if latest_wechat_success is None or when > latest_wechat_success:
                      latest_wechat_success = when
                      latest_wechat_success_line = re.sub(r'receiver=[^, ]+', 'receiver=***', lines[-1])[-500:]

          variables = {}
          for name in (
              'WEBAPP_OBSERVATION_API_URL',
              'ZACKS_DELIVERY_OWNER',
              'ZACKS_OBSERVATION_MODE',
              'ZACKS_WECHAT_GATE_SOURCE',
              'WEBAPP_WECHAT_SUBSCRIPTION_GATE_MODE',
          ):
              variables[name] = str(Variable.get(name, default_var='') or '')

          print(json.dumps({
              'checked_at': now.isoformat(),
              'expected_dag_count': len(dag_ids),
              'fresh_success_10m_count': len(details) - len(stale),
              'stale_or_missing_10m_count': len(stale),
              'recent_failed_dag_count_30m': len(failed),
              'stale_or_missing': stale,
              'recent_failed': failed,
              'latest_success_overall': max((item['last_success_at'] for item in details if item['last_success_at']), default=None),
              'dag_details': details,
              'variables': variables,
              'wechat': {
                  'fallback_outbox_valid': isinstance(fallback, list),
                  'fallback_outbox_count': len(fallback) if isinstance(fallback, list) else None,
                  'recent_failure_entries_24h': recent_wechat_failures,
                  'latest_failure_at': iso(latest_wechat_failure),
                  'latest_success_log_mtime': iso(latest_wechat_success),
                  'latest_success_line_redacted': latest_wechat_success_line,
              },
          }, ensure_ascii=False, sort_keys=True))
          PY
          REMOTE

      - name: Probe public endpoints
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://zacks.claude89757.cc'
          result = {}
          for path in ('/', '/api/healthz', '/api/readyz', '/api/edge-healthz', '/api/bootstrap'):
              request = urllib.request.Request(base + path, headers={'User-Agent': 'zacks-live-audit/1'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(200000)
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(200000)
              except Exception as exc:
                  result[path] = {'http': 0, 'error': type(exc).__name__, 'detail': str(exc)[:200]}
                  continue
              text = raw.decode('utf-8', errors='replace')
              parsed = None
              if path.startswith('/api/'):
                  try:
                      parsed = json.loads(text)
                  except Exception:
                      parsed = None
              if path == '/api/bootstrap' and isinstance(parsed, dict):
                  parsed = {
                      'dataStatus': parsed.get('dataStatus'),
                      'metrics': parsed.get('metrics'),
                      'venues': [
                          {
                              'id': item.get('id'),
                              'healthy': item.get('healthy'),
                              'lastInspectionAt': item.get('lastInspectionAt'),
                          }
                          for item in parsed.get('venues', []) if isinstance(item, dict)
                      ],
                  }
              result[path] = {'http': status, 'json': parsed, 'body_prefix': None if parsed is not None else text[:300]}
          print('__PUBLIC_ENDPOINTS__')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Inspect last email delivery and D1 venue state
        working-directory: webapp
        run: |
          set -euo pipefail
          npm ci >/dev/null
          echo '__D1_EMAIL_LATEST__'
          set +e
          npx wrangler d1 execute zacks-tennis-alerts --remote --json --command "
          SELECT provider_submitted_at, provider_delivered_at, status, provider_status
          FROM notification_outbox
          WHERE provider_submitted_at IS NOT NULL
          ORDER BY provider_submitted_at DESC
          LIMIT 1;
          "
          email_rc=$?
          echo "D1_EMAIL_QUERY_RC=$email_rc"
          echo '__D1_VENUE_LATEST__'
          npx wrangler d1 execute zacks-tennis-alerts --remote --json --command "
          SELECT venue_id, healthy, last_inspection_at, last_notification_at
          FROM venue_status
          ORDER BY last_inspection_at DESC
          LIMIT 26;
          "
          venue_rc=$?
          echo "D1_VENUE_QUERY_RC=$venue_rc"
          exit 0
