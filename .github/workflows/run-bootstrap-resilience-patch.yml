name: Run bootstrap resilience patch

on:
  push:
    branches:
      - fix/bootstrap-degraded-fallback-2026-09-03
    paths:
      - .github/workflows/run-bootstrap-resilience-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/bootstrap-degraded-fallback-2026-09-03
          fetch-depth: 0
      - name: Execute staged patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-bootstrap-resilience-patch.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, str(workflow), "exec"), {})
          Path(".github/workflows/run-bootstrap-resilience-patch.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): preserve last dashboard during D1 outages"
          git push origin HEAD:fix/bootstrap-degraded-fallback-2026-09-03
