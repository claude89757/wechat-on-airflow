name: Idempotent v0.7.0 host-core release recovery

on:
  push:
    branches:
      - feat/airflow-host-core-v0.7.0-final3

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-time-v070-host-core-finalizer
  cancel-in-progress: true

jobs:
  recover-and-finalize:
    if: github.repository_owner == 'claude89757'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/airflow-host-core-v0.7.0-final3
      PR_NUMBER: "188"
      RELEASE_TAG: "0.7.0"
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0

      - name: Normalize and test the acceptance additions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff check --fix \
            scripts/host_core_release_acceptance.py \
            tests/host_core_release_acceptance_test.py
          ruff format \
            scripts/host_core_release_acceptance.py \
            tests/host_core_release_acceptance_test.py
          PYTHONPATH=src pytest -q tests/host_core_release_acceptance_test.py

      - name: Remove one-time automation from the releasable branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for path in \
            .github/workflows/host-core-v070-autofinalize.yml \
            .github/workflows/host-core-v070-autofinalize-v2.yml; do
            if [[ -e "$path" ]]; then
              git rm "$path"
            fi
          done
          git add \
            scripts/host_core_release_acceptance.py \
            tests/host_core_release_acceptance_test.py
          if ! git diff --cached --quiet; then
            git commit -m "ci: finalize v0.7.0 release inputs"
            git push origin "HEAD:$FEATURE_BRANCH"
          fi
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Define exact-SHA workflow helpers
        run: |
          cat > /tmp/v070-functions.sh <<'BASH'
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local ref="$2"
            local expected_sha="$3"
            shift 3
            local started_at run_json run_id deadline
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --ref "$ref" "$@"
            deadline=$((SECONDS + 2700))
            run_json=""
            while (( SECONDS < deadline )); do
              run_json="$(
                gh run list \
                  --workflow "$workflow" \
                  --branch "$ref" \
                  --event workflow_dispatch \
                  --limit 40 \
                  --json databaseId,headSha,createdAt,status,conclusion \
                | jq -c \
                    --arg sha "$expected_sha" \
                    --arg started "$started_at" \
                    '[.[] | select(.headSha == $sha and .createdAt >= $started)]
                     | sort_by(.createdAt)
                     | last // empty'
              )"
              if [[ -n "$run_json" ]]; then
                break
              fi
              sleep 5
            done
            if [[ -z "$run_json" ]]; then
              echo "Timed out locating $workflow for $expected_sha" >&2
              return 1
            fi
            run_id="$(jq -r .databaseId <<<"$run_json")"
            echo "Watching $workflow run $run_id for $expected_sha"
            gh run watch "$run_id" --exit-status
            gh run view "$run_id" --json databaseId,headSha,status,conclusion,url \
              | tee "/tmp/${workflow//\//_}-${expected_sha}.json"
          }
          BASH

      - name: Resolve and merge the exact tested application commit
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)"
          if [[ "$pr_state" == open ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$CLEAN_HEAD"
            dispatch_and_wait ci.yml "$FEATURE_BRANCH" "$CLEAN_HEAD"
            response="$(
              gh api \
                --method PUT \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
                -f sha="$CLEAN_HEAD" \
                -f merge_method=merge \
                -f commit_title="feat: move notification core to the Airflow host (#188)" \
                -f commit_message="Promote PostgreSQL on the Airflow host to the durable notification core and retain Cloudflare as a stateless edge with a reversible D1 rollback window."
            )"
            jq -e '.merged == true and (.sha | length == 40)' <<<"$response"
          elif [[ "$pr_merged" != true ]]; then
            echo "PR #$PR_NUMBER is closed without merge" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$main_sha"
          version="$(git show origin/main:pyproject.toml | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          test "$version" = "$RELEASE_TAG"
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Revalidate the exact main commit
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          dispatch_and_wait ci.yml main "$MAIN_SHA"

      - name: Execute or resume the protected production cutover
        run: |
          set -euo pipefail
          source /tmp/v070-functions.sh
          dispatch_and_wait \
            production-host-core.yml \
            main \
            "$MAIN_SHA" \
            -f operation=full-cutover \
            -f target_commit="$MAIN_SHA"

      - name: Accept three advancing natural production cycles
        run: |
          set -euo pipefail
          python scripts/host_core_release_acceptance.py \
            --expected-commit "$MAIN_SHA" \
            --cycles 3 \
            --interval-seconds 90 \
            --freshness-minutes 20 \
            --output /tmp/v070-acceptance.json

      - name: Create or verify the immutable release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            test "$tag_target" = "$MAIN_SHA"
          else
            git show origin/main:CHANGELOG.md > /tmp/v070-changelog.md
            python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/v070-changelog.md").read_text(encoding="utf-8")
          marker = "## [0.7.0]"
          start = text.index(marker)
          remainder = text[start:]
          next_heading = remainder.find("\n## [", len(marker))
          notes = remainder if next_heading < 0 else remainder[:next_heading]
          Path("/tmp/v070-release-notes.md").write_text(
              notes.strip() + "\n",
              encoding="utf-8",
          )
          PY
            gh release create "$RELEASE_TAG" \
              --target "$MAIN_SHA" \
              --title "0.7.0 — Airflow host notification core" \
              --notes-file /tmp/v070-release-notes.md
          fi

      - name: Publish authoritative production evidence
        run: |
          set -euo pipefail
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          production_run="$(
            gh run list \
              --workflow production-host-core.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json headSha,conclusion,url \
            | jq -r --arg sha "$MAIN_SHA" \
                '[.[] | select(.headSha == $sha and .conclusion == "success")] | first | .url'
          )"
          {
            echo "### v0.7.0 host-core production acceptance"
            echo "- Main commit: \`$MAIN_SHA\`"
            echo "- Production workflow: $production_run"
            echo "- Release: $release_url"
            echo "- Natural acceptance cycles: 3"
            echo "- Synthetic email/WeChat notifications: none"
            echo
            echo '```json'
            cat /tmp/v070-acceptance.json
            echo '```'
          } | tee /tmp/v070-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file /tmp/v070-acceptance-summary.md

      - name: Report a safe-stop failure
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "v0.7.0 guarded finalization stopped safely. No release was created by this run. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
