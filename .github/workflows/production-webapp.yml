name: Production Web Application
run-name: production/webapp/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation
        required: true
        type: choice
        options:
          - health
          - deploy_preflight
          - deploy_apply
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      request_id:
        description: Unique request correlation ID
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-webapp-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - name: Validate exact target
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.operation != 'health'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install health-check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install Web application dependencies
        if: inputs.operation != 'health'
        working-directory: webapp
        run: npm ci
      - name: Prepare read-only browser acceptance
        if: inputs.operation == 'deploy_apply'
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: Validate Cloudflare deployment identity
        if: inputs.operation != 'health'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Execute protected operation
        working-directory: webapp
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail

          require_existing_host_cutover() {
            local runtime
            runtime="$(curl --fail --silent --show-error --max-time 15 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.runtime // "unknown"')"
            if [[ "$runtime" != "airflow-host" ]]; then
              echo "The initial stateless-edge cutover must use Production Host Core." >&2
              return 1
            fi
          }
          case "$OPERATION" in
            health)
              PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_preflight|deploy_apply)
              npm run build
              require_existing_host_cutover
              node - <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.d1_databases?.length || config.triggers?.crons?.length) throw new Error('Production edge must not own D1 or Cron');
          config.vars={...(config.vars||{}),DEPLOYMENT_COMMIT:process.env.TARGET_COMMIT};
          fs.writeFileSync('.wrangler-stateless-edge-runtime.json',JSON.stringify(config));
          NODE
              trap 'rm -f .wrangler-stateless-edge-runtime.json' EXIT
              if [[ "$OPERATION" == deploy_preflight ]]; then
                npx wrangler deploy --dry-run --config .wrangler-stateless-edge-runtime.json
              else
                npx wrangler deploy --config .wrangler-stateless-edge-runtime.json \
                  --message "GitHub Host Core edge $TARGET_COMMIT"
                PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
                  --expected-commit "$TARGET_COMMIT" --format json
              fi
              ;;
            *) exit 2 ;;
          esac
          echo 'Persistence: PostgreSQL on the Airflow host; no legacy runtime or D1 binding.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public Court Studio UI without real sends
        if: inputs.operation == 'deploy_apply'
        working-directory: webapp
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: node qa/public-acceptance.mjs "$TARGET_COMMIT"
      - name: Archive public browser evidence
        if: always() && inputs.operation == 'deploy_apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: court-studio-public-${{ inputs.target_commit }}
          path: webapp/qa-output/
          retention-days: 30
          if-no-files-found: warn
