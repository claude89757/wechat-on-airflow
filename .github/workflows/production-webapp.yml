name: Production Web Application
run-name: production/webapp/${{ inputs.operation }}/${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation
        required: true
        type: choice
        options:
          - health
          - deploy_preflight
          - deploy_apply
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      request_id:
        description: Unique request correlation ID
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-webapp-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - name: Validate exact target
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.operation != 'health'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install health-check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install Web application dependencies
        if: inputs.operation != 'health'
        working-directory: webapp
        run: npm ci
      - name: Validate Cloudflare deployment identity
        if: inputs.operation != 'health'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Execute protected operation
        working-directory: webapp
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail

          d1_quota_exhausted() {
            grep -Eq "exceeded D1's free tier daily row read limit|\[code: 7500\]" <<<"$1"
          }

          run_d1_command() {
            local description="$1"
            shift
            local output status
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if d1_quota_exhausted "$output"; then
              echo "::warning title=D1 free-tier quota exhausted::$description deferred until the UTC reset; only the quota-specific error was tolerated."
              return 75
            fi
            echo "Unexpected D1 failure during: $description" >&2
            return "$status"
          }

          stateless_edge=false
          if grep -Fq '"main": "./cloudflare/edge-entry.ts"' wrangler.jsonc; then
            stateless_edge=true
          fi

          require_existing_host_cutover() {
            local runtime
            runtime="$(curl --fail --silent --show-error --max-time 15 \
              https://zacks.claude89757.cc/api/healthz | jq -r '.runtime // "unknown"')"
            if [[ "$runtime" != "airflow-host" ]]; then
              echo "The initial stateless-edge cutover must use Production Host Core." >&2
              return 1
            fi
          }

          write_edge_runtime_config() {
            node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.vars = {
            ...(config.vars || {}),
            DEPLOYMENT_COMMIT: process.env.TARGET_COMMIT,
            HOST_CORE_CUTOVER: "true",
            HOST_CORE_QUIESCE: "false",
            HOST_CORE_MIGRATION_ENABLED: "false",
          };
          fs.writeFileSync(
            ".wrangler-stateless-edge-runtime.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE
          }

          migration_state=not_requested
          case "$OPERATION" in
            health)
              PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
                --expected-commit "$TARGET_COMMIT" --format json
              ;;
            deploy_preflight)
              npm run build
              if [[ "$stateless_edge" == true ]]; then
                require_existing_host_cutover
                write_edge_runtime_config
                npx wrangler deploy --dry-run \
                  --config .wrangler-stateless-edge-runtime.json
                rm -f .wrangler-stateless-edge-runtime.json
                migration_state=host_core_edge
              else
                npx wrangler deploy --dry-run \
                  --var "DEPLOYMENT_COMMIT:$TARGET_COMMIT"
                if run_d1_command \
                  "remote migration preflight" \
                  npx wrangler d1 migrations list zacks-tennis-alerts --remote; then
                  migration_state=available
                else
                  status=$?
                  test "$status" -eq 75
                  migration_state=deferred_quota
                fi
              fi
              ;;
            deploy_apply)
              npm run build
              if [[ "$stateless_edge" == true ]]; then
                require_existing_host_cutover
                write_edge_runtime_config
                if ! npx wrangler deploy \
                  --config .wrangler-stateless-edge-runtime.json \
                  --message "GitHub stateless edge release $TARGET_COMMIT"; then
                  rm -f .wrangler-stateless-edge-runtime.json
                  exit 1
                fi
                rm -f .wrangler-stateless-edge-runtime.json
                migration_state=host_core_edge
                PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
                  --expected-commit "$TARGET_COMMIT" --format json
              else
                npx wrangler deploy --dry-run \
                  --var "DEPLOYMENT_COMMIT:$TARGET_COMMIT"
                if run_d1_command \
                  "remote migration listing" \
                  npx wrangler d1 migrations list zacks-tennis-alerts --remote; then
                  if run_d1_command \
                    "remote migration apply" \
                    npx wrangler d1 migrations apply zacks-tennis-alerts --remote; then
                    migration_state=applied
                  else
                    status=$?
                    test "$status" -eq 75
                    migration_state=deferred_quota
                  fi
                else
                  status=$?
                  test "$status" -eq 75
                  migration_state=deferred_quota
                fi

                npx wrangler deploy \
                  --message "GitHub release $TARGET_COMMIT" \
                  --var "DEPLOYMENT_COMMIT:$TARGET_COMMIT"

                if [ "$migration_state" = applied ]; then
                  PYTHONPATH=../scripts python ../scripts/webapp_production_health.py \
                    --expected-commit "$TARGET_COMMIT" --format json
                else
                  PYTHONPATH=../scripts python ../scripts/webapp_deployment_identity.py \
                    --expected-commit "$TARGET_COMMIT" --format json
                fi
              fi
              ;;
            *)
              exit 2
              ;;
          esac

          {
            echo "## Web persistence state"
            echo
            echo "- State: \`$migration_state\`"
            if [ "$migration_state" = deferred_quota ]; then
              echo "- Recovery: the deployed legacy Worker will idempotently create the same indexes on the first natural observation or cron after D1 accepts queries again."
            fi
            if [ "$migration_state" = host_core_edge ]; then
              echo "- Persistence: PostgreSQL on the Airflow host; Cloudflare deployment is stateless."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
