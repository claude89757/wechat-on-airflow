name: Apply Web UX Source Patch

on:
  push:
    branches:
      - fix/web-ux-refresh-a11y-20260830

permissions:
  contents: write

concurrency:
  group: apply-web-ux-source-patch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[web-ux-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/web-ux-refresh-a11y-20260830
          fetch-depth: 0

      - name: Apply deterministic source updates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_web_ux_patch.mjs")
          source = path.read_text(encoding="utf-8")
          before = '  await page.route(`**/api/subscriptions/${subscriptionId}`, async (route) => {'
          after = '  await page.route("**/api/subscriptions/" + subscriptionId, async (route) => {'
          if before not in source:
              raise SystemExit("nested template route target not found")
          path.write_text(source.replace(before, after, 1), encoding="utf-8")
          PY
          node scripts/apply_web_ux_patch.mjs

      - name: Validate patch shape
        run: |
          git diff --check
          test -n "$(git status --short)"

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp tests
          git commit -m "fix(web): polish refresh, metrics, cancellation and accessibility [web-ux-patched]"
          git push origin HEAD:fix/web-ux-refresh-a11y-20260830
