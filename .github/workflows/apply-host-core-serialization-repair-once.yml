name: Apply Host Core serialization repair once

on:
  push:
    branches:
      - fix/host-core-subscription-serialization-v070

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/host-core-subscription-serialization-v070
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply deterministic repair
        env:
          PATCH_SCRIPT_ZLIB_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib

          payload = base64.b64decode(os.environ["PATCH_SCRIPT_ZLIB_B64"])
          script = zlib.decompress(payload).decode("utf-8")
          exec(compile(script, "/tmp/apply-repair.py", "exec"))
          PY

      - name: Run focused credential-free checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff format \
            src/wechat_airflow/host_core/api.py \
            src/wechat_airflow/notifications/webapp.py \
            scripts/host_core_production.py \
            tests/host_core_subscription_creation_test.py \
            tests/host_core_cutover_safety_test.py
          ruff check \
            src/wechat_airflow/host_core/api.py \
            src/wechat_airflow/notifications/webapp.py \
            scripts/host_core_production.py \
            tests/host_core_subscription_creation_test.py \
            tests/host_core_cutover_safety_test.py
          mypy
          PYTHONPATH=src pytest -q \
            tests/host_core_subscription_creation_test.py \
            tests/host_core_cutover_safety_test.py \
            tests/host_core_business_acceptance_test.py \
            tests/host_core_api_transition_test.py \
            tests/host_core_worker_policy_test.py \
            tests/wechat_subscription_gate_test.py \
            tests/sender_agent_test.py

      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(host-core): serialize subscriptions and protect ownership"
          git push origin HEAD:fix/host-core-subscription-serialization-v070
