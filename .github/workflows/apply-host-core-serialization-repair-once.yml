name: Apply Host Core serialization repair once

on:
  push:
    branches:
      - fix/host-core-subscription-serialization-v070

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
