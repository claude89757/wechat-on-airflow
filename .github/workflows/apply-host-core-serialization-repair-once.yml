ROOT = Path(__file__).resolve().parents[1]


def test_full_cutover_reads_host_ownership_before_any_d1_export() -> None:
    workflow = (ROOT / ".github/workflows/production-host-core.yml").read_text(
        encoding="utf-8"
    )

    owner_check = workflow.index('owner_state_json="$(remote owner-state | tail -n 1)"')
    initial_export = workflow.index('initial_snapshot="$(export_d1_snapshot initial)"')
    assert owner_check < initial_export
    assert "Host Core already owns durable state" in workflow
    assert "refusing to re-import D1" in workflow
    assert "Public and host ownership disagree" in workflow


