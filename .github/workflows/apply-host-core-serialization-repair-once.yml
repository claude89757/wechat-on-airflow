          Path("tests/host_core_subscription_creation_test.py").write_text(
              '''from __future__ import annotations

from datetime import UTC, datetime
from inspect import getsource
from unittest.mock import Mock

from wechat_airflow.host_core import api


def test_subscription_creation_takes_per_email_transaction_lock() -> None:
    connection = Mock()

    api._lock_subscription_creation(connection, "person@example.com")

    statement = str(connection.execute.call_args.args[0])
    parameters = connection.execute.call_args.args[1]
    assert "pg_advisory_xact_lock" in statement
    assert "zacks-subscription-create" in statement
    assert parameters == {"email": "person@example.com"}


def test_expired_duplicate_cleanup_is_scoped_to_identity_and_key() -> None:
    connection = Mock()
    now = datetime(2026, 9, 5, tzinfo=UTC)

    api._deactivate_expired_duplicate(
        connection,
        email="person@example.com",
        dedupe_key="duplicate-key",
        now=now,
    )

    statement = str(connection.execute.call_args.args[0])
    parameters = connection.execute.call_args.args[1]
    assert "UPDATE zacks.subscriptions" in statement
    assert "active_until <= :now" in statement
    assert "email = :email" in statement
    assert "dedupe_key = :dedupe_key" in statement
    assert parameters == {
        "email": "person@example.com",
        "dedupe_key": "duplicate-key",
        "now": now,
    }


def test_subscription_lock_and_expiry_cleanup_precede_limit_and_insert() -> None:
    source = getsource(api.create_subscription)

    lock = source.index("_lock_subscription_creation")
    limit = source.index("SELECT count(*)")
    cleanup = source.index("_deactivate_expired_duplicate")
    duplicate_check = source.index("SELECT id FROM zacks.subscriptions")
    insert = source.index("INSERT INTO zacks.subscriptions")

    assert lock < limit < cleanup < duplicate_check < insert
''',
              encoding="utf-8",
          )

