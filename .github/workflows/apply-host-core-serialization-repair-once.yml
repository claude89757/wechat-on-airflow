              '''- Preserve every active venue polling cadence and isolate existing email and
  WeChat delivery from Cloudflare D1 availability.

### Fixed

- Serialize subscription creation per verified email before checking the active
  subscription limit, and retire an expired duplicate before inserting its
  replacement.
- Make the Host Core ownership check authoritative before any D1 export so a
  routine exact-commit upgrade can never overwrite PostgreSQL with rollback data.

## [0.6.6] - 2026-08-31
''',
