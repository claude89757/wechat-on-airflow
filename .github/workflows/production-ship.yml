name: Production Ship
run-name: production/ship/${{ inputs.version }}/${{ inputs.target_commit }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_commit:
        required: true
        type: string
      scope:
        required: false
        default: auto
        type: string
      include_sender:
        required: false
        default: false
        type: boolean
    outputs:
      resolved_scope:
        description: Resolved component scope
        value: ${{ jobs.deploy.outputs.resolved_scope }}
      deploy_webapp:
        description: Whether Web deployment was planned
        value: ${{ jobs.deploy.outputs.deploy_webapp }}
      deploy_airflow:
        description: Whether Airflow deployment was planned
        value: ${{ jobs.deploy.outputs.deploy_airflow }}
      deploy_sender:
        description: Whether sender deployment was planned
        value: ${{ jobs.deploy.outputs.deploy_sender }}
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix
        required: true
        type: string
      target_commit:
        description: Exact commit SHA on main
        required: true
        type: string
      scope:
        description: Component scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - webapp
          - airflow
          - sender
          - control
      include_sender:
        description: Explicit approval for an in-scope sender deployment
        required: true
        default: false
        type: boolean

permissions:
  checks: read
  contents: write

concurrency:
  group: production-ship-v1
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate version before production mutation
        env:
          VERSION: ${{ inputs.version }}
          SCOPE: ${{ inputs.scope }}
          SENDER: ${{ inputs.include_sender }}
        run: |
          python scripts/release_contract.py --version "$VERSION"
          if [ "$VERSION" = 0.7.0 ]; then
            test "$SCOPE" = all
            test "$SENDER" = true
          fi

  host_core_cutover:
    if: inputs.version == '0.7.0'
    needs: contract
    uses: ./.github/workflows/production-host-core.yml
    with:
      operation: full-cutover
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit

  deploy:
    needs: [contract, host_core_cutover]
    if: >-
      always() &&
      needs.contract.result == 'success' &&
      (inputs.version != '0.7.0' || needs.host_core_cutover.result == 'success')
    uses: ./.github/workflows/production-release.yml
    with:
      mode: apply
      target_commit: ${{ inputs.target_commit }}
      scope: ${{ inputs.scope }}
      include_sender: ${{ inputs.include_sender }}
    secrets: inherit

  natural_cycles:
    if: inputs.version == '0.7.0'
    needs: deploy
    uses: ./.github/workflows/production-host-core.yml
    with:
      operation: activate-workers
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit

  acceptance:
    if: inputs.version == '0.7.0'
    needs: natural_cycles
    uses: ./.github/workflows/production-host-core.yml
    with:
      operation: acceptance
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit

  safe_pause_on_failure:
    if: >-
      always() && inputs.version == '0.7.0' &&
      needs.host_core_cutover.result == 'success' &&
      (needs.deploy.result != 'success' || needs.natural_cycles.result != 'success' || needs.acceptance.result != 'success')
    needs: [host_core_cutover, deploy, natural_cycles, acceptance]
    uses: ./.github/workflows/production-host-core.yml
    with:
      operation: pause
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit

  tag:
    needs: [deploy, acceptance]
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (inputs.version != '0.7.0' || needs.acceptance.result == 'success')
    uses: ./.github/workflows/release-tag-chatops.yml
    with:
      version: ${{ inputs.version }}
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit

  record:
    if: always()
    needs: [contract, host_core_cutover, deploy, natural_cycles, acceptance, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Record ship result
        env:
          VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          RESOLVED_SCOPE: ${{ needs.deploy.outputs.resolved_scope }}
          WEBAPP_PLANNED: ${{ needs.deploy.outputs.deploy_webapp }}
          AIRFLOW_PLANNED: ${{ needs.deploy.outputs.deploy_airflow }}
          SENDER_PLANNED: ${{ needs.deploy.outputs.deploy_sender }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          HOST_CORE_CUTOVER_RESULT: ${{ needs.host_core_cutover.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          NATURAL_CYCLES_RESULT: ${{ needs.natural_cycles.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          TAG_RESULT: ${{ needs.tag.result }}
        run: |
          {
            echo "## Production ship"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$TARGET_COMMIT\`"
            echo "- Requested scope: \`$REQUESTED_SCOPE\`"
            echo "- Resolved scope: \`$RESOLVED_SCOPE\`"
            echo "- Components: webapp=\`$WEBAPP_PLANNED\`, airflow=\`$AIRFLOW_PLANNED\`, sender=\`$SENDER_PLANNED\`"
            echo "- Release contract: \`$CONTRACT_RESULT\`"
            echo "- Host-core cutover: \`$HOST_CORE_CUTOVER_RESULT\`"
            echo "- Deployment: \`$DEPLOY_RESULT\`"
            echo "- Three natural cycles: \`$NATURAL_CYCLES_RESULT\`"
            echo "- Final production acceptance: \`$ACCEPTANCE_RESULT\`"
            echo "- Immutable tag and GitHub Release: \`$TAG_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CONTRACT_RESULT" = success
          test "$DEPLOY_RESULT" = success
          if [ "$VERSION" = 0.7.0 ]; then
            test "$HOST_CORE_CUTOVER_RESULT" = success
            test "$NATURAL_CYCLES_RESULT" = success
            test "$ACCEPTANCE_RESULT" = success
          fi
          test "$TAG_RESULT" = success
