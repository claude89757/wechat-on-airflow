name: Harden Mobile Venue Card Patch

on:
  push:
    branches:
      - feat/mobile-venue-card-quick-create-20260830

permissions:
  contents: write

concurrency:
  group: harden-mobile-venue-card-patch
  cancel-in-progress: false

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[venue-card-script-fixed]') && !contains(github.event.head_commit.message, '[venue-card-ux-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-venue-card-quick-create-20260830
          fetch-depth: 0

      - name: Remove accidental whitespace from effect markers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/patch_mobile_venue_cards.py')
          source = path.read_text(encoding='utf-8')
          before = "  }, [receipt?.token]);\n  ''',"
          after = "  }, [receipt?.token]);\n''',"
          count = source.count(before)
          if count != 2:
              raise SystemExit(f'unexpected receipt effect marker count: {count}')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY

      - name: Validate patch script
        run: |
          python -m py_compile scripts/patch_mobile_venue_cards.py
          git diff --check

      - name: Commit patch hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_mobile_venue_cards.py
          git commit -m "ci: harden venue card patch markers [venue-card-script-fixed]"
          git push origin HEAD:feat/mobile-venue-card-quick-create-20260830
