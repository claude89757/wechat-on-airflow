name: Format delivery tier migration test

on:
  push:
    branches:
      - feat/subscriber-email-tiers
    paths:
      - .github/workflows/format-delivery-tier-migration-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscriber-email-tiers
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format with repository Ruff version
        run: |
          python -m pip install ruff==0.12.11
          ruff format tests/webapp_delivery_tiers_migration_test.py
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/format-delivery-tier-migration-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format subscriber tier migration test"
          git push origin HEAD:feat/subscriber-email-tiers
