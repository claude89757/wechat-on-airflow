name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: PYTHONPATH=src pytest -m 'not airflow'
      - name: Install web application dependencies
        working-directory: webapp
        run: npm ci
      - name: Verify web application
        run: make webapp-check
      - name: Validate active components and runtime drift
        run: PYTHONPATH=src python scripts/check_active_components.py
      - name: Validate Compose
        run: make compose-config
      - name: Build Airflow image
        run: make image
      - name: Build WeChat sender image
        run: make sender-image
      - name: Airflow 3 DAG imports
        run: make test-dags
