name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: host-core-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'feat/airflow-host-core-v0.7.0-final3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/airflow-host-core-v0.7.0-final3
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Normalize release wiring and Python sources
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_plan = Path("scripts/release_plan.py")
          text = release_plan.read_text(encoding="utf-8")
          marker = "METADATA_EXACT = {\n"
          assert marker in text
          if '    "VERSION",\n' not in text:
              text = text.replace(marker, marker + '    "VERSION",\n', 1)
          release_plan.write_text(text, encoding="utf-8")

          dockerfile = Path("docker/airflow/Dockerfile")
          text = dockerfile.read_text(encoding="utf-8")
          install = "RUN pip install --no-cache-dir --no-deps /opt/airflow/project"
          assert install in text
          if 'import fastapi, sqlalchemy, uvicorn' not in text:
              text = text.replace(
                  install,
                  install + '\nRUN python -c "import fastapi, sqlalchemy, uvicorn"',
                  1,
              )
          dockerfile.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "## Unreleased\n\n"
          assert anchor in text
          if "## [0.7.0]" not in text:
              section = """## [0.7.0] - 2026-09-04

### Added

- Add the PostgreSQL-backed Airflow-host subscription, observation, notification,
  migration, and delivery runtime, including an exact-commit API service and a
  leased notification worker.
- Add a protected dual-write migration and cutover workflow that transfers the
  existing D1 state and Tencent SES configuration without exposing plaintext
  credentials to GitHub or sending synthetic notifications.
- Add a stateless Cloudflare edge gateway that continues serving the Web assets
  while proxying API calls to the host after cutover.

### Changed

- Make the Airflow-host PostgreSQL schema the authoritative durable business
  store for existing subscriptions, email delivery, deduplication, quotas, and
  venue-level WeChat eligibility.
- Remove Cloudflare D1 from the live notification decision path after cutover;
  Redis remains optional acceleration only, and D1 is retained read-only during
  the rollback window.
- Keep all 26 venue polling schedules unchanged while allowing email and WeChat
  delivery to continue independently of Cloudflare D1 availability.

"""
              text = text.replace(anchor, anchor + section, 1)
          changelog.write_text(text, encoding="utf-8")
          PY
          python -m pip install ruff==0.12.11
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit normalized result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(host-core): normalize release implementation"
          git push origin HEAD:feat/airflow-host-core-v0.7.0-final3
