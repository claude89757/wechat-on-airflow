name: One-time final cutover progress audit

on:
  push:
    branches:
      - ops/cutover-progress-audit-20260905

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AIRFLOW_SSH_HOST: ${{ secrets.AIRFLOW_SSH_HOST }}
      AIRFLOW_SSH_PORT: ${{ secrets.AIRFLOW_SSH_PORT }}
      AIRFLOW_SSH_USER: ${{ secrets.AIRFLOW_SSH_USER }}
      AIRFLOW_REPOSITORY_PATH: ${{ secrets.AIRFLOW_REPOSITORY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AIRFLOW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AIRFLOW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Read production state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$AIRFLOW_SSH_PORT" "$AIRFLOW_SSH_USER@$AIRFLOW_SSH_HOST" \
            bash -s -- "$AIRFLOW_REPOSITORY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          compose() { docker compose "$@"; }
          echo '__HEAD__'
          git rev-parse HEAD
          echo '__SERVICES__'
          compose ps --services --status running
          echo '__VARIABLES__'
          api="$(compose ps --services --status running | awk '/^airflow-api-server$|^web$/{print; exit}')"
          for name in ZACKS_DELIVERY_OWNER ZACKS_OBSERVATION_MODE ZACKS_WECHAT_GATE_SOURCE WEBAPP_WECHAT_SUBSCRIPTION_GATE_MODE WEBAPP_OBSERVATION_API_URL; do
            printf '%s=' "$name"
            compose exec -T "$api" airflow variables get "$name" 2>/dev/null | tail -n 1 || true
          done
          echo '__LOCAL_HEALTH__'
          curl -sS --max-time 10 http://127.0.0.1:8090/zacks-api/api/healthz || true
          echo
          curl -sS --max-time 10 http://127.0.0.1:8090/zacks-api/api/readyz || true
          echo
          if compose ps --services --status running | grep -qx zacks-api; then
            echo '__POSTGRES_STATE__'
            compose exec -T zacks-api python - <<'PY'
          import json
          from sqlalchemy import text
          from wechat_airflow.host_core.database import transaction
          with transaction() as connection:
              migration = connection.execute(text("SELECT source, source_revision, imported_at, cutover_at, updated_at FROM zacks.migration_state ORDER BY updated_at DESC LIMIT 1")).mappings().first()
              venues = connection.execute(text("SELECT count(*) AS total, count(*) FILTER (WHERE last_inspection_at >= now() - interval '15 minutes') AS recent, max(last_inspection_at) AS latest FROM zacks.venue_status")).mappings().one()
              subscriptions = connection.execute(text("SELECT count(*) FROM zacks.subscriptions WHERE active = true AND active_until > now()")).scalar_one()
              outbox = connection.execute(text("SELECT status, count(*) AS count FROM zacks.notification_outbox GROUP BY status ORDER BY status")).mappings().all()
              system = connection.execute(text("SELECT status, count(*) AS count FROM zacks.system_email_outbox GROUP BY status ORDER BY status")).mappings().all()
          def clean(value):
              if value is None: return None
              if hasattr(value, 'isoformat'): return value.isoformat()
              return value
          print(json.dumps({
              'migration': {key: clean(value) for key, value in dict(migration or {}).items()},
              'venues': {key: clean(value) for key, value in dict(venues).items()},
              'activeSubscriptions': int(subscriptions or 0),
              'notificationOutbox': [dict(row) for row in outbox],
              'systemEmailOutbox': [dict(row) for row in system],
          }, sort_keys=True))
          PY
          fi
          REMOTE
