version: 2

# Stability-first dependency policy:
# - routine version-update pull requests are disabled for every ecosystem;
# - security-update pull requests can still be created when Dependabot security
#   updates are enabled in the repository settings;
# - broader dependency refreshes happen only in an explicit maintenance window.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /docker/airflow
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /docker/sender
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
